  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .hint { font-size: 13px; color: var(--color-text-muted); margin-bottom: 16px; max-width: 760px; line-height: 1.5; }

<body>
  <div class="app-layout">
    <header class="header">
      <button id="hamburger" class="hamburger">☰</button>
      <a href="/superadmin/dashboard.html" class="header-logo">
        <img src="/images/causify-logo-navbar-clara.png" alt="Causify" style="height:28px">
      </a>
      <div class="header-user">
        <span class="header-user-name"></span>
        <span class="header-tenant" style="font-size:11px;color:#9ca3af;margin-left:4px"></span>

    <aside class="sidebar"><ul class="sidebar-nav"></ul></aside>
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Segurança</h1>
      </div>
      <p class="hint">
        Configurações da sua conta de SuperAdmin. A verificação em duas etapas é opcional, mas recomendada:
        esta conta acessa todos os escritórios e pode entrar como qualquer usuário.
      </p>

      <div class="secao">
        <h2>Verificação em duas etapas</h2>
        <div id="mfaSecao"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminLayout } from '/superadmin/js/superAdminLayout.js';
    import { saFetch } from '/superadmin/js/superAdminApi.js';
    import { montarMfa } from '/js/mfa-config.js';

    initAdminLayout();
    montarMfa(document.getElementById('mfaSecao'), saFetch);
  </script>
