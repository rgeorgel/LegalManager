<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Usuários</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .filters input, .filters select { padding: 7px 12px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px; background: var(--color-surface); }
    .filters input { flex: 1; min-width: 200px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--color-surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--color-border); }
    .data-table th { text-align: left; padding: 10px 12px; background: #f8fafc; border-bottom: 2px solid var(--color-border); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-muted); white-space: nowrap; }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #f9fafb; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 100px; }
    .badge-green { background: #dcfce7; color: #15803d; }
    .badge-amber { background: #fef3c7; color: #92400e; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-gray { background: #f3f4f6; color: #4b5563; }
    .badge-red { background: #fee2e2; color: #b91c1c; }
    .pagination { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; }
    .pagination button { padding: 5px 12px; border: 1px solid var(--color-border); border-radius: 5px; background: var(--color-surface); cursor: pointer; }
    .pagination button:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <div class="app-layout">
    <header class="header">
      <button id="hamburger" class="hamburger">☰</button>
      <a href="/superadmin/dashboard.html" class="header-logo">
        <img src="/images/causify-logo-navbar-clara.png" alt="Causify" style="height:28px">
      </a>
      <div class="header-user">
        <span class="header-user-name"></span>
        <span class="header-tenant" style="font-size:11px;color:#9ca3af;margin-left:4px"></span>
        <button id="logoutBtn" class="btn btn-sm">Sair</button>
      </div>
    </header>
    <aside class="sidebar"><ul class="sidebar-nav"></ul></aside>
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Usuários</h1>
      </div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Buscar por nome ou e-mail...">
        <select id="ativoFilter">
          <option value="">Todos</option>
          <option value="true">Ativos</option>
          <option value="false">Inativos</option>
        </select>
      </div>

      <div style="overflow-x:auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Escritório</th>
              <th>Plano</th>
              <th>Perfil</th>
              <th>Ativo</th>
              <th>Último acesso</th>
              <th>Cadastro</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" style="text-align:center;color:var(--color-text-muted);padding:24px">Carregando...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <button id="prevBtn" disabled>← Anterior</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" disabled>Próxima →</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminLayout } from '/superadmin/js/superAdminLayout.js';
    import { saFetch } from '/superadmin/js/superAdminApi.js';

    initAdminLayout();

    const PLAN_COLORS = { Free: 'gray', Plus: 'blue', Pro: 'amber', Max: 'green', Enterprise: 'blue' };
    const PERFIL_COLORS = { Admin: 'blue', Advogado: 'amber', Colaborador: 'gray', Cliente: 'green' };

    let page = 1;
    const pageSize = 30;
    let total = 0;

    function esc(s) { return (s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    async function load() {
      const search = document.getElementById('searchInput').value;
      const ativo = document.getElementById('ativoFilter').value;
      const params = new URLSearchParams({ page, pageSize });
      if (search) params.set('search', search);
      if (ativo !== '') params.set('ativo', ativo);

      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="8" style="text-align:center;color:var(--color-text-muted);padding:24px">Carregando...</td></tr>';
      try {
        const data = await saFetch(`/superadmin/users?${params}`);
        total = data.total;

        if (data.items.length === 0) {
          document.getElementById('tableBody').innerHTML =
            '<tr><td colspan="8" style="text-align:center;color:var(--color-text-muted);padding:24px">Nenhum usuário encontrado.</td></tr>';
        } else {
          document.getElementById('tableBody').innerHTML = data.items.map(u => `
            <tr>
              <td style="font-weight:500">${esc(u.nome)}</td>
              <td style="color:var(--color-text-muted);font-size:12px">${esc(u.email ?? '—')}</td>
              <td>
                <a href="/superadmin/tenants.html?id=${u.tenantId}" style="color:var(--color-primary);text-decoration:none">${esc(u.tenantNome)}</a>
              </td>
              <td><span class="badge badge-${PLAN_COLORS[u.tenantPlano] ?? 'gray'}">${u.tenantPlano}</span></td>
              <td><span class="badge badge-${PERFIL_COLORS[u.perfil] ?? 'gray'}">${u.perfil}</span></td>
              <td>
                <span class="badge badge-${u.ativo ? 'green' : 'red'}">${u.ativo ? 'Sim' : 'Não'}</span>
              </td>
              <td style="color:var(--color-text-muted);font-size:12px">${fmtDate(u.ultimoAcessoEm)}</td>
              <td style="color:var(--color-text-muted);font-size:12px">${fmtDate(u.criadoEm)}</td>
            </tr>`).join('');
        }

        const pages = Math.ceil(total / pageSize);
        document.getElementById('pageInfo').textContent = `Página ${page} de ${Math.max(1, pages)} (${total} usuários)`;
        document.getElementById('prevBtn').disabled = page <= 1;
        document.getElementById('nextBtn').disabled = page >= pages;
      } catch (e) {
        document.getElementById('tableBody').innerHTML =
          `<tr><td colspan="8" style="color:var(--color-danger);padding:16px">Erro: ${esc(e.message)}</td></tr>`;
      }
    }

    document.getElementById('prevBtn').addEventListener('click', () => { page--; load(); });
    document.getElementById('nextBtn').addEventListener('click', () => { page++; load(); });
    document.getElementById('ativoFilter').addEventListener('change', () => { page = 1; load(); });

    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { page = 1; load(); }, 350);
    });

    load();
  </script>
</body>
</html>
