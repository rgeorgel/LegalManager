  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Tenants</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/superadmin/css/tenant.css">
  <style>
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .filters input, .filters select { padding: 7px 12px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px; background: var(--color-surface); }
    .filters input { flex: 1; min-width: 180px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--color-surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--color-border); }
    .data-table th { text-align: left; padding: 10px 12px; background: #f8fafc; border-bottom: 2px solid var(--color-border); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-muted); white-space: nowrap; }
    .data-table th.sortable { cursor: pointer; user-select: none; }
    .data-table th.sortable:hover { color: var(--color-text); }
    .sort-indicator { display: inline-block; margin-left: 3px; }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--color-bg); }
    /* Assinantes (pagam assinatura) em verde claro para chamar atenção */
    .data-table tr.assinante td { background: rgba(34, 197, 94, .08); }
    .data-table tr.assinante:hover td { background: rgba(34, 197, 94, .14); }
    .data-table tr.assinante td:first-child { box-shadow: inset 3px 0 0 #22c55e; }
    .tenant-card.assinante { background: rgba(34, 197, 94, .08); border-color: rgba(34, 197, 94, .55); box-shadow: inset 4px 0 0 #22c55e; }
    /* A grade do layout usa 1fr (min-width auto): sem isto a tabela empurra a página para além da tela. */
    .main-content { min-width: 0; }
    .data-table th, .data-table td { vertical-align: top; }
    .data-table td.tenant-nome { min-width: 160px; }
    .data-table .t-nome { display: block; font-weight: 600; word-break: break-word; color: var(--color-text); text-decoration: none; }
    .data-table .t-nome:hover, .tenant-card-nome:hover { color: var(--color-primary); text-decoration: underline; }
    a.action-btn { display: inline-block; text-decoration: none; }
    .data-table .t-sub { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }
    .data-table td.tenant-acoes { white-space: nowrap; width: 1%; }
    .uso-linha { font-size: 11px; line-height: 1.3; min-width: 120px; }
    .uso-linha + .uso-linha { margin-top: 6px; }
    .uso-linha-topo { display: flex; justify-content: space-between; gap: 8px; color: var(--color-text-muted); }
    .uso-linha-topo strong { color: var(--color-text); font-weight: 500; font-variant-numeric: tabular-nums; }
    /* Atividade em grade (rótulo | número | badges): as colunas se alinham entre as linhas. */
    .ativ-grid { display: grid; grid-template-columns: auto auto auto; gap: 5px 8px; align-items: center; font-size: 11px; line-height: 1.3; }
    .ativ-linha { display: contents; }
    .ativ-linha > .ativ-label { color: var(--color-text-muted); }
    .ativ-linha > strong { text-align: right; font-variant-numeric: tabular-nums; }
    .ativ-badges { display: flex; gap: 3px; }
    .t-nome-linha { display: flex; align-items: center; gap: 4px; }
    .t-nome-linha > a { min-width: 0; }
    .t-nome-linha .mascotes-inline { flex-shrink: 0; }
    .t-plano { margin-top: 8px; }
    .t-plano .badges-col { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .datas-linha { font-size: 11px; line-height: 1.35; color: var(--color-text-muted); white-space: nowrap; }
    .datas-linha + .datas-linha { margin-top: 5px; }
    .datas-linha strong { color: var(--color-text); font-weight: 500; }
    /* Menu "⋯" das ações secundárias (tabela) */
    .acoes { display: flex; gap: 4px; align-items: flex-start; }
    .acoes-menu { position: relative; }
    .acoes-menu > summary { list-style: none; }
    .acoes-menu > summary::-webkit-details-marker { display: none; }
    .acoes-menu-itens { position: fixed; z-index: 900; min-width: 150px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 4px; display: flex; flex-direction: column; }
    .acoes-menu-itens button { background: none; border: none; text-align: left; padding: 7px 10px; font-size: 13px; border-radius: 5px; cursor: pointer; color: var(--color-text); }
    .acoes-menu-itens button:hover { background: var(--color-bg); }
    .acoes-menu-itens button.danger { color: #dc2626; }
    .acoes-menu-itens button.danger:hover { background: #fef2f2; }
    .acoes-menu-itens hr { border: none; border-top: 1px solid var(--color-border); margin: 4px 0; }
    /* Alternância blocos/lista (mesmo visual de Processos) */
    .view-toggle { display: flex; gap: 4px; align-items: center; }
    .view-btn { width: 36px; height: 36px; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); color: var(--color-text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: .2s; }
    .view-btn:hover { background: var(--color-bg); }
    .view-btn.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
    /* Visão em blocos */
    .tenants-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .tenant-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .tenant-card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .tenant-card-nome { display: block; font-size: 15px; font-weight: 600; word-break: break-word; color: var(--color-text); text-decoration: none; }
    .tenant-card-sub { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
    .tenant-card-head .badges-col { align-items: flex-end; flex-shrink: 0; }
    .tenant-card-secao { border-top: 1px solid var(--color-border); padding-top: 10px; }
    .tenant-card-secao-titulo { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); margin-bottom: 6px; }
    .tenant-card-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tenant-card-acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; border-top: 1px solid var(--color-border); padding-top: 10px; }
    /* Paginação (mesmo padrão de Processos) */
    .paginacao-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-top: 20px; }
    .paginacao-bar .pagination { margin-top: 0; flex-wrap: wrap; gap: 4px; }
    .paginacao-bar .pagination button { padding: 6px 12px; min-width: 36px; min-height: 36px; }
    .paginacao-bar .pagination button.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .paginacao-bar .pagination .reticencias { padding: 6px 4px; color: var(--color-text-muted); }
    .paginacao-info { font-size: 13px; color: var(--color-text-muted); }
    .paginacao-tamanho { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-muted); margin: 0; }
    .paginacao-tamanho select { padding: 6px 10px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px; background: var(--color-surface); color: var(--color-text); }
    /* Filtros avançados: "tem / não tem" por recurso e tema */
    .filtros-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px; background: var(--color-surface); color: var(--color-text); cursor: pointer; }
    .filtros-btn:hover { background: var(--color-bg); }
    .filtros-btn[aria-expanded="true"] { border-color: var(--color-primary); color: var(--color-primary); }
    .filtros-btn .filtros-count { background: var(--color-primary); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 600; padding: 0 7px; line-height: 18px; }
    .filtros-painel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 14px 16px; margin: -4px 0 16px; display: flex; flex-direction: column; gap: 12px; }
    .filtros-painel[hidden], .filtros-count[hidden], .filtros-limpar[hidden] { display: none; }
    .filtros-topo { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
    .filtros-topo label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-muted); }
    .filtros-topo select { padding: 6px 10px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px; background: var(--color-surface); color: var(--color-text); }
    .filtros-dica { font-size: 12px; color: var(--color-text-muted); }
    .filtros-limpar { background: none; border: none; color: var(--color-primary); font-size: 13px; cursor: pointer; padding: 4px 0; }
    .filtros-limpar:hover { text-decoration: underline; }
    .filtros-grupos { display: flex; flex-direction: column; gap: 10px; }
    .filtros-grupo-titulo { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); margin-bottom: 6px; }
    .filtros-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .filtro-chip { border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; user-select: none; }
    .filtro-chip:hover { border-color: var(--color-text-muted); }
    .filtro-chip[data-estado="tem"] { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .filtro-chip[data-estado="nao"] { background: #fee2e2; border-color: #ef4444; color: #991b1b; text-decoration: line-through; }
    .filtro-chip[data-estado="tem"]::before { content: '✓ '; }
    .filtro-chip[data-estado="nao"]::before { content: '✕ '; }
    @media (max-width: 768px) {
      .filters { flex-direction: column; align-items: stretch; }
      .filtros-btn { justify-content: center; }
      .filtros-topo select { font-size: 16px; }
      .filters input, .filters select { width: 100%; min-width: 0; font-size: 16px; }
      /* No celular a lista não cabe: fica sempre em blocos. */
      .view-toggle { display: none; }
      .tenants-grid { grid-template-columns: 1fr; }
      .paginacao-bar { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <header class="header">
      <button id="hamburger" class="hamburger">☰</button>
      <a href="/superadmin/dashboard.html" class="header-logo">
        <img src="/images/causify-logo-navbar-clara.png" alt="Causify" style="height:28px">
      </a>
      <div class="header-user">
        <span class="header-user-name"></span>
        <span class="header-tenant" style="font-size:11px;color:#9ca3af;margin-left:4px"></span>
        <button id="logoutBtn" class="btn btn-sm">Sair</button>
      </div>
    </header>
    <aside class="sidebar"><ul class="sidebar-nav"></ul></aside>
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Tenants</h1>
      </div>

      <div class="filters">
        <input type="text" id="searchInput" placeholder="Buscar por nome ou CNPJ...">
        <select id="statusFilter">
          <option value="">Todos os status</option>
          <option value="Ativo">Ativo</option>
          <option value="Trial">Trial</option>
          <option value="Suspenso">Suspenso</option>
          <option value="Cancelado">Cancelado</option>
        </select>
        <select id="planoFilter">
          <option value="">Todos os planos</option>
          <option value="Free">Free</option>
          <option value="Plus">Plus</option>
          <option value="Pro">Pro</option>
          <option value="Max">Max</option>
          <option value="Enterprise">Enterprise</option>
        </select>
        <select id="sortSelect" title="Ordenação">
          <option value="cadastro:desc">Cadastro: mais recentes</option>
          <option value="cadastro:asc">Cadastro: mais antigos</option>
          <option value="nome:asc">Nome: A–Z</option>
          <option value="nome:desc">Nome: Z–A</option>
          <option value="ultimoAcesso:desc">Último acesso: mais recente</option>
          <option value="ultimoAcesso:asc">Último acesso: mais antigo</option>
        </select>
        <button type="button" class="filtros-btn" id="filtrosBtn" aria-expanded="false" aria-controls="filtrosPainel">
          Filtros <span class="filtros-count" id="filtrosCount" hidden></span>
        </button>
        <div class="view-toggle">
          <button type="button" class="view-btn" id="viewGrid" title="Visualização em blocos">⊞</button>
          <button type="button" class="view-btn" id="viewList" title="Visualização em lista">☰</button>
        </div>
      </div>

      <div class="filtros-painel" id="filtrosPainel" hidden>
        <div class="filtros-topo">
          <label>Tema
            <select id="temaFilter">
              <option value="">Qualquer tema</option>
              <option value="padrao">Padrão (sem personalização)</option>
              <option value="personalizado">Qualquer personalização</option>
              <optgroup label="Preset" id="temaPresets"></optgroup>
            </select>
          </label>
          <span class="filtros-dica">Clique num recurso: 1× <strong>tem</strong> · 2× <strong>não tem</strong> · 3× ignora</span>
          <button type="button" class="filtros-limpar" id="filtrosLimpar" hidden>Limpar filtros</button>
        </div>
        <div class="filtros-grupos" id="filtrosGrupos"></div>
      </div>

      <div id="tenantsStatus" style="text-align:center;color:var(--color-text-muted);padding:24px">Carregando...</div>
      <div id="tenantsGrid" class="tenants-grid" style="display:none"></div>
      <div id="tenantsTableWrap" style="overflow-x:auto;display:none">
        <table class="data-table">
          <thead>
            <tr>
              <th class="sortable" data-sort="nome">Escritório<span class="sort-indicator" data-indicator="nome"></span></th>
              <th title="Uso dos limites do plano">Uso do plano</th>
              <th>Atividade</th>
              <th title="Tema personalizado, adoção dos módulos de honorários/contratos, calculadora de prazos e calculadora de honorários, e mascotes do assistente">Recursos</th>
              <th class="sortable" data-sort="ultimoAcesso">Acesso / Expira<span class="sort-indicator" data-indicator="ultimoAcesso"></span></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="paginacao-bar" id="paginacaoBar" style="display:none">
        <span class="paginacao-info" id="paginacaoInfo"></span>
        <div class="pagination" id="pagination"></div>
        <label class="paginacao-tamanho">Por página
          <select id="pageSizeSelect">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>
    </main>
  </div>

  <script type="module">
    import { esc } from '/js/utils.js';
    import { PRESETS } from '/js/presets.js';
    import { initAdminLayout } from '/superadmin/js/superAdminLayout.js';
    import { saFetch } from '/superadmin/js/superAdminApi.js';
    import { initTenantAcoes, showToast } from '/superadmin/js/tenantAcoes.js';
    import {
      fmtDate, fmtDateTime, fmtBytes, fmtMb, pctBar, daysAgo, countdownBadge, recursosCell, planoHtml, mascotesInline, ehAssinante
    } from '/superadmin/js/tenantFormat.js';

    initAdminLayout();
    initTenantAcoes({
      onAlterado: () => load(),
      onExcluido: nome => { showToast(`Tenant "${nome}" excluído permanentemente.`); load(); },
    });
    // Link antigo (dashboard, usuários, favoritos): a ficha do tenant agora é uma página própria.
    const urlId = new URLSearchParams(location.search).get('id');
    if (urlId) location.replace(`/superadmin/tenant-detalhe.html?id=${encodeURIComponent(urlId)}`);

    const detalheUrl = id => `/superadmin/tenant-detalhe.html?id=${id}`;
    let page = 1;
    let total = 0;
    // Itens por página e modo de visualização: escolhas do superadmin lembradas no navegador.
    const PAGE_SIZES = [10, 20, 50, 100];
    const PAGE_SIZE_STORAGE_KEY = 'superadmin.tenants.pageSize';
    const VIEW_STORAGE_KEY = 'superadmin.tenants.view';
    let pageSize = 20;
    let view = 'list';
    try {
      const salvo = Number(localStorage.getItem(PAGE_SIZE_STORAGE_KEY));
      if (PAGE_SIZES.includes(salvo)) pageSize = salvo;
      if (localStorage.getItem(VIEW_STORAGE_KEY) === 'grid') view = 'grid';
    } catch { /* storage indisponível: ficam os padrões */ }
    let ultimosItens = [];
    // Ordenação persistida em localStorage (sobrevive a atualização de página e reabertura do
    // navegador) -- validado contra os mesmos valores aceitos pelo backend (GetTenants), caindo
    // no default de hoje (cadastro desc) se o valor salvo for inválido ou o storage não puder ser
    // lido (ex: modo privado em alguns navegadores).
    const SORT_STORAGE_KEY = 'superadmin.tenants.sort';
    function loadSavedSort() {
      try {
        const raw = localStorage.getItem(SORT_STORAGE_KEY);
        if (!raw) return null;
        const saved = JSON.parse(raw);
        if (!['nome', 'cadastro', 'ultimoAcesso'].includes(saved.sortBy)) return null;
        if (!['asc', 'desc'].includes(saved.sortDir)) return null;
        return saved;
      } catch { return null; }
    }
    function saveSort() {
      try { localStorage.setItem(SORT_STORAGE_KEY, JSON.stringify({ sortBy, sortDir })); } catch {}
    }
    const savedSort = loadSavedSort();
    let sortBy = savedSort?.sortBy ?? 'cadastro';
    let sortDir = savedSort?.sortDir ?? 'desc';

    // ── Filtros avançados ("tem / não tem" por recurso e tema) ──
    // As chaves batem com SuperAdminController.FiltroRecurso; ficam na URL (?tem=&naoTem=&tema=)
    // para sobreviver ao recarregar e poder mandar o link filtrado.
    const FILTROS_RECURSO = [
      { grupo: 'Processos', itens: [
        ['processos', 'Processos'], ['monitorados', 'Processos monitorados'], ['publicacoes', 'Publicações'],
        ['oabs', 'OAB cadastrada'], ['oabErro', 'OAB com erro de sync'],
      ] },
      { grupo: 'Rotina', itens: [
        ['tarefas', 'Tarefas'], ['eventos', 'Agenda'], ['contatos', 'Contatos'], ['atendimentos', 'Atendimentos'],
        ['timesheet', 'Timesheet'],
      ] },
      { grupo: 'Documentos', itens: [
        ['documentos', 'Documentos'], ['modelos', 'Modelos de documento'], ['pecasIA', 'Peças com IA'],
      ] },
      { grupo: 'Ferramentas', itens: [
        ['calculoPrazo', 'Calculou prazos'], ['calculoHonorarios', 'Calculadora de honorários'],
        ['contratosHonorarios', 'Contratos de honorário'], ['financeiro', 'Financeiro'],
        ['assistente', 'Usou o assistente IA'], ['portalCliente', 'Portal do cliente'],
      ] },
      { grupo: 'Conta', itens: [
        ['assinatura', 'Assinatura paga'], ['trialPlus', 'Trial Plus concedido'], ['logo', 'Logo enviada'],
        ['variosUsuarios', 'Mais de 1 usuário'],
      ] },
    ];
    const CHAVES_RECURSO = new Set(FILTROS_RECURSO.flatMap(g => g.itens.map(([k]) => k)));
    const PRESETS_FILTRO = PRESETS.filter(p => p.id !== 'default'); // "Padrão" já é uma opção própria
    const estadoRecurso = new Map(); // chave → 'tem' | 'nao'
    let temaFiltro = '';
    {
      const qs = new URLSearchParams(location.search);
      const ler = (param, estado) => (qs.get(param) || '').split(',')
        .filter(k => CHAVES_RECURSO.has(k)).forEach(k => estadoRecurso.set(k, estado));
      ler('tem', 'tem');
      ler('naoTem', 'nao');
      const tema = qs.get('tema') || '';
      if (['padrao', 'personalizado'].includes(tema) || PRESETS_FILTRO.some(p => `preset:${p.id}` === tema)) temaFiltro = tema;
    }

    const chavesCom = estado => [...estadoRecurso].filter(([, e]) => e === estado).map(([k]) => k);
    // O backend não conhece os presets: manda as cores e o layout (mesma regra de findPresetByTheme).
    function temaParaApi(valor) {
      if (!valor.startsWith('preset:')) return valor;
      const p = PRESETS_FILTRO.find(x => `preset:${x.id}` === valor);
      return p ? [p.primaryColor, p.sidebarColor, p.accentColor, p.layoutMode || 'default'].join(',') : '';
    }
    function aplicarFiltros(params, tema) {
      const tem = chavesCom('tem'), naoTem = chavesCom('nao');
      ['tem', 'naoTem', 'tema'].forEach(k => params.delete(k));
      if (tem.length) params.set('tem', tem.join(','));
      if (naoTem.length) params.set('naoTem', naoTem.join(','));
      if (tema) params.set('tema', tema);
    }
    function sincronizarUrl() {
      const qs = new URLSearchParams(location.search);
      aplicarFiltros(qs, temaFiltro);
      const busca = qs.toString();
      history.replaceState(null, '', location.pathname + (busca ? `?${busca}` : ''));
    }
    function atualizarContadorFiltros() {
      const n = estadoRecurso.size + (temaFiltro ? 1 : 0);
      const el = document.getElementById('filtrosCount');
      el.textContent = n;
      el.hidden = n === 0;
      document.getElementById('filtrosLimpar').hidden = n === 0;
    }
    function renderFiltros() {
      document.getElementById('temaPresets').innerHTML = PRESETS_FILTRO
        .map(p => `<option value="preset:${esc(p.id)}">${esc(p.name)}</option>`).join('');
      document.getElementById('temaFilter').value = temaFiltro;
      document.getElementById('filtrosGrupos').innerHTML = FILTROS_RECURSO.map(g => `<div>
          <div class="filtros-grupo-titulo">${g.grupo}</div>
          <div class="filtros-chips">${g.itens.map(([k, label]) =>
            `<button type="button" class="filtro-chip" data-chave="${k}" data-estado="${estadoRecurso.get(k) ?? ''}">${label}</button>`).join('')}</div>
        </div>`).join('');
      atualizarContadorFiltros();
    }
    function filtrosMudaram() {
      atualizarContadorFiltros();
      sincronizarUrl();
      page = 1;
      load();
    }

    // ── Fragmentos da lista e dos blocos ──
    function usoLinha(label, valor, pct, titulo) {
      return `<div class="uso-linha" title="${titulo}">
        <div class="uso-linha-topo"><span>${label}</span><strong>${valor}</strong></div>
        ${pctBar(pct, label)}
      </div>`;
    }
    function usoHtml(t) {
      const usuariosPct = t.usuariosLimite > 0 ? (t.userCount / t.usuariosLimite) * 100 : 0;
      const monitoradosPct = t.monitoradosLimite > 0 ? (t.monitoradoCount / t.monitoradosLimite) * 100 : 0;
      const storageMb = (t.documentoTamanhoBytes || 0) / 1048576;
      const storagePct = t.armazenamentoLimiteMB > 0 ? (storageMb / t.armazenamentoLimiteMB) * 100 : 0;
      return usoLinha('Usuários', `${t.userCount}/${t.usuariosLimite}`, usuariosPct,
          `${t.userCount} de ${t.usuariosLimite} usuários permitidos no plano`)
        + usoLinha('Monitorados', `${t.monitoradoCount}/${t.monitoradosLimite}`, monitoradosPct,
          `${t.monitoradoCount} de ${t.monitoradosLimite} monitoramentos permitidos`)
        + usoLinha('Storage', `${fmtBytes(t.documentoTamanhoBytes)} / ${fmtMb(t.armazenamentoLimiteMB)}`, storagePct,
          `Storage: ${fmtBytes(t.documentoTamanhoBytes)} de ${fmtMb(t.armazenamentoLimiteMB)} permitidos`);
    }
    function atividadeHtml(t) {
      // Linhas com display:contents (as células entram direto na grade), então o title fica nos badges.
      return `<div class="ativ-grid">
          <div class="ativ-linha">
            <span class="ativ-label">Processos</span><strong>${t.processoCount}</strong>
            <span class="ativ-badges" title="${t.processoAtivoCount} ativo(s) de ${t.processoCount} cadastrado(s) · monitoramento diário ${t.monitoradoDiarioCount} · semanal ${t.monitoradoSemanalCount} (Escavador)">
              <span class="badge badge-green">Ativos ${t.processoAtivoCount}</span>
              <span class="badge badge-red">D ${t.monitoradoDiarioCount}</span>
              <span class="badge badge-blue">S ${t.monitoradoSemanalCount}</span>
            </span>
          </div>
          <div class="ativ-linha">
            <span class="ativ-label">Docs</span><strong>${t.documentoCount}</strong><span></span>
          </div>
          <div class="ativ-linha">
            <span class="ativ-label">Tarefas</span><strong>${t.tarefaCount}</strong>
            <span class="ativ-badges" title="Pendente ${t.tarefaPendenteCount} · Em andamento ${t.tarefaEmAndamentoCount} · Concluída ${t.tarefaConcluidaCount} · Perdida ${t.tarefaPerdidaCount}">
              <span class="badge badge-amber">P ${t.tarefaPendenteCount}</span>
              <span class="badge badge-blue">A ${t.tarefaEmAndamentoCount}</span>
              <span class="badge badge-green">C ${t.tarefaConcluidaCount}</span>
              <span class="badge badge-red">X ${t.tarefaPerdidaCount}</span>
            </span>
          </div>
        </div>
        ${t.oabComErroSync > 0 ? `<div style="margin-top:5px"><span class="badge badge-red" title="${t.oabComErroSync} OAB(s) com erro de sync no Escavador">⚠ ${t.oabComErroSync} OAB com erro</span></div>` : ''}`;
    }
    function datasHtml(t) {
      const expira = t.status === 'Trial' ? countdownBadge(t.trialExpiraEm, 'Trial') : countdownBadge(t.planoExpiraEm, 'Plano');
      return `<div class="datas-linha" title="Último acesso de qualquer usuário do tenant">
          Acesso <strong>${daysAgo(t.ultimoAcessoEm)}</strong><br>${fmtDateTime(t.ultimoAcessoEm)}
        </div>
        <div class="datas-linha">Expira <strong>${fmtDate(t.trialExpiraEm ?? t.planoExpiraEm)}</strong> ${expira}</div>`;
    }
    // Ações secundárias ficam num menu "⋯" na lista (economiza largura) e soltas nos blocos.
    function acoesSecundarias(t) {
      const nome = esc(t.nome).replace(/'/g, "\\'");
      return [
        { label: 'Plano', onclick: `openPlano('${t.id}','${t.plano}','${t.periodoBilling ?? ''}','${t.status}')` },
        { label: 'Status', onclick: `openStatus('${t.id}','${t.status}')` },
        { label: 'Exportar', onclick: `openExportModal('${t.id}', '${nome}')`, title: 'Baixar JSON com todos os dados deste tenant' },
        { label: 'Importar', onclick: `openImportModal('${t.id}','${nome}')`, title: 'Substituir todos os dados deste tenant pelo conteúdo de um arquivo JSON exportado', danger: true },
        { label: 'Excluir', onclick: `openDeleteModal('${t.id}','${nome}')`, title: 'Excluir este tenant e todos os seus dados permanentemente', danger: true },
      ];
    }
    function acoesMenuHtml(t) {
      const itens = acoesSecundarias(t);
      const primeiroPerigo = itens.findIndex(a => a.danger);
      return `<div class="acoes">
        <a class="action-btn" href="${detalheUrl(t.id)}">Detalhes</a>
        <details class="acoes-menu">
          <summary class="action-btn" title="Mais ações" aria-label="Mais ações">⋯</summary>
          <div class="acoes-menu-itens">
            ${itens.map((a, i) => `${i === primeiroPerigo ? '<hr>' : ''}<button type="button" class="${a.danger ? 'danger' : ''}" onclick="${a.onclick}"${a.title ? ` title="${a.title}"` : ''}>${a.label}</button>`).join('')}
          </div>
        </details>
      </div>`;
    }
    function acoesBotoesHtml(t) {
      return `<a class="action-btn" href="${detalheUrl(t.id)}">Detalhes</a>`
        + acoesSecundarias(t).map(a => `<button class="action-btn${a.danger ? ' danger' : ''}" onclick="${a.onclick}"${a.title ? ` title="${a.title}"` : ''}>${a.label}</button>`).join('');
    }

    function linhaTabela(t) {
      return `<tr${ehAssinante(t) ? ' class="assinante"' : ''}>
        <td class="tenant-nome">
          <div class="t-nome-linha"><a class="t-nome" href="${detalheUrl(t.id)}">${esc(t.nome)}</a>${mascotesInline(t)}</div>
          <div class="t-sub">${esc(t.cnpj ?? 'sem CNPJ')}</div>
          <div class="t-sub">desde ${fmtDate(t.criadoEm)}</div>
          <div class="t-plano">${planoHtml(t)}</div>
        </td>
        <td>${usoHtml(t)}</td>
        <td>${atividadeHtml(t)}</td>
        <td style="line-height:1.3">${recursosCell(t, { comMascotes: false })}</td>
        <td>${datasHtml(t)}</td>
        <td class="tenant-acoes">${acoesMenuHtml(t)}</td>
      </tr>`;
    }
    function cardTenant(t) {
      return `<div class="tenant-card${ehAssinante(t) ? ' assinante' : ''}">
        <div class="tenant-card-head">
          <div style="min-width:0">
            <div class="t-nome-linha"><a class="tenant-card-nome" href="${detalheUrl(t.id)}">${esc(t.nome)}</a>${mascotesInline(t)}</div>
            <div class="tenant-card-sub">${esc(t.cnpj ?? 'sem CNPJ')} · desde ${fmtDate(t.criadoEm)}</div>
          </div>
          ${planoHtml(t)}
        </div>
        <div class="tenant-card-secao">
          <div class="tenant-card-secao-titulo">Uso do plano</div>
          ${usoHtml(t)}
        </div>
        <div class="tenant-card-secao">
          <div class="tenant-card-secao-titulo">Atividade</div>
          ${atividadeHtml(t)}
        </div>
        <div class="tenant-card-secao tenant-card-2col">
          <div><div class="tenant-card-secao-titulo">Recursos</div><div style="line-height:1.3">${recursosCell(t, { comMascotes: false })}</div></div>
          <div><div class="tenant-card-secao-titulo">Acesso / Expira</div>${datasHtml(t)}</div>
        </div>
        <div class="tenant-card-acoes">${acoesBotoesHtml(t)}</div>
      </div>`;
    }

    // No celular a lista não cabe: sempre blocos (o CSS também esconde a alternância).
    const modoEfetivo = () => window.matchMedia('(max-width: 768px)').matches ? 'grid' : view;

    function renderItens() {
      const statusEl = document.getElementById('tenantsStatus');
      const grid = document.getElementById('tenantsGrid');
      const tableWrap = document.getElementById('tenantsTableWrap');
      if (!ultimosItens.length) {
        statusEl.textContent = 'Nenhum tenant encontrado.';
        statusEl.style.display = '';
        grid.style.display = tableWrap.style.display = 'none';
        return;
      }
      statusEl.style.display = 'none';
      if (modoEfetivo() === 'grid') {
        grid.innerHTML = ultimosItens.map(cardTenant).join('');
        grid.style.display = '';
        tableWrap.style.display = 'none';
        document.getElementById('tableBody').innerHTML = '';
      } else {
        document.getElementById('tableBody').innerHTML = ultimosItens.map(linhaTabela).join('');
        tableWrap.style.display = '';
        grid.style.display = 'none';
        grid.innerHTML = '';
      }
    }

    function renderPagination() {
      const bar = document.getElementById('paginacaoBar');
      const el = document.getElementById('pagination');
      // Abaixo do menor tamanho não há o que paginar nem escolher.
      if (!total || total <= PAGE_SIZES[0]) { bar.style.display = 'none'; el.innerHTML = ''; return; }
      bar.style.display = '';

      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      const inicio = (page - 1) * pageSize + 1;
      const fim = Math.min(page * pageSize, total);
      const fmt = n => n.toLocaleString('pt-BR');
      document.getElementById('paginacaoInfo').textContent =
        `Mostrando ${fmt(inicio)}–${fmt(fim)} de ${fmt(total)} tenant${total === 1 ? '' : 's'}`;

      if (totalPages <= 1) { el.innerHTML = ''; return; }
      // Primeira, última e uma janela em volta da atual (menor no celular); o resto vira "…".
      const janela = window.innerWidth < 600 ? 1 : 2;
      const paginas = [];
      for (let i = 1; i <= totalPages; i++)
        if (i === 1 || i === totalPages || Math.abs(i - page) <= janela) paginas.push(i);
      let html = `<button ${page <= 1 ? 'disabled' : ''} onclick="goPage(${page - 1})" aria-label="Página anterior">‹</button>`;
      paginas.forEach((i, idx) => {
        if (idx > 0 && i - paginas[idx - 1] > 1) html += '<span class="reticencias">…</span>';
        html += `<button class="${i === page ? 'active' : ''}" onclick="goPage(${i})"${i === page ? ' aria-current="page"' : ''}>${i}</button>`;
      });
      html += `<button ${page >= totalPages ? 'disabled' : ''} onclick="goPage(${page + 1})" aria-label="Próxima página">›</button>`;
      el.innerHTML = html;
    }

    let loadSeq = 0;
    async function load() {
      const seq = ++loadSeq;
      const search = document.getElementById('searchInput').value;
      const status = document.getElementById('statusFilter').value;
      const plano = document.getElementById('planoFilter').value;

      const params = new URLSearchParams({ page, pageSize, sortBy, sortDir });
      if (search) params.set('search', search);
      if (status) params.set('status', status);
      if (plano) params.set('plano', plano);
      aplicarFiltros(params, temaParaApi(temaFiltro));

      const statusEl = document.getElementById('tenantsStatus');
      statusEl.style.color = 'var(--color-text-muted)';
      statusEl.textContent = 'Carregando...';
      statusEl.style.display = '';
      document.getElementById('tenantsGrid').style.display = 'none';
      document.getElementById('tenantsTableWrap').style.display = 'none';

      try {
        const data = await saFetch(`/superadmin/tenants?${params}`);
        // Cliques rápidos nos filtros disparam vários loads: só a resposta mais recente vale.
        if (seq !== loadSeq) return;
        total = data.total;
        // Filtro/exclusão pode ter encolhido o total: volta para a última página que existe.
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (page > totalPages) { page = totalPages; return load(); }
        ultimosItens = data.items;
        renderItens();
        renderPagination();
      } catch (e) {
        if (seq !== loadSeq) return;
        ultimosItens = [];
        statusEl.style.color = 'var(--color-danger)';
        statusEl.textContent = `Erro: ${e.message}`;
        document.getElementById('paginacaoBar').style.display = 'none';
      }
    }

    window.goPage = p => {
      page = p;
      load();
      document.querySelector('.filters').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    const pageSizeSelect = document.getElementById('pageSizeSelect');
    pageSizeSelect.value = String(pageSize);
    pageSizeSelect.addEventListener('change', () => {
      pageSize = Number(pageSizeSelect.value);
      try { localStorage.setItem(PAGE_SIZE_STORAGE_KEY, String(pageSize)); } catch { /* vale só nesta visita */ }
      page = 1;
      load();
    });

    function updateViewButtons() {
      document.getElementById('viewGrid').classList.toggle('active', view === 'grid');
      document.getElementById('viewList').classList.toggle('active', view === 'list');
    }
    function setView(v) {
      view = v;
      try { localStorage.setItem(VIEW_STORAGE_KEY, v); } catch { /* vale só nesta visita */ }
      updateViewButtons();
      renderItens();
    }
    document.getElementById('viewGrid').addEventListener('click', () => setView('grid'));
    document.getElementById('viewList').addEventListener('click', () => setView('list'));
    updateViewButtons();
    // Cruzar o breakpoint do celular troca lista ⇄ blocos sem recarregar.
    window.matchMedia('(max-width: 768px)').addEventListener('change', () => { if (ultimosItens.length) renderItens(); });

    // Menu "⋯": um aberto por vez; fecha ao clicar fora ou ao escolher uma ação.
    document.addEventListener('click', e => {
      document.querySelectorAll('details.acoes-menu[open]').forEach(d => {
        if (!d.contains(e.target) || e.target.closest('.acoes-menu-itens button')) d.open = false;
      });
    });
    const fecharMenus = () => document.querySelectorAll('details.acoes-menu[open]').forEach(d => { d.open = false; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharMenus(); });
    window.addEventListener('resize', fecharMenus);
    document.querySelector('.main-content').addEventListener('scroll', fecharMenus, { passive: true });
    document.getElementById('tenantsTableWrap').addEventListener('scroll', fecharMenus, { passive: true });
    // O menu é position:fixed para não ser cortado pelo overflow da tabela; abre para baixo,
    // alinhado à direita do botão, ou para cima quando não cabe.
    document.getElementById('tableBody').addEventListener('toggle', e => {
      const d = e.target;
      if (!d.matches?.('details.acoes-menu') || !d.open) return;
      const btn = d.querySelector('summary').getBoundingClientRect();
      const menu = d.querySelector('.acoes-menu-itens');
      const alto = menu.offsetHeight;
      menu.style.left = `${Math.max(8, btn.right - menu.offsetWidth)}px`;
      menu.style.top = btn.bottom + 4 + alto > window.innerHeight
        ? `${Math.max(8, btn.top - 4 - alto)}px`
        : `${btn.bottom + 4}px`;
    }, true);

    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { page = 1; load(); }, 350);
    });
    document.getElementById('statusFilter').addEventListener('change', () => { page = 1; load(); });
    document.getElementById('planoFilter').addEventListener('change', () => { page = 1; load(); });

    renderFiltros();
    const filtrosBtn = document.getElementById('filtrosBtn');
    const filtrosPainel = document.getElementById('filtrosPainel');
    function abrirFiltros(aberto) {
      filtrosPainel.hidden = !aberto;
      filtrosBtn.setAttribute('aria-expanded', String(aberto));
    }
    // Chegou com filtros na URL: mostra o painel para deixar claro por que a lista está menor.
    abrirFiltros(estadoRecurso.size > 0 || !!temaFiltro);
    filtrosBtn.addEventListener('click', () => abrirFiltros(filtrosPainel.hidden));
    document.getElementById('filtrosGrupos').addEventListener('click', e => {
      const chip = e.target.closest('.filtro-chip');
      if (!chip) return;
      const proximo = { '': 'tem', tem: 'nao', nao: '' }[chip.dataset.estado || ''];
      chip.dataset.estado = proximo;
      if (proximo) estadoRecurso.set(chip.dataset.chave, proximo); else estadoRecurso.delete(chip.dataset.chave);
      filtrosMudaram();
    });
    document.getElementById('temaFilter').addEventListener('change', e => { temaFiltro = e.target.value; filtrosMudaram(); });
    document.getElementById('filtrosLimpar').addEventListener('click', () => {
      estadoRecurso.clear();
      temaFiltro = '';
      renderFiltros();
      filtrosMudaram();
    });

    const sortSelect = document.getElementById('sortSelect');
    function updateSortIndicators() {
      document.querySelectorAll('.sort-indicator').forEach(el => {
        el.textContent = el.dataset.indicator === sortBy ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
      });
      sortSelect.value = `${sortBy}:${sortDir}`;
    }
    function applySort(col, dir) {
      sortBy = col;
      sortDir = dir;
      page = 1;
      saveSort();
      updateSortIndicators();
      load();
    }
    sortSelect.addEventListener('change', () => {
      const [col, dir] = sortSelect.value.split(':');
      applySort(col, dir);
    });
    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.sort;
        applySort(col, sortBy === col ? (sortDir === 'asc' ? 'desc' : 'asc') : 'asc');
      });
    });
    updateSortIndicators();


    load();
  </script>
</body>
</html>
