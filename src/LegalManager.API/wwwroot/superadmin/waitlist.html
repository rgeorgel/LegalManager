<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Microsoft Clarity — only loads in non-local environments -->
  <script>
    if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "x099iggkqu");
    }
  </script>
  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Waitlist</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .summary-pills { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .summary-pill { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 10px 16px; font-size: 13px; }
    .summary-pill span { font-weight: 700; font-size: 20px; display: block; margin-bottom: 2px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .filters select { padding: 7px 12px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px; background: var(--color-surface); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--color-surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--color-border); }
    .data-table th { text-align: left; padding: 10px 12px; background: #f8fafc; border-bottom: 2px solid var(--color-border); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-muted); }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #f9fafb; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 100px; }
    .badge-green { background: #dcfce7; color: #15803d; }
    .badge-amber { background: #fef3c7; color: #92400e; }
    .badge-red { background: #fee2e2; color: #b91c1c; }
    .badge-gray { background: #f3f4f6; color: #4b5563; }
    .action-btn { background: none; border: 1px solid var(--color-border); border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--color-text); }
    .action-btn:hover { background: var(--color-bg); }
    .action-btn.approve:hover { background: #f0fdf4; border-color: #86efac; color: #15803d; }
    .action-btn.reject:hover { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
    .pagination { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; }
    .pagination button { padding: 5px 12px; border: 1px solid var(--color-border); border-radius: 5px; background: var(--color-surface); cursor: pointer; }
    .pagination button:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <div class="app-layout">
    <header class="header">
      <button id="hamburger" class="hamburger">☰</button>
      <a href="/superadmin/dashboard.html" class="header-logo">
        <img src="/images/causify-logo-navbar-clara.png" alt="Causify" style="height:28px">
      </a>
      <div class="header-user">
        <span class="header-user-name"></span>
        <span class="header-tenant" style="font-size:11px;color:#9ca3af;margin-left:4px"></span>
        <button id="logoutBtn" class="btn btn-sm">Sair</button>
      </div>
    </header>
    <aside class="sidebar"><ul class="sidebar-nav"></ul></aside>
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Waitlist</h1>
      </div>

      <div class="summary-pills" id="summaryPills">
        <div class="summary-pill"><span id="countPendente">—</span>Pendentes</div>
        <div class="summary-pill"><span id="countAprovado">—</span>Aprovados</div>
        <div class="summary-pill"><span id="countRejeitado">—</span>Rejeitados</div>
        <div class="summary-pill"><span id="countTotal">—</span>Total</div>
      </div>

      <div class="filters">
        <select id="statusFilter">
          <option value="">Todos os status</option>
          <option value="Pendente">Pendente</option>
          <option value="Aprovado">Aprovado</option>
          <option value="Rejeitado">Rejeitado</option>
        </select>
        <select id="planoFilter">
          <option value="">Todos os planos</option>
          <option value="Plus">Plus</option>
          <option value="Pro">Pro</option>
          <option value="Max">Max</option>
        </select>
      </div>

      <div style="overflow-x:auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Plano</th>
              <th>Data</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="6" style="text-align:center;color:var(--color-text-muted);padding:24px">Carregando...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <button id="prevBtn" disabled>← Anterior</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" disabled>Próxima →</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminLayout } from '/superadmin/js/superAdminLayout.js';
    import { saFetch } from '/superadmin/js/superAdminApi.js';

    initAdminLayout();

    let page = 1;
    const pageSize = 30;
    let total = 0;

    const PLAN_COLORS = { Plus: 'blue', Pro: 'amber', Max: 'green' };
    const STATUS_COLORS = { Pendente: 'amber', Aprovado: 'green', Rejeitado: 'red' };

    function esc(s) { return (s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString('pt-BR') : '—'; }

    async function loadSummary() {
      try {
        const [pend, aprov, rej] = await Promise.all([
          saFetch('/superadmin/waitlist?status=Pendente&pageSize=1'),
          saFetch('/superadmin/waitlist?status=Aprovado&pageSize=1'),
          saFetch('/superadmin/waitlist?status=Rejeitado&pageSize=1')
        ]);
        document.getElementById('countPendente').textContent = pend.total;
        document.getElementById('countAprovado').textContent = aprov.total;
        document.getElementById('countRejeitado').textContent = rej.total;
        document.getElementById('countTotal').textContent = pend.total + aprov.total + rej.total;
      } catch {}
    }

    async function load() {
      const status = document.getElementById('statusFilter').value;
      const plano = document.getElementById('planoFilter').value;
      const params = new URLSearchParams({ page, pageSize });
      if (status) params.set('status', status);
      if (plano) params.set('plano', plano);

      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="6" style="text-align:center;color:var(--color-text-muted);padding:24px">Carregando...</td></tr>';
      try {
        const data = await saFetch(`/superadmin/waitlist?${params}`);
        total = data.total;

        if (data.items.length === 0) {
          document.getElementById('tableBody').innerHTML =
            '<tr><td colspan="6" style="text-align:center;color:var(--color-text-muted);padding:24px">Nenhuma entrada encontrada.</td></tr>';
        } else {
          document.getElementById('tableBody').innerHTML = data.items.map(w => `
            <tr id="row-${w.id}">
              <td style="font-weight:500">${esc(w.nome)}</td>
              <td><a href="mailto:${esc(w.email)}" style="color:var(--color-primary)">${esc(w.email)}</a></td>
              <td><span class="badge badge-${PLAN_COLORS[w.plano] ?? 'gray'}">${w.plano}</span></td>
              <td style="color:var(--color-text-muted)">${fmtDate(w.criadoEm)}</td>
              <td><span class="badge badge-${STATUS_COLORS[w.status] ?? 'gray'}" id="badge-${w.id}">${w.status}</span></td>
              <td style="white-space:nowrap;display:flex;gap:4px">
                ${w.status !== 'Aprovado' ? `<button class="action-btn approve" onclick="updateStatus('${w.id}','Aprovado')">Aprovar</button>` : ''}
                ${w.status !== 'Rejeitado' ? `<button class="action-btn reject" onclick="updateStatus('${w.id}','Rejeitado')">Rejeitar</button>` : ''}
                ${w.status !== 'Pendente' ? `<button class="action-btn" onclick="updateStatus('${w.id}','Pendente')">Pendente</button>` : ''}
              </td>
            </tr>`).join('');
        }

        const pages = Math.ceil(total / pageSize);
        document.getElementById('pageInfo').textContent = `Página ${page} de ${Math.max(1, pages)} (${total} entradas)`;
        document.getElementById('prevBtn').disabled = page <= 1;
        document.getElementById('nextBtn').disabled = page >= pages;
      } catch (e) {
        document.getElementById('tableBody').innerHTML =
          `<tr><td colspan="6" style="color:var(--color-danger);padding:16px">Erro: ${esc(e.message)}</td></tr>`;
      }
    }

    window.updateStatus = async function(id, status) {
      try {
        await saFetch(`/superadmin/waitlist/${id}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status })
        });
        load();
        loadSummary();
      } catch (e) {
        alert('Erro: ' + e.message);
      }
    };

    document.getElementById('prevBtn').addEventListener('click', () => { page--; load(); });
    document.getElementById('nextBtn').addEventListener('click', () => { page++; load(); });
    document.getElementById('statusFilter').addEventListener('change', () => { page = 1; load(); });
    document.getElementById('planoFilter').addEventListener('change', () => { page = 1; load(); });

    loadSummary();
    load();
  </script>
</body>
</html>
