<body>
  <main class="bru">
    <div class="esq">
      <svg class="logo" viewBox="0 0 600 230" role="img" aria-label="Causify">
        <path d="M72 22 L58 22 L58 208 L72 208" fill="none" stroke="#D4952A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M528 22 L542 22 L542 208 L528 208" fill="none" stroke="#D4952A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="300" y="132" font-family="Georgia, serif" font-style="italic" font-size="72" letter-spacing="2" text-anchor="middle" fill="currentColor">Causify</text>
        <line x1="145" y1="152" x2="455" y2="152" stroke="#D4952A" stroke-width="1.5"/>
        <text x="300" y="178" font-family="Arial, sans-serif" font-size="12" letter-spacing="5" text-anchor="middle" fill="#C8933A">GESTÃO JURÍDICA INTELIGENTE</text>
      </svg>
      <h1>Prazo perdido <span>não volta.</span></h1>
      <div class="selos" aria-hidden="true"><span>Publicações automáticas</span><span>Prazos em dias úteis</span><span>Financeiro do escritório</span></div>
    </div>
    <div class="dir">
      <div class="box">
        <span class="tag">Super Admin</span>
        <h2>Entrar</h2>
        <form id="loginForm">
          <label for="email">E-mail<input type="email" id="email" placeholder="superadmin@causify.internal" autocomplete="email" required></label>
          <label for="senha">Senha<input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required></label>
          <button type="submit" class="go" id="submitBtn">Bora trabalhar →</button>
          <div class="msg" id="errorMsg" role="alert" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </main>

  <script type="module">
    import { setSession, isAuthenticated } from '/superadmin/js/superAdminApi.js';
    import { trackEvent } from '/js/analytics.js';

    if (isAuthenticated()) window.location.href = '/superadmin/dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          trackEvent('superadmin_login_failed', { status: res.status });
          errorMsg.textContent = data.message || 'Credenciais inválidas.';
          return;
        }

        if (data.usuario?.perfil !== 'SuperAdmin') {
          trackEvent('superadmin_login_failed', { reason: 'not_superadmin' });
          errorMsg.textContent = 'Acesso restrito ao painel super admin.';
          return;
        }

        setSession(data);
        trackEvent('superadmin_login_succeeded');
        window.location.href = '/superadmin/dashboard.html';
      } catch {
        errorMsg.textContent = 'Erro ao conectar ao servidor.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Bora trabalhar →';
      }
    });
  </script>
</body>
</html>
