<link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Criar Escritório</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    @media (min-width: 720px) {
      .auth-card { max-width: 660px; padding: 48px 56px; }
      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
      .form-row .form-group { margin-bottom: 0; }
    }
    .plan-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    @media (min-width: 720px) {
      .plan-selector { grid-template-columns: repeat(4, 1fr); }
    }
    .plan-dots {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin: -0.5rem 0 1rem;
    }
    .plan-dots .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--color-border, #334155);
      transition: background 0.2s, width 0.2s;
    }
    .plan-dots .dot.active {
      background: #f59e0b;
      width: 18px;
      border-radius: 3px;
    }
    @media (max-width: 719px) {
      .plan-selector {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        gap: 0.75rem;
        margin-left: -1.25rem;
        margin-right: -1.25rem;
        padding: 0.25rem 1.25rem 0.5rem;
        scrollbar-width: none;
        scroll-padding: 0 1.25rem;
      }
      .plan-selector::-webkit-scrollbar { display: none; }
      .plan-option {
        flex: 0 0 78%;
        max-width: 320px;
        scroll-snap-align: start;
      }
      .plan-dots { display: flex; }
    }
    @media (min-width: 720px) {
      .plan-dots { display: none; }
    }
    .plan-option {
      border: 2px solid var(--color-border, #334155);
      border-radius: 10px;
      padding: 1rem 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      background: var(--color-surface, #1e293b);
    }
    .plan-option:hover {
      border-color: #f59e0b;
    }
    .plan-option.selected {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.08);
    }
    .plan-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .plan-name {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 0.2rem;
    }
    .plan-price {
      font-size: 1.1rem;
      font-weight: 800;
      color: #f59e0b;
    }
.plan-selector .plan-desc {
        max-width: 145px;
    }
    .plan-badge {
      position: absolute;
      top: -8px;
      right: 8px;
      background: #f59e0b;
      color: #0f172a;
      font-size: 0.55rem;
      font-weight: 800;
      padding: 0.1rem 0.4rem;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .plan-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--color-text-muted, #94a3b8);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .plan-option.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>

<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo"><img src="/images/causify-logo-navbar-clara.png" alt="Causify"></div>
      <div class="auth-subtitle">Crie sua conta e comece agora</div>

      <div id="alert" class="alert alert-error" style="display:none"></div>

      <form id="registerForm">
        <div class="form-group">
          <div class="plan-label">Escolha seu plano</div>
          <div class="plan-selector">
            <label class="plan-option selected" id="planFreeLabel">
              <input type="radio" name="plano" value="0" checked>
              <div class="plan-name">Free</div>
              <div class="plan-price">R$ 0</div>
              <div class="plan-desc">1 usuário · 10 processos monitorados · 15 dias grátis de Plus</div>
            </label>
            <label class="plan-option" id="planPlusLabel">
              <div class="plan-badge">Mais popular</div>
              <input type="radio" name="plano" value="3">
              <div class="plan-name">Plus</div>
              <div class="plan-price">R$ 20<span style="font-size:0.7rem;font-weight:400;color:var(--color-text-muted)">/mês</span></div>
              <div class="plan-desc">1 usuário · 20 processos · Portal cliente · Financeiro</div>
            </label>
            <label class="plan-option" id="planProLabel">
              <input type="radio" name="plano" value="1">
              <div class="plan-name">Pro</div>
              <div class="plan-price">R$ 50<span style="font-size:0.7rem;font-weight:400;color:var(--color-text-muted)">/mês</span></div>
              <div class="plan-desc">2 usuários · 40 processos · 1 captura · Templates</div>
            </label>
            <label class="plan-option" id="planMaxLabel">
              <input type="radio" name="plano" value="4">
              <div class="plan-name">Max</div>
              <div class="plan-price">R$ 125<span style="font-size:0.7rem;font-weight:400;color:var(--color-text-muted)">/mês</span></div>
              <div class="plan-desc">5 usuários · 80 processos · 3 capturas · 10 GB</div>
            </label>
          </div>
          <div class="plan-dots" id="planDots" aria-hidden="true">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="nomeEscritorio">Nome do Escritório</label>
            <input type="text" id="nomeEscritorio" class="form-control" placeholder="Silva & Associados" required>
          </div>
          <div class="form-group">
            <label for="cnpj">CNPJ <span style="color:var(--color-text-muted)">(opcional)</span></label>
            <input type="text" id="cnpj" class="form-control" placeholder="00.000.000/0001-00">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="nomeAdmin">Seu Nome</label>
            <input type="text" id="nomeAdmin" class="form-control" placeholder="Dr. João Silva" required>
          </div>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" class="form-control" placeholder="joao@escritorio.com.br" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label for="senha">Senha <span style="color:var(--color-text-muted)">(mín. 8 caracteres)</span></label>
          <input type="password" id="senha" class="form-control" placeholder="••••••••" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="voucher">Código promocional <span style="color:var(--color-text-muted)">(opcional)</span></label>
          <input type="text" id="voucher" class="form-control" placeholder="Ex: primeiros50" autocomplete="off" style="text-transform:uppercase;letter-spacing:0.05em">
          <div id="voucherBanner" style="display:none;margin-top:0.5rem;padding:0.6rem 0.875rem;border-radius:8px;font-size:0.8rem;font-weight:600"></div>
        </div>
        <div class="form-group" style="display:flex;align-items:flex-start;gap:0.75rem;margin-top:0.25rem">
          <input type="checkbox" id="aceitoTermos" required style="margin-top:0.2rem;width:auto;flex-shrink:0">
          <label for="aceitoTermos" style="font-size:0.875rem;color:var(--color-text-muted);margin-bottom:0;font-weight:400">
            Li e aceito os <a href="/termos.html" target="_blank">Termos e Condições</a>
            e a <a href="/privacidade.html" target="_blank">Política de Privacidade</a>
          </label>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">
          Criar escritório
        </button>
      </form>

      <div class="auth-footer">
        <a href="/blog/index.html">Blog</a>
        &nbsp;·&nbsp;
        Já tem conta? <a href="/login.html">Entrar</a>
        &nbsp;·&nbsp;
        <a href="/index.html">Ver planos</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { register } from '/js/auth.js';
    import { mascaraCpfCnpj } from '/js/mascaras.js';

    document.getElementById('cnpj').addEventListener('input', (e) => mascaraCpfCnpj(e.target));

    // Plan selector visual
    const radios = document.querySelectorAll('input[name="plano"]');
    const labels = {
      0: document.getElementById('planFreeLabel'),
      3: document.getElementById('planPlusLabel'),
      1: document.getElementById('planProLabel'),
      4: document.getElementById('planMaxLabel')
    };

    const planSelectorEl = document.querySelector('.plan-selector');
    const planDots = document.querySelectorAll('#planDots .dot');

    function selectPlan(value) {
      const radio = document.querySelector(`input[name="plano"][value="${value}"]`);
      if (!radio) return;
      radio.checked = true;
      Object.values(labels).forEach(l => l?.classList.remove('selected'));
      labels[parseInt(value)]?.classList.add('selected');
      updateDots(parseInt(value));
    }

    function updateDots(planValue) {
      const cards = Array.from(planSelectorEl?.querySelectorAll('.plan-option') || []);
      const idx = cards.findIndex(c => labels[planValue] === c);
      if (idx >= 0) planDots.forEach((dot, i) => dot.classList.toggle('active', i === idx));
    }

    radios.forEach(r => {
      r.addEventListener('change', () => selectPlan(r.value));
    });

    if (planSelectorEl && planDots.length) {
      planSelectorEl.addEventListener('scroll', () => {
        if (window.innerWidth >= 720) return;
        const cards = Array.from(planSelectorEl.querySelectorAll('.plan-option'));
        const scrollLeft = planSelectorEl.scrollLeft;
        let activeIndex = 0;
        let minDistance = Infinity;
        cards.forEach((card, i) => {
          const distance = Math.abs(card.offsetLeft - scrollLeft);
          if (distance < minDistance) { minDistance = distance; activeIndex = i; }
        });
        planDots.forEach((dot, i) => dot.classList.toggle('active', i === activeIndex));
      }, { passive: true });
    }

    function scrollToSelectedPlan() {
      const checkedRadio = document.querySelector('input[name="plano"]:checked');
      if (!checkedRadio || !planSelectorEl) return;
      const selectedLabel = labels[parseInt(checkedRadio.value)];
      if (!selectedLabel) return;
      const cards = Array.from(planSelectorEl.querySelectorAll('.plan-option'));
      const idx = cards.indexOf(selectedLabel);
      if (idx > 0) planSelectorEl.scrollLeft = selectedLabel.offsetLeft - planSelectorEl.offsetLeft;
    }

    // Pre-select plan from URL param ?plano=
    const params = new URLSearchParams(location.search);
    const planoParam = params.get('plano');
    if (planoParam !== null) {
      selectPlan(planoParam);
      requestAnimationFrame(scrollToSelectedPlan);
    }

    // Voucher logic
    const voucherInput = document.getElementById('voucher');
    const voucherBanner = document.getElementById('voucherBanner');
    const planSelector = document.querySelector('.plan-selector');

    const VOUCHER_PRIMEIROS50 = 'primeiros50';

    function applyVoucherUI(code) {
      if (code.toLowerCase() === VOUCHER_PRIMEIROS50) {
        selectPlan('3'); // força Plus
        planSelector.style.pointerEvents = 'none';
        planSelector.style.opacity = '0.5';
        voucherBanner.textContent = '3 meses do plano Plus gratuito — aproveite!';
        voucherBanner.style.color = '#16a34a';
        voucherBanner.style.borderColor = 'rgba(22,163,74,0.4)';
        voucherBanner.style.background = 'rgba(22,163,74,0.08)';
        voucherBanner.style.display = 'block';
      } else if (code.length > 0) {
        voucherBanner.textContent = 'Código promocional não reconhecido.';
        voucherBanner.style.color = '#f87171';
        voucherBanner.style.borderColor = 'rgba(248,113,113,0.4)';
        voucherBanner.style.background = 'rgba(248,113,113,0.08)';
        voucherBanner.style.display = 'block';
        planSelector.style.pointerEvents = '';
        planSelector.style.opacity = '';
      } else {
        voucherBanner.style.display = 'none';
        planSelector.style.pointerEvents = '';
        planSelector.style.opacity = '';
      }
    }

    // Pre-fill voucher from URL param ?voucher=
    const voucherParam = params.get('voucher');
    if (voucherParam) {
      voucherInput.value = voucherParam.toUpperCase();
      applyVoucherUI(voucherParam);
      requestAnimationFrame(scrollToSelectedPlan);
    }

    voucherInput.addEventListener('input', () => applyVoucherUI(voucherInput.value.trim()));
    voucherInput.addEventListener('blur', () => {
      voucherInput.value = voucherInput.value.trim().toUpperCase();
    });

    const form = document.getElementById('registerForm');
    const alertEl = document.getElementById('alert');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Criando...';

      const planoSelecionado = parseInt(document.querySelector('input[name="plano"]:checked').value);
      const voucher = voucherInput.value.trim().toLowerCase() || null;

      try {
        await register({
          nomeEscritorio: document.getElementById('nomeEscritorio').value,
          cnpj: document.getElementById('cnpj').value || null,
          nomeAdmin: document.getElementById('nomeAdmin').value,
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value,
          plano: planoSelecionado,
          voucher
        });
        const planNames = { 0: 'Free', 3: 'Plus', 1: 'Pro', 4: 'Max' };
        if (typeof gtag === 'function') {
          gtag('event', 'sign_up', { method: planNames[planoSelecionado] ?? 'Free' });
        }
        if (typeof fbq === 'function') {
          fbq('track', 'CompleteRegistration');
        }
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Criar escritório';
      }
    });
  </script>
</body>
</html>
