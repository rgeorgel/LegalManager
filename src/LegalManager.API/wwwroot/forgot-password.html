        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};

  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Recuperar Senha</title>
  <link rel="stylesheet" href="/css/styles.css">
<script type="text/javascript">window.$crisp=[];window.CRISP_WEBSITE_ID="d8dabf67-657a-4b8c-b6c4-0bc60ab6c04a";(function(){d=document;s=d.createElement("script");s.src="https://client.crisp.chat/l.js";s.async=1;d.getElementsByTagName("head")[0].appendChild(s);})();</script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo"><img src="/images/causify-logo-transparente.png" alt="Causify"></div>
      <div class="auth-subtitle">Informe seu e-mail para receber o link de recuperação</div>

      <div id="alert" class="alert" style="display:none"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-control" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">Enviar link</button>
      </form>

      <div class="auth-footer"><a href="/login.html">← Voltar ao login</a></div>
    </div>
  </div>

  <script type="module">
    import { forgotPassword } from '/js/auth.js';

    const form = document.getElementById('forgotForm');
    const alertEl = document.getElementById('alert');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        await forgotPassword(document.getElementById('email').value);
        alertEl.className = 'alert alert-success';
        alertEl.textContent = 'Se o e-mail estiver cadastrado, você receberá as instruções em breve.';
        alertEl.style.display = 'block';
        form.reset();
      } catch (err) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = err.message;
        alertEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar link';
      }
    });
  </script>
</body>
</html>
