  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Definir senha — Portal do Parceiro — Causify</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo"><img src="/images/causify-logo-transparente.png" alt="Causify"></div>
      <div class="auth-subtitle">Crie a senha do seu acesso ao Portal do Parceiro</div>

      <div id="alert" class="alert alert-error" style="display:none"></div>

      <form id="form">
        <div class="form-group">
          <label for="senha">Nova senha <span style="color:var(--color-text-muted)">(mín. 8 caracteres)</span></label>
          <input type="password" id="senha" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmar">Confirmar senha</label>
          <input type="password" id="confirmar" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">Definir senha e entrar</button>
      </form>

      <div class="auth-footer">
        <a href="/parceiro/index.html">← Voltar ao login</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { definirSenha } from '/parceiro/js/parceiroApi.js';

    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('form');
    const alertEl = document.getElementById('alert');
    const btn = document.getElementById('submitBtn');

    function erro(msg) {
      alertEl.textContent = msg;
      alertEl.style.display = 'block';
    }

    if (!token) {
      erro('Link inválido. Use o link que você recebeu por e-mail ou peça um novo em "Esqueci minha senha".');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';
      const senha = document.getElementById('senha').value;
      if (senha !== document.getElementById('confirmar').value) return erro('As senhas não coincidem.');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        await definirSenha(token, senha);
        window.location.href = '/parceiro/painel.html';
      } catch (err) {
        erro(err.message);
        btn.disabled = false;
        btn.textContent = 'Definir senha e entrar';
      }
    });
  </script>
</body>
</html>
