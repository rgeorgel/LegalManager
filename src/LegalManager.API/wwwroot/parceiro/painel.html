  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Painel — Portal do Parceiro — Causify</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { background: var(--color-bg); }
    .p-header { background: var(--color-surface); border-bottom: 1px solid var(--color-border); padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
    .p-header img { height: 28px; }
    .p-header .tag { font-size: 12px; color: var(--color-text-muted); border-left: 1px solid var(--color-border); padding-left: 12px; }
    .p-header .user { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .p-main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    @media (max-width: 760px) { .p-header .tag { display: none; } }
  </style>
</head>
<body>
  <header class="p-header">
    <img src="/images/causify-logo-navbar-clara.png" alt="Causify">
    <span class="tag">Portal do Parceiro</span>
    <div class="user">
      <span id="nomeParceiro"></span>
      <button class="btn btn-secondary btn-sm" id="sairBtn">Sair</button>
    </div>
  </header>

  <!-- Painel compartilhado com o "Indique e ganhe" dos usuários (js/painel-indicacoes.js) -->
  <main class="p-main" id="painel"></main>

  <script type="module">
    import { isLoggedIn, getParceiro, logout, parceiroApi } from '/parceiro/js/parceiroApi.js';
    import { montarPainelIndicacoes } from '/js/painel-indicacoes.js';

    if (!isLoggedIn()) window.location.href = '/parceiro/index.html';

    document.getElementById('nomeParceiro').textContent = getParceiro()?.nome ?? '';
    document.getElementById('sairBtn').addEventListener('click', logout);

    if (isLoggedIn()) montarPainelIndicacoes(document.getElementById('painel'), { api: parceiroApi });
  </script>
</body>
</html>
