  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início – Portal do Cliente</title>
  <link rel="stylesheet" href="/cliente/css/portal.css">
</head>
<body>
  <header class="portal-nav" id="portalNav"></header>

  <main class="portal-page">
    <section class="hero">
      <div class="hero-saudacao" id="heroSaudacao">Bem-vindo(a)</div>
      <h1 class="hero-titulo" id="welcomeTitle">Olá!</h1>
      <p class="hero-sub" id="heroSub">Acompanhe aqui o andamento dos seus processos, documentos e honorários.</p>
    </section>

    <div class="stats-grid" id="statsGrid">
      <a class="stat-card" href="/cliente/processos.html">
        <span class="stat-icone" data-icone="processos"></span>
        <div>
          <div class="stat-number" id="statTotal">–</div>
          <div class="stat-label">Processos</div>
        </div>
      </a>
      <div class="stat-card">
        <span class="stat-icone" data-icone="atividade"></span>
        <div>
          <div class="stat-number" id="statAndamentos">–</div>
          <div class="stat-label">Andamentos registrados</div>
        </div>
      </div>
      <a class="stat-card stat-atalho" href="/cliente/honorarios.html">
        <span class="stat-icone" data-icone="honorarios"></span>
        <div>
          <div class="stat-number" style="font-size:16px;line-height:1.4">Honorários</div>
          <div class="stat-label">Contratos e parcelas</div>
        </div>
      </a>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Processos recentes</span>
        <a href="/cliente/processos.html" class="btn btn-ghost btn-sm" style="margin-left:auto">Ver todos</a>
      </div>
      <div id="processosList">
        <div class="loading"><span class="spinner spinner-dark"></span></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initLayout, icone, processoCardHtml } from '/cliente/js/clienteLayout.js';
    import { portalApi } from '/cliente/js/clienteApi.js';

    loadDashboard();

    async function loadDashboard() {
      const user = initLayout('dashboard');
      if (!user) return; // initLayout já mandou para o login (voltando a esta página depois)

      document.querySelectorAll('[data-icone]').forEach(el => { el.innerHTML = icone(el.dataset.icone); });
      const hora = new Date().getHours();
      document.getElementById('heroSaudacao').textContent = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';
      document.getElementById('welcomeTitle').textContent = `Olá, ${user.nome.split(' ')[0]}!`;
      if (user.nomeEscritorio) {
        document.getElementById('heroSub').textContent =
          `Acompanhe aqui seus processos, documentos e honorários com ${user.nomeEscritorio}.`;
      }

      try {
        const processos = await portalApi.getMeusProcessos();
        const arr = processos || [];

        document.getElementById('statTotal').textContent = arr.length;
        document.getElementById('statAndamentos').textContent = arr.reduce((s, p) => s + p.totalAndamentos, 0);

        const processosList = document.getElementById('processosList');
        if (arr.length === 0) {
          processosList.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📂</div>
              <div class="empty-state-title">Nenhum processo encontrado</div>
              <div class="empty-state-desc">Seus processos aparecerão aqui quando forem cadastrados.</div>
            </div>`;
          return;
        }

        const recent = arr.slice(0, 5);
        processosList.innerHTML = recent.map(p => processoCardHtml(p, { linha: true })).join('');
      } catch (err) {
        console.error('Erro:', err);
        document.getElementById('processosList').innerHTML = 
          `<div class="alert alert-error" style="margin:16px">Erro: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
