<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha â€” Causify</title>
  <link rel="stylesheet" href="/cliente/css/portal.css">
</head>
<body>
  <header class="portal-nav">
    <a href="/cliente/index.html" class="portal-logo">âš–ï¸ Causify</a>
  </header>

  <main class="portal-page">
    <div class="auth-card" style="max-width:420px;margin:40px auto">
      <h1 style="font-size:20px;font-weight:700;margin-bottom:8px">Esqueci minha senha</h1>
      <p style="color:#6b7280;font-size:14px;margin-bottom:24px">Informe seu e-mail para receber o link de redefiniÃ§Ã£o.</p>
      <div id="alert" class="alert alert-error" style="display:none"></div>
      <div id="successMsg" class="alert alert-success" style="display:none">E-mail enviado! Verifique sua caixa de entrada.</div>
      <form id="form">
        <div class="form-group">
          <label>E-mail cadastrado</label>
          <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">Enviar link</button>
      </form>
      <div style="margin-top:16px;text-align:center">
        <a href="/cliente/index.html" style="font-size:13px">â† Voltar ao login</a>
      </div>
    </div>
  </main>
  <script type="module">
    import { solicitarRedefinicao } from '/cliente/js/clienteApi.js';
    const alertEl = document.getElementById('alert');
    const successEl = document.getElementById('successMsg');
    const btn = document.getElementById('submitBtn');

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      alertEl.style.display = 'none';
      successEl.style.display = 'none';
      try {
        const res = await solicitarRedefinicao(document.getElementById('email').value);
        if (res && res.ok) {
          successEl.style.display = 'block';
          document.getElementById('form').style.display = 'none';
        }
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Enviar link';
      }
    });
  </script>
</body>
</html>
