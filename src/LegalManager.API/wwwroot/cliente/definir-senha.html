<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Microsoft Clarity — only loads in non-local environments -->
  <script>
    if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "x099iggkqu");
    }
  </script>
  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Definir Senha</title>
  <link rel="stylesheet" href="/cliente/css/portal.css">
</head>
<body>
  <header class="portal-nav">
    <a href="/cliente/index.html" class="portal-logo"><img src="/images/causify-logo-navbar-clara.png" alt="Causify"></a>
  </header>

  <main class="portal-page">
    <div class="auth-card" style="max-width:420px;margin:40px auto">
      <h1 style="font-size:20px;font-weight:700;margin-bottom:8px">Definir sua senha</h1>
      <p style="color:#6b7280;font-size:14px;margin-bottom:24px">Crie uma senha para acessar o portal do cliente.</p>
      <div id="alert" class="alert alert-error" style="display:none"></div>
      <form id="form">
        <div class="form-group">
          <label>Nova senha *</label>
          <input type="password" id="senha" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Confirmar senha *</label>
          <input type="password" id="confirmar" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">Definir senha</button>
      </form>
    </div>
  </main>
  <script type="module">
    import { redefinirSenha } from '/cliente/js/clienteApi.js';
    const token = new URLSearchParams(location.search).get('token');
    const alertEl = document.getElementById('alert');
    const btn = document.getElementById('submitBtn');

    if (!token) {
      alertEl.className = 'alert alert-error';
      alertEl.textContent = 'Token de redefinição inválido.';
      alertEl.style.display = 'block';
      document.getElementById('form').style.display = 'none';
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const senha = document.getElementById('senha').value;
      const confirmar = document.getElementById('confirmar').value;
      if (senha !== confirmar) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = 'As senhas não coincidem.';
        alertEl.style.display = 'block';
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      alertEl.style.display = 'none';
      try {
        await redefinirSenha(token, senha);
        window.location.href = '/cliente/index.html?msg=senha-definida';
      } catch (err) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = err.message;
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Definir senha';
      }
    });
  </script>
</body>
</html>
