  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processo – Portal do Cliente</title>
  <link rel="stylesheet" href="/cliente/css/portal.css">
</head>
<body>
  <header class="portal-nav" id="portalNav"></header>

  <main class="portal-page">
    <button class="back-link" onclick="history.back()">← Voltar</button>

    <div id="processoHeader">
      <div class="loading"><span class="spinner spinner-dark"></span></div>
    </div>

    <div class="tabs" id="tabsContainer" style="display:none">
      <button class="tab-btn active" data-tab="andamentos">Andamentos</button>
      <button class="tab-btn" data-tab="documentos">Documentos</button>
    </div>

    <div id="tabContent">
      <div class="loading"><span class="spinner spinner-dark"></span></div>
    </div>
  </main>

  <script type="module">
    import { initLayout, formatDate, formatDateTime, statusBadge, faseBadge, tipoParteLabel } from '/cliente/js/clienteLayout.js';
    import { portalApi } from '/cliente/js/clienteApi.js';

    loadProcesso();

    async function loadProcesso() {
      const user = initLayout('processos');
      if (!user) {
        window.location.href = '/cliente/index.html';
        return;
      }

      const params = new URLSearchParams(location.search);
      const processoId = params.get('id');

      if (!processoId) {
        window.location.href = '/cliente/processos.html';
        return;
      }

      const headerEl = document.getElementById('processoHeader');
      const tabsContainer = document.getElementById('tabsContainer');
      const tabContent = document.getElementById('tabContent');

      let uploadForm, uploadStatus;

      try {
        const p = await portalApi.getProcesso(processoId);
        if (!p) {
          headerEl.innerHTML = `<div class="alert alert-error">Processo não encontrado.</div>`;
          return;
        }

        document.title = `${p.numeroCNJ} — Portal do Cliente`;

        headerEl.innerHTML = `
          <div class="detail-header">
            <div class="detail-cnj">${p.numeroCNJ}</div>
            <div class="processo-tags" style="margin-bottom:16px">
              ${statusBadge(p.status)}
              ${faseBadge(p.fase)}
              <span class="badge badge-gray">${tipoParteLabel(p.tipoParte)}</span>
            </div>
            <div class="detail-grid">
              ${p.tribunal ? `<div class="detail-field"><label>Tribunal</label><span>${p.tribunal}</span></div>` : ''}
              ${p.comarca ? `<div class="detail-field"><label>Comarca</label><span>${p.comarca}</span></div>` : ''}
              <div class="detail-field"><label>Área</label><span>${p.areaDireito}</span></div>
              <div class="detail-field"><label>Cadastrado em</label><span>${formatDate(p.criadoEm)}</span></div>
            </div>
          </div>`;

        tabsContainer.style.display = '';
      } catch (err) {
        headerEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        return;
      }

      async function loadAndamentos() {
        tabContent.innerHTML = '<div class="loading"><span class="spinner spinner-dark"></span></div>';
        try {
          const andamentos = await portalApi.getAndamentos(processoId);
          const arr = andamentos || [];

          if (arr.length === 0) {
            tabContent.innerHTML = `
              <div class="card">
                <div class="card-header">
                  <span class="card-title">Andamentos</span>
                </div>
                <div class="empty-state">
                  <div class="empty-state-icon">📋</div>
                  <div class="empty-state-title">Nenhum andamento registrado</div>
                  <div class="empty-state-desc">Os andamentos do processo aparecerão aqui.</div>
                </div>
              </div>`;
            return;
          }

          tabContent.innerHTML = `<div class="card">
            <div class="card-header">
              <span class="card-title">Andamentos</span>
              <span class="badge badge-gray" style="margin-left:auto">${arr.length} andamento${arr.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="andamento-list">${arr.map(a => `
            <div class="andamento-item">
              <div class="andamento-date">${formatDateTime(a.data)} · <span class="badge badge-gray" style="font-size:11px">${a.tipo}</span></div>
              <div class="andamento-desc">${escapeHtml(a.descricao)}</div>
              ${a.descricaoTraduzidaIA ? `<div class="andamento-ia">${escapeHtml(a.descricaoTraduzidaIA)}</div>` : ''}
            </div>`).join('')}</div>
          </div>`;
        } catch (err) {
          tabContent.innerHTML = `<div class="alert alert-error" style="margin:16px">${err.message}</div>`;
        }
      }

      async function loadDocumentos() {
        tabContent.innerHTML = '<div class="loading"><span class="spinner spinner-dark"></span></div>';
        try {
          const docs = await portalApi.getDocumentos(processoId);
          const arr = docs || [];

          tabContent.innerHTML = `
            <div class="card">
              <div class="card-header">
                <span class="card-title">Documentos</span>
                <button class="btn btn-sm btn-primary" id="btnNovoDocumento" style="margin-left:auto">+ Enviar documento</button>
              </div>
              <div id="documentosUpload" style="display:none;padding:16px;border-bottom:1px solid var(--color-border)">
                <form id="uploadForm" class="form-inline" style="display:flex;flex-wrap:wrap;gap:12px;align-items:end">
                  <div class="form-group" style="flex:1;min-width:200px;margin-bottom:0">
                    <label for="uploadFile">Arquivo</label>
                    <input type="file" id="uploadFile" class="form-control" required>
                  </div>
                  <div class="form-group" style="flex:1;min-width:120px;margin-bottom:0">
                    <label for="uploadTipo">Tipo</label>
                    <select id="uploadTipo" class="form-control">
                      <option value="Prova">Prova</option>
                      <option value="Peticao">Petição</option>
                      <option value="Contrato">Contrato</option>
                      <option value="Decisao">Decisão</option>
                      <option value="Outro">Outro</option>
                    </select>
                  </div>
                  <div class="form-group" style="flex:1;min-width:150px;margin-bottom:0">
                    <label for="uploadNome">Nome (opcional)</label>
                    <input type="text" id="uploadNome" class="form-control" placeholder="Descrição do arquivo">
                  </div>
                  <div style="display:flex;gap:8px;padding-bottom:0">
                    <button type="submit" class="btn btn-primary btn-sm">Enviar</button>
                    <button type="button" class="btn btn-secondary btn-sm" id="btnCancelUpload">Cancelar</button>
                  </div>
                </form>
                <div id="uploadStatus" style="margin-top:12px"></div>
              </div>
              <div id="documentosList"></div>
            </div>`;

          uploadForm = document.getElementById('uploadForm');
          uploadStatus = document.getElementById('uploadStatus');

          if (arr.length === 0) {
            document.getElementById('documentosList').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📎</div><div class="empty-state-title">Nenhum documento</div><div class="empty-state-desc">Envie documentos para este processo.</div></div>';
          } else {
            document.getElementById('documentosList').innerHTML = `<table class="table" style="width:100%"><thead><tr style="text-align:left"><th>Nome</th><th>Tipo</th><th>Tamanho</th><th>Enviado em</th></tr></thead><tbody>${arr.map(d => `<tr><td>${escapeHtml(d.nome)}</td><td><span class="badge badge-gray">${d.tipo}</span></td><td>${d.tamanhoFormatado}</td><td>${formatDate(d.criadoEm)}</td></tr>`).join('')}</tbody></table>`;
          }

          document.getElementById('btnNovoDocumento').addEventListener('click', () => {
            document.getElementById('documentosUpload').style.display = '';
            document.getElementById('btnNovoDocumento').style.display = 'none';
          });

          document.getElementById('btnCancelUpload').addEventListener('click', () => {
            document.getElementById('documentosUpload').style.display = 'none';
            document.getElementById('btnNovoDocumento').style.display = '';
            uploadForm.reset();
            uploadStatus.innerHTML = '';
          });

          uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('uploadFile');
            const tipoSelect = document.getElementById('uploadTipo');
            const nomeInput = document.getElementById('uploadNome');
            const file = fileInput.files[0];
            if (!file) return;
            const submitBtn = uploadForm.querySelector('[type=submit]');
            submitBtn.disabled = true;
            uploadStatus.innerHTML = '<div class="alert alert-info">Enviando...</div>';
            try {
              const res = await portalApi.uploadDocumento(processoId, file, tipoSelect.value, nomeInput.value || null);
              if (!res.ok) {
                const body = await res.json().catch(() => ({}));
                throw new Error(body.message || body.title || `Erro ${res.status}`);
              }
              uploadStatus.innerHTML = '<div class="alert alert-success">Documento enviado com sucesso.</div>';
              uploadForm.reset();
              document.getElementById('documentosUpload').style.display = 'none';
              document.getElementById('btnNovoDocumento').style.display = '';
              await loadDocumentos();
            } catch (err) {
              uploadStatus.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
            } finally {
              submitBtn.disabled = false;
            }
          });
        } catch (err) {
          tabContent.innerHTML = `<div class="alert alert-error" style="margin:16px">${err.message}</div>`;
        }
      }

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const tab = btn.dataset.tab;
          if (tab === 'andamentos') {
            loadAndamentos();
          } else {
            loadDocumentos();
          }
        });
      });

      loadAndamentos();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>
</html>
