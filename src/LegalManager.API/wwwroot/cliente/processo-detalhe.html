  <meta charset="UTF-8">
  <!-- Sem Google Analytics/Meta Pixel no portal do cliente: área logada, títulos e URLs
       trazem dados do processo (e o Pixel é a causa provável do aviso de COOP ao abrir o portal por e-mail). -->
<link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processo – Portal do Cliente</title>
  <link rel="stylesheet" href="/cliente/css/portal.css">
  <link rel="stylesheet" href="/css/upload-fila.css">
</head>
<body>
  <header class="portal-nav" id="portalNav"></header>

  <main class="portal-page">
    <button class="back-link" id="btnVoltar" onclick="history.length > 1 ? history.back() : (location.href = '/cliente/processos.html')">← Meus processos</button>

    <div id="processoHeader">
      <div class="loading"><span class="spinner spinner-dark"></span></div>
    </div>

    <div class="tabs" id="tabsContainer" style="display:none">
      <button class="tab-btn active" data-tab="andamentos">Andamentos</button>
      <button class="tab-btn" data-tab="resumos">Resumos IA</button>
      <button class="tab-btn" data-tab="documentos">Documentos</button>
    </div>

    <div id="tabContent">
      <div class="loading"><span class="spinner spinner-dark"></span></div>
    </div>
  </main>

  <!-- Visualizador de documento -->
  <div class="doc-viewer" id="docViewer" role="dialog" aria-modal="true" aria-labelledby="docViewerTitulo">
    <div class="doc-viewer-box">
      <div class="doc-viewer-header">
        <span class="doc-viewer-titulo" id="docViewerTitulo">Documento</span>
        <div class="doc-viewer-acoes">
          <a class="btn btn-sm btn-secondary" id="docViewerNovaAba" target="_blank" rel="noopener" style="display:none">↗ Abrir em nova aba</a>
          <a class="btn btn-sm btn-primary" id="docViewerBaixar" style="display:none">⬇ Baixar</a>
          <button class="btn btn-sm btn-secondary" id="docViewerFechar" aria-label="Fechar">✕</button>
        </div>
      </div>
      <div class="doc-viewer-corpo" id="docViewerCorpo"></div>
    </div>
  </div>

  <script type="module">
import { esc as escapeHtml } from '/js/utils.js';
    import { initLayout, formatDate, formatDateTime, statusBadge, faseBadge, tipoParteLabel, areaLabel, tipoAndamentoLabel, icone } from '/cliente/js/clienteLayout.js';
    import { portalApi, clearSession, urlLogin } from '/cliente/js/clienteApi.js';
    import { renderMarkdown } from '/js/markdown.js';
    import { montarPainelUpload, ativarSoltarNaPagina } from '/cliente/js/portal-upload.js';

    let processoId = new URLSearchParams(location.search).get('id');
    if (!processoId) {
      window.location.href = '/cliente/processos.html';
    } else {
      loadProcesso();
    }

    async function loadProcesso() {
      const user = initLayout('processos');
      if (!user) return; // initLayout já mandou para o login (voltando a esta página depois)

      const headerEl = document.getElementById('processoHeader');
      const tabsContainer = document.getElementById('tabsContainer');
      const tabContent = document.getElementById('tabContent');

      try {
        // 404: o processo não é deste acesso — em geral é de outro escritório em que o cliente
        // também tem acesso com o mesmo e-mail. Entrar de novo pelo link escolhe o acesso certo.
        // Sem redirecionar sozinho: se o processo não for mesmo dele, não fica em loop.
        const p = await portalApi.getProcesso(processoId).catch(err => {
          if (err.status === 404) return null;
          throw err;
        });
        if (!p) {
          headerEl.innerHTML = `
            <div class="alert alert-error">
              Este processo não está neste acesso. Se ele é de outro escritório, entre novamente para abri-lo.
              <div style="margin-top:12px"><button type="button" class="btn btn-sm btn-primary" id="btnEntrarNovamente">Entrar novamente</button></div>
            </div>`;
          document.getElementById('btnEntrarNovamente').addEventListener('click', () => {
            const destino = urlLogin();
            clearSession();
            location.href = destino;
          });
          return;
        }

        document.title = `${p.numeroCNJ} — Portal do Cliente`;

        document.getElementById('btnVoltar').innerHTML = `${icone('voltar').replace('<svg', '<svg width="16" height="16"')} Meus processos`;
        headerEl.innerHTML = `
          <div class="detail-header">
            <div class="detail-rotulo">Processo</div>
            <div class="detail-cnj">${escapeHtml(p.numeroCNJ)}</div>
            <div class="processo-tags" style="margin-bottom:16px">
              ${statusBadge(p.status)}
              ${faseBadge(p.fase)}
              <span class="badge badge-gray">${tipoParteLabel(p.tipoParte)}</span>
            </div>
            <div class="detail-grid">
              ${p.tribunal ? `<div class="detail-field"><label>Tribunal</label><span>${escapeHtml(p.tribunal)}</span></div>` : ''}
              ${p.comarca ? `<div class="detail-field"><label>Comarca</label><span>${escapeHtml(p.comarca)}</span></div>` : ''}
              <div class="detail-field"><label>Área</label><span>${escapeHtml(areaLabel(p.areaDireito))}</span></div>
              <div class="detail-field"><label>Cadastrado em</label><span>${formatDate(p.criadoEm)}</span></div>
            </div>
          </div>`;

        tabsContainer.style.display = '';
      } catch (err) {
        headerEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        return;
      }

      async function loadAndamentos() {
        tabContent.innerHTML = '<div class="loading"><span class="spinner spinner-dark"></span></div>';
        try {
          const andamentos = await portalApi.getAndamentos(processoId);
          const arr = andamentos || [];

          if (arr.length === 0) {
            tabContent.innerHTML = `
              <div class="card">
                <div class="card-header">
                  <span class="card-title">Andamentos</span>
                </div>
                <div class="empty-state">
                  <div class="empty-state-icon">📋</div>
                  <div class="empty-state-title">Nenhum andamento registrado</div>
                  <div class="empty-state-desc">Os andamentos do processo aparecerão aqui.</div>
                </div>
              </div>`;
            return;
          }

          tabContent.innerHTML = `<div class="card">
            <div class="card-header">
              <span class="card-title">Andamentos</span>
              <span class="badge badge-gray" style="margin-left:auto">${arr.length} andamento${arr.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="andamento-list">${arr.map(a => `
            <div class="andamento-item">
              <div class="andamento-date">${formatDateTime(a.data)} · <span class="badge badge-gray" style="font-size:11px">${escapeHtml(tipoAndamentoLabel(a.tipo))}</span></div>
              <div class="andamento-desc">${escapeHtml(a.descricao)}</div>
              ${a.descricaoTraduzidaIA ? `<div class="andamento-ia">${escapeHtml(a.descricaoTraduzidaIA)}</div>` : ''}
            </div>`).join('')}</div>
          </div>`;
        } catch (err) {
          tabContent.innerHTML = `<div class="alert alert-error" style="margin:16px">${err.message}</div>`;
        }
      }

      // ── Documentos ─────────────────────────────────────────
      let painelUpload = null;
      let arquivosPendentes = null; // soltos na página com outra aba aberta

      async function loadDocumentos() {
        painelUpload = null;
        tabContent.innerHTML = '<div class="loading"><span class="spinner spinner-dark"></span></div>';
        try {
          const arr = (await portalApi.getDocumentos(processoId)) || [];

          tabContent.innerHTML = `
            <div class="card docs-card">
              <div class="card-header">
                <span class="card-title">Documentos</span>
                <span class="docs-contagem" id="docsContagem"></span>
                <button class="btn btn-sm btn-primary pu-btn-abrir" id="btnNovoDocumento">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg>
                  Enviar documentos
                </button>
              </div>
              <div id="documentosUpload"></div>
              <div id="documentosList"></div>
            </div>`;

          const btnNovo = document.getElementById('btnNovoDocumento');
          painelUpload = montarPainelUpload(document.getElementById('documentosUpload'), {
            processoId,
            aoEnviar: () => recarregarListaDocs(),
            aoAbrirFechar: aberto => btnNovo.classList.toggle('pu-oculto', aberto),
          });
          btnNovo.addEventListener('click', () => { painelUpload.abrir(); painelUpload.focar(); });

          renderListaDocs(arr);
          if (arquivosPendentes) { painelUpload.adicionar(arquivosPendentes); arquivosPendentes = null; }
          else if (!arr.length) painelUpload.abrir(); // sem documentos: a área de envio já aparece
        } catch (err) {
          tabContent.innerHTML = `<div class="alert alert-error" style="margin:16px">${escapeHtml(err.message)}</div>`;
        }
      }

      function renderListaDocs(arr, novos = new Set()) {
        const lista = document.getElementById('documentosList');
        if (!lista) return;
        document.getElementById('docsContagem').textContent = arr.length ? arr.length : '';
        if (arr.length === 0) {
          lista.innerHTML = '<div class="empty-state docs-vazio"><div class="empty-state-icon">📎</div><div class="empty-state-title">Nenhum documento</div><div class="empty-state-desc">Envie documentos para este processo.</div></div>';
          return;
        }
        lista.innerHTML = `<ul class="doc-lista">${arr.map(d => `
          <li class="doc-item${novos.has(d.id) ? ' doc-novo' : ''}">
            <span class="doc-icone">${icone('documento')}</span>
            <div class="doc-corpo">
              <button type="button" class="doc-nome-link" data-doc-ver="${escapeHtml(d.id)}">${escapeHtml(d.nome)}</button>
              <div class="doc-meta">${novos.has(d.id) ? '<span class="doc-selo-novo">Novo</span> ' : ''}${escapeHtml(TIPO_DOC[d.tipo] || d.tipo)} · ${escapeHtml(d.tamanhoFormatado || '')} · ${formatDate(d.criadoEm)}</div>
            </div>
            <div class="doc-acoes">
              ${podeVisualizar(d.contentType) ? `<button type="button" class="btn btn-sm btn-secondary" data-doc-ver="${escapeHtml(d.id)}" title="Visualizar">👁<span class="doc-acao-rotulo"> Ver</span></button>` : ''}
              <button type="button" class="btn btn-sm btn-secondary" data-doc-baixar="${escapeHtml(d.id)}" title="Baixar">⬇<span class="doc-acao-rotulo"> Baixar</span></button>
            </div>
          </li>`).join('')}</ul>`;
        const porId = Object.fromEntries(arr.map(d => [d.id, d]));
        lista.querySelectorAll('[data-doc-ver]').forEach(b =>
          b.addEventListener('click', () => verDocumento(porId[b.dataset.docVer])));
        lista.querySelectorAll('[data-doc-baixar]').forEach(b =>
          b.addEventListener('click', () => baixarDocumento(porId[b.dataset.docBaixar], b)));
      }

      // Depois de um envio: só a lista é refeita (o painel segue com a fila) e os novos piscam.
      async function recarregarListaDocs() {
        const antes = new Set([...document.querySelectorAll('#documentosList [data-doc-baixar]')].map(b => b.dataset.docBaixar));
        try {
          const arr = (await portalApi.getDocumentos(processoId)) || [];
          renderListaDocs(arr, new Set(arr.map(d => d.id).filter(id => !antes.has(id))));
        } catch { /* a lista antiga continua; o envio em si já deu certo */ }
      }

      const abaAtiva = () => document.querySelector('.tab-btn.active')?.dataset.tab;
      function abrirAba(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        if (tab === 'andamentos') loadAndamentos();
        else if (tab === 'resumos') loadResumos();
        else loadDocumentos();
      }

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (abaAtiva() === 'documentos' && btn.dataset.tab !== 'documentos'
              && painelUpload?.aberto() && !confirmarSaidaDoUpload()) return;
          abrirAba(btn.dataset.tab);
        });
      });

      function confirmarSaidaDoUpload() {
        return !document.querySelector('.up-item.up-enviando')
          || confirm('Há arquivos sendo enviados. Sair e cancelar o envio dos que faltam?');
      }

      // Arrastar arquivos para qualquer lugar do processo (em qualquer aba) abre o envio com eles.
      ativarSoltarNaPagina({
        podeSoltar: () => tabsContainer.style.display !== 'none' && !document.getElementById('docViewer').classList.contains('open'),
        mostrarTela: () => !(abaAtiva() === 'documentos' && painelUpload?.aberto()),
        destino: () => `Documentos do processo ${document.querySelector('.detail-cnj')?.textContent || ''}`.trim(),
        aoSoltar: arquivos => {
          if (abaAtiva() === 'documentos' && painelUpload) { painelUpload.adicionar(arquivos); return; }
          arquivosPendentes = arquivos;
          abrirAba('documentos');
        },
      });

      loadAndamentos();
    }

    // ── Documentos: visualizar / baixar ────────────────────
    const TIPO_DOC = { Peticao: 'Petição', Decisao: 'Decisão', Contrato: 'Contrato', Prova: 'Prova', Modelo: 'Modelo', Outro: 'Outro' };
    // Só PDF e imagem abrem dentro do portal (mesmo critério do servidor); o resto é baixado.
    const TIPOS_VISUALIZAVEIS = ['application/pdf', 'image/png', 'image/jpeg', 'image/webp'];
    const EXTENSOES = { 'application/pdf': '.pdf', 'image/png': '.png', 'image/jpeg': '.jpg', 'image/webp': '.webp' };
    const podeVisualizar = (contentType) => TIPOS_VISUALIZAVEIS.includes(contentType);

    const viewer = document.getElementById('docViewer');
    const viewerCorpo = document.getElementById('docViewerCorpo');
    let viewerUrl = null;

    function nomeArquivo(doc) {
      // O nome pode ter sido digitado sem extensão ("Comprovante de residência").
      const ext = EXTENSOES[doc.contentType];
      return ext && !doc.nome.toLowerCase().endsWith(ext) && !/\.[a-z0-9]{2,5}$/i.test(doc.nome) ? doc.nome + ext : doc.nome;
    }

    function fecharViewer() {
      viewer.classList.remove('open');
      viewerCorpo.innerHTML = '';
      if (viewerUrl) { URL.revokeObjectURL(viewerUrl); viewerUrl = null; }
    }

    async function verDocumento(doc) {
      if (!doc) return;
      if (!podeVisualizar(doc.contentType)) { baixarDocumento(doc); return; }
      document.getElementById('docViewerTitulo').textContent = doc.nome;
      const novaAba = document.getElementById('docViewerNovaAba');
      const baixar = document.getElementById('docViewerBaixar');
      novaAba.style.display = 'none';
      baixar.style.display = 'none';
      viewerCorpo.innerHTML = '<div class="loading"><span class="spinner spinner-dark"></span></div>';
      viewer.classList.add('open');
      try {
        const blob = await portalApi.getDocumentoArquivo(processoId, doc.id);
        if (!blob) return;
        // O blob: herda a origem do portal — só tipos seguros são exibidos aqui.
        if (!podeVisualizar(blob.type)) { fecharViewer(); salvarBlob(blob, nomeArquivo(doc)); return; }
        if (viewerUrl) URL.revokeObjectURL(viewerUrl);
        viewerUrl = URL.createObjectURL(blob);
        viewerCorpo.innerHTML = '';
        if (blob.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = viewerUrl;
          img.alt = doc.nome;
          viewerCorpo.appendChild(img);
        } else {
          const iframe = document.createElement('iframe');
          iframe.src = viewerUrl;
          iframe.title = doc.nome;
          viewerCorpo.appendChild(iframe);
        }
        novaAba.href = viewerUrl;
        novaAba.style.display = '';
        baixar.href = viewerUrl;
        baixar.download = nomeArquivo(doc);
        baixar.style.display = '';
      } catch (err) {
        viewerCorpo.innerHTML = `<div class="alert alert-error" style="margin:16px">${escapeHtml(err.message)}</div>`;
      }
    }

    function salvarBlob(blob, nome) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nome;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60_000);
    }

    async function baixarDocumento(doc, btn = null) {
      if (!doc) return;
      const texto = btn?.textContent;
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner spinner-dark"></span>'; }
      try {
        const blob = await portalApi.getDocumentoArquivo(processoId, doc.id);
        if (blob) salvarBlob(blob, nomeArquivo(doc));
      } catch (err) {
        alert(err.message);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = texto; }
      }
    }

    document.getElementById('docViewerFechar').addEventListener('click', fecharViewer);
    viewer.addEventListener('click', e => { if (e.target === viewer) fecharViewer(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && viewer.classList.contains('open')) fecharViewer(); });

    async function loadResumos() {
      const tabContent = document.getElementById('tabContent');
      tabContent.innerHTML = '<div class="loading"><span class="spinner spinner-dark"></span></div>';
      try {
        const resumos = await portalApi.getResumos(processoId);
        const arr = resumos || [];

        if (arr.length === 0) {
          tabContent.innerHTML = `
            <div class="card">
              <div class="card-header">
                <span class="card-title">Resumos do escritório</span>
              </div>
              <div class="empty-state">
                <div class="empty-state-icon">🤖</div>
                <div class="empty-state-title">Nenhum resumo disponível</div>
                <div class="empty-state-desc">Quando o escritório compartilhar um resumo de IA com você, ele aparecerá aqui.</div>
              </div>
            </div>`;
          return;
        }

        const items = arr.map((r, idx) => `
          <details class="resumo-cliente" ${idx === 0 ? 'open' : ''}>
            <summary>
              <span class="resumo-cliente-data">${formatDateTime(r.geradoEm)}</span>
              <span class="resumo-cliente-meta">por ${escapeHtml(r.geradoPorNome)}</span>
              ${idx === 0 ? '<span class="badge badge-blue" style="font-size:10px;margin-left:8px">Mais recente</span>' : ''}
            </summary>
            <div class="resumo-cliente-body md-content"></div>
          </details>
        `).join('');

        tabContent.innerHTML = `
          <div class="card">
            <div class="card-header">
              <span class="card-title">Resumos do escritório</span>
              <span class="badge badge-gray" style="margin-left:auto">${arr.length} resumo${arr.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="info-banner" style="margin:0 0 12px;padding:10px 12px;background:#fef9c3;border:1px solid #fde68a;border-radius:6px;color:#92400e;font-size:12.5px;line-height:1.5">
              <strong>🤖 Resumo gerado por IA.</strong> Este é um resumo automático. Em caso de dúvidas, fale com seu advogado.
            </div>
            <div class="resumo-cliente-list">${items}</div>
          </div>`;

        const containers = tabContent.querySelectorAll('.resumo-cliente-body');
        arr.forEach((r, idx) => {
          if (containers[idx]) containers[idx].innerHTML = renderMarkdown(r.conteudo);
        });
      } catch (err) {
        tabContent.innerHTML = `<div class="alert alert-error" style="margin:16px">${err.message}</div>`;
      }
    }

  </script>
</body>
</html>
