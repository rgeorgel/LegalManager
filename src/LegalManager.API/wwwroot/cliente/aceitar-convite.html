<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aceitar convite â€” Portal do Cliente</title>
  <link rel="stylesheet" href="/cliente/css/portal.css">
</head>
<body>
  <header class="portal-nav">
    <a href="/cliente/index.html" class="portal-logo">âš–ï¸ Causify</a>
  </header>

  <main class="portal-page">
    <div class="auth-card" style="max-width:420px;margin:40px auto">
      <h1 style="font-size:20px;font-weight:700;margin-bottom:8px">Bem-vindo ao portal!</h1>
      <p style="color:#6b7280;font-size:14px;margin-bottom:24px">Crie sua senha para acessar o portal do cliente.</p>
      <div id="alert" class="alert alert-error" style="display:none"></div>
      <form id="form">
        <div class="form-group">
          <label>Senha *</label>
          <input type="password" id="senha" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Confirmar senha *</label>
          <input type="password" id="confirmar" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">Criar senha e entrar</button>
      </form>
    </div>
  </main>
  <script type="module">
    import { aceitarConvitePortal } from '/cliente/js/clienteApi.js';
    const token = new URLSearchParams(location.search).get('token');
    const alertEl = document.getElementById('alert');
    const btn = document.getElementById('submitBtn');

    if (!token) {
      alertEl.className = 'alert alert-error';
      alertEl.textContent = 'Token de convite invÃ¡lido ou expirado.';
      alertEl.style.display = 'block';
      document.getElementById('form').style.display = 'none';
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const senha = document.getElementById('senha').value;
      const confirmar = document.getElementById('confirmar').value;
      if (senha !== confirmar) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = 'As senhas nÃ£o coincidem.';
        alertEl.style.display = 'block';
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      alertEl.style.display = 'none';
      try {
        await aceitarConvitePortal(token, senha);
        window.location.href = '/cliente/dashboard.html';
      } catch (err) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = err.message;
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Criar senha e entrar';
      }
    });
  </script>
</body>
</html>
