<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Honorários – Portal do Cliente</title>
  <link rel="stylesheet" href="/cliente/css/portal.css">
  <style>
    .contrato { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:16px 18px; margin-bottom:14px; border-left:4px solid #C9A84C; box-shadow:0 1px 4px rgba(0,0,0,.04); }
    .contrato h3 { margin:0 0 6px; font-size:16px; font-weight:700; color:#1B2A4A; }
    .contrato .num { font-size:11px; color:#6B7A99; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
    .contrato-info { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px 16px; margin-top:12px; font-size:13px; }
    .contrato-info .lbl { color:#6B7A99; font-size:10px; text-transform:uppercase; letter-spacing:.3px; }
    .contrato-info .val { font-weight:700; margin-top:3px; }
    .badge-ok { background:#d1fae5; color:#059669; font-size:11px; padding:3px 9px; border-radius:999px; font-weight:700; }
    .badge-err { background:#fee2e2; color:#b91c1c; font-size:11px; padding:3px 9px; border-radius:999px; font-weight:700; }
    .badge-muted { background:#f1f3f8; color:#6B7A99; font-size:11px; padding:3px 9px; border-radius:999px; font-weight:700; }
    .badge-warn { background:#fef3c7; color:#b45309; font-size:11px; padding:3px 9px; border-radius:999px; font-weight:700; }

    .empty { text-align:center; padding:40px 16px; color:#6B7A99; }
    .empty p { font-size:14px; margin-top:8px; }

    .parcela-row { padding:10px 0; border-bottom:1px solid #e5e7eb; font-size:13px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    .parcela-row:last-child { border-bottom:none; }
    .parcela-info { display:flex; flex-direction:column; }
    .parcela-num { font-weight:700; }
    .parcela-venc { font-size:11px; color:#6B7A99; }
    .btn-mini { background:transparent; border:1px solid #C9A84C; color:#1B2A4A; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; }
    .btn-mini:hover { background:#C9A84C; color:#fff; }
  </style>
</head>
<body>
  <header class="portal-nav" id="portalNav"></header>

  <main class="portal-page">
    <div class="page-header">
      <h1 class="page-title">Meus Honorários</h1>
      <p class="page-subtitle">Contratos de honorários advocatícios firmados com este escritório</p>
    </div>

    <div id="content">
      <div class="loading"><span class="spinner spinner-dark"></span></div>
    </div>
  </main>

  <script type="module">
    import { initLayout, formatDate } from '/cliente/js/clienteLayout.js';
    import { listarContratosCliente, listarParcelasCliente, abrirExtratoPdf, brl } from '/cliente/js/clienteHonorarios.js';

    (async () => {
      const user = initLayout('honorarios');
      if (!user) return;

      const content = document.getElementById('content');
      let contratos = [];
      try {
        contratos = await listarContratosCliente();
      } catch (e) {
        if (e.message && e.message.includes('401')) {
          window.location.href = '/cliente/index.html';
          return;
        }
        content.innerHTML = `<div class="empty"><div style="font-size:30px">⚠️</div><p>Erro ao carregar contratos: ${e.message}</p></div>`;
        return;
      }

      if (!contratos.length) {
        content.innerHTML = `
          <div class="empty">
            <div style="font-size:38px">💼</div>
            <p>Você ainda não possui contratos de honorários cadastrados.</p>
            <p style="font-size:12px">Entre em contato com o escritório para regularizar.</p>
          </div>
        `;
        return;
      }

      content.innerHTML = `<div id="lista"></div>`;
      const lista = document.getElementById('lista');

      for (const c of contratos) {
        const contratoId = c.id ?? c.Id;
        const status = c.status ?? c.Status;
        const valorReceber = (c.valorPendente ?? c.ValorPendente ?? 0) + (c.valorEmAtraso ?? c.ValorEmAtraso ?? 0);

        let statusBadge = { cls: 'badge-muted', label: status };
        if (status === 'Quitado') statusBadge = { cls: 'badge-ok', label: '✔ Quitado' };
        else if ((c.parcelasVencidas ?? c.ParcelasVencidas) > 0) statusBadge = { cls: 'badge-err', label: '🔴 Em Atraso' };
        else if (status === 'Ativo') statusBadge = { cls: 'badge-warn', label: '🟢 Em Dia' };

        const card = document.createElement('div');
        card.className = 'contrato';
        card.style.borderLeftColor = (c.parcelasVencidas ?? c.ParcelasVencidas) > 0 ? '#dc2626'
          : status === 'Quitado' ? '#059669'
          : status === 'Suspenso' ? '#b45309'
          : '#C9A84C';
        card.innerHTML = `
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
            <div style="min-width:0;flex:1">
              <div class="num">${c.numeroContrato ?? c.NumeroContrato}</div>
              <h3>${escapeHtml(c.objeto ?? c.Objeto ?? 'Honorários advocatícios')}</h3>
            </div>
            <span class="${statusBadge.cls}">${statusBadge.label}</span>
          </div>
          <div class="contrato-info">
            <div><div class="lbl">Total</div><div class="val">${brl(c.valorTotal ?? c.ValorTotal)}</div></div>
            <div><div class="lbl">Pago</div><div class="val" style="color:#059669">${brl(c.valorPago ?? c.ValorPago)}</div></div>
            <div><div class="lbl">A Pagar</div><div class="val" style="color:${(c.valorEmAtraso ?? c.ValorEmAtraso) > 0 ? '#dc2626' : '#b45309'}">${brl(valorReceber)}</div></div>
            <div><div class="lbl">Forma</div><div class="val">${formaLabel(c.formaPagamento ?? c.FormaPagamento)}</div></div>
          </div>
          <div style="margin-top:14px">
            <details>
              <summary style="cursor:pointer;font-size:13px;font-weight:600;color:#1B2A4A;padding:4px 0">📋 Ver parcelas (${c.totalParcelas ?? c.TotalParcelas ?? 0})</summary>
              <div id="parcelas-${contratoId}" style="padding:8px 0">Carregando...</div>
            </details>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
              <button class="btn-mini" onclick="window._extrato('${contratoId}')">📑 Baixar Extrato</button>
            </div>
          </div>
        `;
        lista.appendChild(card);

        card.querySelector('details')?.addEventListener('toggle', async (ev) => {
          if (ev.target.open) {
            const cont = document.getElementById('parcelas-' + contratoId);
            try {
              const r = await listarParcelasCliente(contratoId);
              const parcelas = r?.parcelas ?? r?.Parcelas ?? [];
              if (!parcelas.length) { cont.innerHTML = '<div style="color:#6B7A99">Nenhuma parcela</div>'; return; }
              const totalNaoEntrada = parcelas.filter(p => !(p.isEntrada ?? p.IsEntrada)).length;
              cont.innerHTML = parcelas.map(p => {
                const st = p.status ?? p.Status;
                const label = (p.isEntrada ?? p.IsEntrada) ? 'Entrada' : `${p.numero ?? p.Numero}/${totalNaoEntrada}`;
                let badge;
                if (st === 'Pago') badge = '<span class="badge-ok">✅ Pago</span>';
                else if (st === 'Vencido') badge = '<span class="badge-err">🔴 Atraso</span>';
                else if (st === 'Cancelado') badge = '<span class="badge-muted">◆ Cancelado</span>';
                else badge = '<span class="badge-warn">⏳ Pendente</span>';
                const juros = p.jurosMulta ?? p.JurosMulta;
                return `
                  <div class="parcela-row">
                    <div class="parcela-info">
                      <div class="parcela-num">${label} — ${brl(p.valorOriginal ?? p.ValorOriginal)}</div>
                      <div class="parcela-venc">Vencimento: ${formatDate(p.vencimento ?? p.Vencimento)}${juros && juros > 0 ? ` · + ${brl(juros)} (multa+juros) = ${brl(p.valorAtualizado ?? p.ValorAtualizado)}` : ''}</div>
                    </div>
                    <div>${badge}</div>
                  </div>
                `;
              }).join('');
            } catch (e) {
              cont.innerHTML = '<div style="color:#dc2626">Erro ao carregar parcelas.</div>';
            }
          }
        });
      }

      window._extrato = abrirExtratoPdf;
      function escapeHtml(s) { return (s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
      function formaLabel(v) {
        if (typeof v === 'string') return ({ AVista: 'À Vista', Parcelado: 'Parcelado', EntradaParcelado: 'Entrada + Parcelas' })[v] ?? v;
        return ['', 'À Vista', 'Parcelado', 'Entrada + Parcelas'][v] ?? '—';
      }
    })();
  </script>
</body>
</html>
