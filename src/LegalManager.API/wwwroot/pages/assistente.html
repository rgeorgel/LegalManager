  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Personalizar assistente</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .mascote-destaque {
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
      background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 20px 24px; margin-bottom: 24px;
    }
    .mascote-destaque-arte { width: 96px; height: 96px; color: var(--color-text); flex-shrink: 0; }
    .mascote-destaque-info { flex: 1; min-width: 200px; }
    .mascote-destaque-rotulo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); }
    .mascote-destaque-nome { font-size: 20px; font-weight: 700; margin: 2px 0 4px; }
    .mascote-destaque-desc { color: var(--color-text-muted); }
    .mascote-destaque-dica { font-size: 12.5px; color: var(--color-text-muted); margin-top: 8px; }
    .mascote-secao { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); margin: 8px 0 12px; }
    .mascote-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 28px; }
    /* !important nas cores: o preset escuro força `button { color: inherit !important }`. */
    .mascote-card {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
      background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius);
      padding: 16px 10px 12px; cursor: pointer; color: var(--color-text) !important; font: inherit;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .mascote-card:hover { border-color: var(--color-primary); transform: translateY(-2px); }
    .mascote-card:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .mascote-card[aria-checked="true"] { border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary); }
    .mascote-card[aria-checked="true"]::after {
      content: "✓"; position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
      background: var(--color-primary); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px;
    }
    .mascote-card:disabled { cursor: progress; opacity: .7; }
    .mascote-card-arte { width: 72px; height: 72px; }
    .mascote-card-nome { font-weight: 600; font-size: 13.5px; }
    .mascote-card-desc { font-size: 11.5px; color: var(--color-text-muted); line-height: 1.4; }
    .mascote-padrao { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-muted); }
    /* Piscar, como no botão do assistente (as pálpebras vêm no SVG de js/mascotes.js). */
    .mascote-pisca .asx-palpebras rect { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); animation: mascote-piscar 5s infinite; }
    @keyframes mascote-piscar { 0%, 92%, 100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .mascote-pisca .asx-palpebras rect { animation: none; } }
    @media (max-width: 480px) {
      .mascote-grade { grid-template-columns: repeat(2, 1fr); }
      .mascote-destaque { padding: 16px; gap: 16px; }
      .mascote-destaque-arte { width: 72px; height: 72px; }
    }
  </style>

</head>
<body>
<div class="app-layout">
  <header class="header">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="header-logo"><img src="/images/causify-logo-navbar-clara.png" alt="Causify"></div>
    <div class="header-spacer"></div>
    <div class="header-user">
      <span class="header-user-name"></span>
      <span style="color:var(--color-border)">|</span>
      <span class="header-tenant"></span>
      <button class="btn btn-secondary btn-sm" id="logoutBtn">Sair</button>
    </div>
  </header>

  <nav class="sidebar"><ul class="sidebar-nav"></ul></nav>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">🎨 Personalizar assistente</h1>
      <p class="page-subtitle">Escolha o mascote do seu assistente de IA. A escolha é só sua: cada pessoa do escritório pode ter o seu.</p>
    </div>

    <section class="mascote-destaque" aria-live="polite">
      <div class="mascote-destaque-arte mascote-pisca" id="destaqueArte" aria-hidden="true"></div>
      <div class="mascote-destaque-info">
        <div class="mascote-destaque-rotulo">Seu assistente</div>
        <div class="mascote-destaque-nome" id="destaqueNome"></div>
        <div class="mascote-destaque-desc" id="destaqueDesc"></div>
        <div class="mascote-destaque-dica">Ele aparece no botão “Assistente” na lateral direita e no topo da conversa.</div>
      </div>
      <button type="button" class="btn btn-primary" id="abrirAssistente">Conversar com o assistente</button>
    </section>
    <div id="mascoteMsg" class="alert" style="display:none;margin-bottom:16px"></div>

    <div role="radiogroup" aria-label="Mascote do assistente" id="mascotes"></div>
  </main>
</div>

<script type="module">
  import { initLayout } from '/js/layout.js';
  import { apiFetch, getUser } from '/js/api.js';
  import { esc } from '/js/utils.js';
  import { trackEvent } from '/js/analytics.js';
  import { MASCOTES, MASCOTE_PADRAO, getMascote } from '/js/mascotes.js';
  import { trocarMascote } from '/js/assistente.js';

  initLayout();

  const GRUPOS = [
    { titulo: 'Corujas', filtro: m => m.id.startsWith('coruja') && m.id !== 'coruja-gato' },
    { titulo: 'Outros animais', filtro: m => !m.id.startsWith('coruja') || m.id === 'coruja-gato' },
  ];

  let atual = getMascote(getUser()?.assistenteMascote).id;
  let salvando = false;

  const lista = document.getElementById('mascotes');
  lista.innerHTML = GRUPOS.map(g => `
    <h2 class="mascote-secao">${g.titulo}</h2>
    <div class="mascote-grade">${MASCOTES.filter(g.filtro).map(m => `
      <button type="button" class="mascote-card" role="radio" data-mascote="${m.id}" aria-checked="false">
        <span class="mascote-card-arte mascote-pisca" aria-hidden="true">${m.svg}</span>
        <span class="mascote-card-nome">${esc(m.nome)}</span>
        ${m.id === MASCOTE_PADRAO ? '<span class="mascote-padrao">Padrão</span>' : ''}
        <span class="mascote-card-desc">${esc(m.desc)}</span>
      </button>`).join('')}
    </div>`).join('');

  function marcar(id) {
    const m = getMascote(id);
    document.getElementById('destaqueArte').innerHTML = m.svg;
    document.getElementById('destaqueNome').textContent = m.nome;
    document.getElementById('destaqueDesc').textContent = m.desc;
    lista.querySelectorAll('[data-mascote]').forEach(b => {
      const sel = b.dataset.mascote === m.id;
      b.setAttribute('aria-checked', String(sel));
      b.tabIndex = sel ? 0 : -1;
    });
    trocarMascote(m.id);
  }

  function aviso(texto, tipo) {
    const el = document.getElementById('mascoteMsg');
    el.className = `alert alert-${tipo}`;
    el.textContent = texto;
    el.style.display = 'block';
    clearTimeout(aviso.t);
    if (tipo === 'success') aviso.t = setTimeout(() => { el.style.display = 'none'; }, 2500);
  }

  // Salva ao clicar: a troca aparece na hora (destaque e botão lateral) e volta atrás se a API falhar.
  async function escolher(id) {
    if (salvando || id === atual) return;
    const anterior = atual;
    salvando = true;
    atual = id;
    marcar(id);
    lista.querySelectorAll('[data-mascote]').forEach(b => { b.disabled = true; });
    try {
      await apiFetch('/assistente/mascote', { method: 'PUT', body: { mascote: id } });
      try {
        const user = getUser();
        if (user) sessionStorage.setItem('user', JSON.stringify({ ...user, assistenteMascote: id }));
      } catch { /* sessão ilegível: o servidor já tem a escolha */ }
      trackEvent('assistente_mascote_alterado', { de: anterior, para: id });
      aviso(`${getMascote(id).nome} agora é o seu assistente.`, 'success');
    } catch (err) {
      atual = anterior;
      marcar(anterior);
      aviso(err.message || 'Não foi possível salvar o mascote.', 'error');
    } finally {
      salvando = false;
      lista.querySelectorAll('[data-mascote]').forEach(b => { b.disabled = false; });
      lista.querySelector(`[data-mascote="${atual}"]`)?.focus();
    }
  }

  lista.addEventListener('click', e => {
    const card = e.target.closest('[data-mascote]');
    if (card) escolher(card.dataset.mascote);
  });
  // Setas navegam entre os cards (padrão de radiogroup).
  lista.addEventListener('keydown', e => {
    if (!['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(e.key)) return;
    const cards = [...lista.querySelectorAll('[data-mascote]')];
    const i = cards.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    const prox = cards[(i + (['ArrowRight', 'ArrowDown'].includes(e.key) ? 1 : -1) + cards.length) % cards.length];
    prox.focus();
  });

  document.getElementById('abrirAssistente').addEventListener('click', () => {
    document.getElementById('asxFab')?.click();
  });

  marcar(atual);
</script>
</body>
</html>
