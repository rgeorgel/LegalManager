  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Honorários Contratos</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .hp-kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:14px; }
    .hp-card { background:var(--color-surface, #fff); border:1px solid var(--color-border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
    .hp-card .lbl { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--color-text-muted); }
    /* KPIs compactos: menos respiro e número menor que o dos cards de gráfico. */
    .hp-kpi .hp-card { padding:9px 12px; }
    .hp-kpi .hp-card .lbl { font-size:10px; }
    .hp-kpi .hp-card .val { font-size:16px; font-weight:700; margin-top:3px; line-height:1.25; }
    .hp-kpi .hp-card .sub { font-size:11px; color:var(--color-text-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    @media (max-width:520px) { .hp-kpi { grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; } }

    /* Evolução (barras com grade e eixo Y) e Meta (anel) lado a lado; no celular, um embaixo do outro. */
    .hp-graficos { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; margin-bottom:14px; }
    .hp-graficos > .hp-card { display:flex; flex-direction:column; }
    @media (max-width:900px) { .hp-graficos { grid-template-columns:minmax(0,1fr); } }

    .hp-evo-wrap { container-type:inline-size; }
    .hp-evo { display:grid; grid-template-columns:auto minmax(0,1fr); grid-template-rows:170px auto; column-gap:8px; margin-top:14px; }
    .hp-evo-val .curto { display:none; }
    /* Gráfico estreito (celular, tela média): valor das barras abreviado ("1,2 mil") para não encavalar. */
    @container (max-width:480px) { .hp-evo-val .cheio { display:none; } .hp-evo-val .curto { display:inline; } }
    .hp-evo-y { position:relative; grid-row:1; grid-column:1; min-width:34px; }
    .hp-evo-y span { position:absolute; right:0; transform:translateY(50%); font-size:10px; color:var(--color-text-muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
    .hp-evo-plot { position:relative; grid-row:1; grid-column:2; display:flex; align-items:flex-end; gap:6px; }
    .hp-evo-grid { position:absolute; left:0; right:0; height:0; border-top:1px dashed var(--color-border); pointer-events:none; }
    .hp-evo-grid.base { border-top-style:solid; }
    .hp-evo-col { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
    .hp-evo-bar { width:100%; max-width:38px; background:linear-gradient(180deg,#E4C878,#C9A84C); border-radius:4px 4px 0 0; position:relative; z-index:1; }
    .hp-evo-val { font-size:10px; color:var(--color-text-muted); margin-bottom:3px; white-space:nowrap; font-variant-numeric:tabular-nums; position:relative; z-index:1; }
    .hp-evo-x { grid-row:2; grid-column:2; display:flex; gap:6px; margin-top:5px; }
    .hp-evo-x span { flex:1; text-align:center; font-size:11px; color:var(--color-text-muted); font-weight:600; }

    .hp-meta { flex:1; display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap; margin-top:14px; }
    .hp-meta-anel { position:relative; width:170px; height:170px; flex:none; }
    .hp-meta-anel svg { width:100%; height:100%; transform:rotate(-90deg); }
    .hp-meta-anel .trilho { stroke:var(--color-border); }
    .hp-meta-anel .arco { stroke:#C9A84C; transition:stroke-dashoffset .5s; }
    .hp-meta-anel.ok .arco { stroke:#059669; }
    .hp-meta-centro { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .hp-meta-centro .pct { font-size:30px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
    .hp-meta-centro .rot { font-size:11px; color:var(--color-text-muted); margin-top:4px; }
    .hp-meta-leg { display:flex; flex-direction:column; gap:10px; min-width:0; }
    .hp-meta-leg .item { display:flex; flex-direction:column; }
    .hp-meta-leg .item .k { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--color-text-muted); display:flex; align-items:center; gap:6px; }
    .hp-meta-leg .item .v { font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
    .hp-meta-leg .dot { width:9px; height:9px; border-radius:50%; flex:none; }
    .hp-meta-leg .falta .v { color:#b45309; font-size:20px; }
    .hp-meta-leg .falta.ok .v { color:#059669; }

    .badge-sm { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; }
    .badge-ok { background:#d1fae5; color:#059669; }
    .badge-err { background:#fee2e2; color:#dc2626; }
    .badge-warn { background:#fef3c7; color:#b45309; }
    .badge-muted { background:#f1f3f8; color:#6b7a99; }
    .badge-proc { background:#ede9fe; color:#7c3aed; }

    .filter-bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
    .filter-bar select, .filter-bar input { padding:7px 10px; border:1px solid var(--color-border); border-radius:var(--radius); background:#fff; font-size:13px; }

    /* View toggle (lista/blocos) — mesmo padrão visual de Contatos e Processos */
    .view-toggle { display:flex; gap:4px; align-items:center; }
    .view-btn { width:36px; height:36px; border:1px solid var(--color-border); border-radius:var(--radius); background:var(--color-bg); color:var(--color-text); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; transition:.2s; }
    .view-btn:hover { background:var(--color-border); }
    .view-btn.active { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }

    /* Visão em blocos: card de entidade do sistema (.ent-* em styles.css, js/cards.js). */

    /* Visão em lista no padrão de Processos: uma linha-card por contrato (cliente, nº, status
       e ações em cima; abaixo, grade de "rótulo sobre valor"). Sem tabela, sem scroll lateral. */
    .ct-lista { display:flex; flex-direction:column; gap:10px; }
    .ct-row { border:1px solid var(--color-border); border-radius:var(--radius); padding:14px 18px; background:var(--color-surface, #fff); }
    .ct-row.ng { border-left:4px solid #dc2626; }
    .ct-row-top { display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
    .ct-row-id { flex:1 1 260px; min-width:0; }
    .ct-row-nome { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:700; font-size:15px; }
    .ct-row-nome a { color:inherit; overflow-wrap:anywhere; }
    .ct-row-obj { font-size:13px; color:var(--color-text-muted); margin-top:3px; overflow-wrap:anywhere; }
    .ct-row-acoes { display:flex; gap:6px; flex-wrap:wrap; }
    .ct-row-info { display:grid; grid-template-columns:minmax(0,1.6fr) repeat(5, minmax(0,1fr)); gap:12px 24px;
      margin-top:12px; padding-top:12px; border-top:1px solid var(--color-border); }
    .ct-row-info .lb { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#9ca3af; margin-bottom:3px; }
    .ct-row-info .vl { font-size:14px; font-weight:500; overflow-wrap:anywhere; }
    .ct-row-info .vl.danger { color:#dc2626; font-weight:700; }
    .ct-row-info .vl.vazio { color:var(--color-text-muted); }
    @media (max-width:1100px) { .ct-row-info { grid-template-columns:repeat(3, minmax(0,1fr)); } }
    @media (max-width:520px) {
      .ct-row { padding:12px 14px; }
      .ct-row-info { grid-template-columns:repeat(2, minmax(0,1fr)); }
      .ct-row-info > .ct-proc { grid-column:1 / -1; }
      .ct-row-acoes { flex:1 1 100%; }
    }

    /* Ordenação: mesmos campos nas duas visões; 1º clique ▲, 2º ▼, 3º volta ao padrão. */
    .sort-bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:12px; font-size:12px; }
    .sort-bar .sort-lbl { color:var(--color-text-muted); font-weight:600; margin-right:2px; }
    .sort-chip { border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text); border-radius:999px;
      padding:4px 10px; font-size:12px; cursor:pointer; }
    .sort-chip:hover { border-color:var(--color-primary); color:var(--color-primary); }
    .sort-chip.active { background:var(--color-primary); border-color:var(--color-primary); color:#fff; }

    .empty { text-align:center; padding:38px 16px; color:var(--color-text-muted); }
    .empty p { margin-bottom:14px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <header class="header">
      <button class="hamburger" id="hamburger">☰</button>
      <div class="header-logo"><img src="/images/causify-logo-navbar-clara.png" alt="Causify"></div>
      <div class="header-spacer"></div>
      <div class="header-user">
        <span class="header-user-name"></span>
        <span style="color:var(--color-border)">|</span>
        <span class="header-tenant"></span>
        <button class="btn btn-secondary btn-sm" id="logoutBtn">Sair</button>
      </div>
    </header>
    <nav class="sidebar"><ul class="sidebar-nav"></ul></nav>
    <main class="main-content">

      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <h1 class="page-title">💼 Honorários Contratos</h1>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-secondary" id="btnConfig">⚙ Configurações</button>
          <a class="btn btn-primary" href="/pages/honorarios-contrato-novo.html">+ Novo Contrato</a>
        </div>
      </div>

      <div id="dashTiles" class="hp-kpi"></div>

      <div class="hp-graficos">
        <div class="hp-card">
          <div class="lbl">📊 Evolução de Pagamentos (6 meses)</div>
          <div id="dashEvo" class="hp-evo-wrap"></div>
        </div>
        <div class="hp-card">
          <div class="lbl">🎯 Meta do Mês</div>
          <div id="dashMeta"></div>
        </div>
      </div>

      <div class="hp-card" style="margin-bottom:14px" id="dashInadimplentesCard">
        <div class="lbl">🔴 Clientes em Atraso</div>
        <div id="dashInadimplentes"></div>
      </div>

      <div class="hp-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div style="font-size:14px;font-weight:700">Contratos</div>
          <div class="view-toggle">
            <button type="button" class="view-btn" id="viewList" title="Visualização em lista">☰</button>
            <button type="button" class="view-btn" id="viewCards" title="Visualização em blocos">⊞</button>
          </div>
        </div>
        <div class="filter-bar">
          <select id="filtroStatus">
            <option value="">Todos</option>
            <option value="Ativo">🟢 Ativos</option>
            <option value="Inadimplente">🔴 Em Atraso</option>
            <option value="Quitado">✔ Quitados</option>
            <option value="Suspenso">⏸ Suspensos</option>
            <option value="Distratado">✖ Distratados</option>
            <option value="Encerrado">◆ Encerrados</option>
          </select>
          <input type="text" id="filtroBusca" placeholder="Buscar por cliente, nº, objeto ou processo..." style="flex:1;min-width:200px">
        </div>
        <div class="sort-bar" id="sortBar" role="group" aria-label="Ordenar contratos"></div>
        <div id="lista"></div>
        <div id="paginacao" style="display:flex;justify-content:center;gap:6px;margin-top:14px"></div>
      </div>

    </main>
  </div>

  <script type="module">
    import { initLayout } from '/js/layout.js';
    import { cardEntidade, ativarCardsClicaveis, ICONES } from '/js/cards.js';
    import {
      brl, fmtDate, escapeHtml, notify, pick,
      listarContratos, getDashboard,
      mapForma, statusContrato, STATUS_CONTRATO_LABELS
    } from '/js/honorarios.js';
    initLayout();

    // Nesta tela o foco é o contrato: o nome do cliente abre o contrato, não o perfil do contato.
    const detalheUrl = (id) => `/pages/honorarios-contrato-detalhe.html?id=${encodeURIComponent(id)}`;

    const PAGE_SIZE = 50;
    // Ordenação pelas colunas da lista (vale também para os blocos). Sem coluna escolhida, o
    // servidor mostra os mais recentes primeiro, com os quitados no fim.
    const SORT_KEY = 'honorariosContratos.sort';
    let pageState = { page: 1, status: '', busca: '', ordem: '', desc: false };
    try {
      const s = JSON.parse(localStorage.getItem(SORT_KEY) || 'null');
      if (s && typeof s.ordem === 'string') { pageState.ordem = s.ordem; pageState.desc = !!s.desc; }
    } catch {}

    // Visualização (lista/blocos) persistida em localStorage, como em Contatos.
    const VIEW_KEY = 'honorariosContratos.view';
    const VALID_VIEW = new Set(['list', 'cards']);
    let currentView = 'cards';
    try {
      const v = localStorage.getItem(VIEW_KEY);
      if (VALID_VIEW.has(v)) currentView = v;
    } catch {}
    let ultimosItens = [];

    const fmtStatus = (s) => STATUS_CONTRATO_LABELS[s] ?? { cls: 'badge-muted', label: s };

    async function renderDashboard() {
      const tiles = document.getElementById('dashTiles');
      tiles.innerHTML = '<div class="hp-card"><div class="lbl">Carregando...</div></div>';
      const d = await getDashboard();
      if (!d) {
        tiles.innerHTML = '';
        return;
      }
      const totalReceber = pick(d, 'totalAReceber', 0);
      const totalAtraso = pick(d, 'totalEmAtraso', 0);
      const recebidoMes = pick(d, 'recebidoNoMes', 0);
      const atrasados = pick(d, 'contratosAtrasados', 0);
      const ativos = pick(d, 'contratosAtivos', 0);
      const quitados = pick(d, 'contratosQuitados', 0);
      tiles.innerHTML = `
        <div class="hp-card">
          <div class="lbl">Total a Receber</div>
          <div class="val">${brl(totalReceber)}</div>
          <div class="sub">${ativos} ativos · ${quitados} quitados</div>
        </div>
        <div class="hp-card" style="border-color:#fca5a5">
          <div class="lbl" style="color:#dc2626">Em Atraso</div>
          <div class="val" style="color:#dc2626">${brl(totalAtraso)}</div>
          <div class="sub">${atrasados} contrato(s) com parcelas vencidas</div>
        </div>
        <div class="hp-card">
          <div class="lbl" style="color:#059669">Recebido no Mês</div>
          <div class="val" style="color:#059669">${brl(recebidoMes)}</div>
          <div class="sub">Pago em honorários no mês atual</div>
        </div>
        <div class="hp-card" style="border-color:#fde68a">
          <div class="lbl" style="color:#b45309">Contratos Atrasados</div>
          <div class="val" style="color:#b45309">${atrasados}</div>
          <div class="sub">Requerem atenção</div>
        </div>
      `;
      renderEvolucao(pick(d, 'evolucao6Meses', []) ?? []);
      renderMeta({
        metaMensal: pick(d, 'metaMensal', null),
        alcancadoMes: pick(d, 'alcancadoMes', 0),
      });
      renderInadimplentes(pick(d, 'inadimplentes', []) ?? []);
    }

    // Escala "redonda" do eixo Y: ~4 faixas de 1/2/2,5/5 × 10ⁿ, com folga acima da maior barra
    // para o rótulo de valor caber dentro do gráfico.
    function escalaY(max) {
      if (!(max > 0)) return { topo: 1000, passo: 250 };
      const bruto = max / 4;
      const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
      const passo = [1, 2, 2.5, 5, 10].map(f => f * mag).find(p => p >= bruto);
      let topo = Math.ceil(max / passo) * passo;
      if (max / topo > 0.88) topo += passo;
      return { topo, passo };
    }
    const fmtEixo = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });

    function renderEvolucao(meses) {
      const el = document.getElementById('dashEvo');
      if (!meses.length) { el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--color-text-muted)">—</div>'; return; }
      const totais = meses.map(m => pick(m, 'total', 0) || 0);
      const { topo, passo } = escalaY(Math.max(...totais));
      const pctDe = (v) => (v / topo) * 100;

      let marcas = '', linhas = '';
      for (let v = 0; v <= topo + passo / 2; v += passo) {
        const b = pctDe(v).toFixed(2);
        marcas += `<span style="bottom:${b}%">${v === 0 ? '0' : fmtEixo.format(v)}</span>`;
        linhas += `<div class="hp-evo-grid${v === 0 ? ' base' : ''}" style="bottom:${b}%"></div>`;
      }
      const colunas = meses.map((m, i) => {
        const total = totais[i];
        const h = total > 0 ? Math.max(pctDe(total), 1.5) : 0;
        const rotulo = escapeHtml(pick(m, 'label', ''));
        return `
          <div class="hp-evo-col" title="${rotulo}: ${escapeHtml(brl(total))}">
            ${total > 0 ? `<div class="hp-evo-val"><span class="cheio">${brl(total).replace('R$', '').trim()}</span><span class="curto">${fmtEixo.format(total)}</span></div>` : ''}
            <div class="hp-evo-bar" style="height:${h}%"></div>
          </div>`;
      }).join('');
      el.innerHTML = `
        <div class="hp-evo">
          <div class="hp-evo-y" aria-hidden="true">${marcas}</div>
          <div class="hp-evo-plot">${linhas}${colunas}</div>
          <div class="hp-evo-x">${meses.map(m => `<span>${escapeHtml(pick(m, 'label', ''))}</span>`).join('')}</div>
        </div>`;
    }

    // Meta do mês como anel: a parte preenchida é o recebido, o trilho vazio é o que falta.
    function renderMeta(d) {
      const el = document.getElementById('dashMeta');
      const meta = d.metaMensal;
      const rec = d.alcancadoMes ?? 0;
      if (!meta || meta <= 0) {
        el.innerHTML = `<div class="hp-meta"><div style="padding:10px;color:var(--color-text-muted);font-size:13px;text-align:center">Defina uma meta em <a href="/pages/honorarios-config.html">Configurações</a> para acompanhar.</div></div>`;
        return;
      }
      const pctReal = (rec / meta) * 100;
      const pct = Math.min(Math.max(pctReal, 0), 100);
      const atingida = rec >= meta;
      const r = 72, circ = 2 * Math.PI * r;
      const cor = atingida ? '#059669' : '#C9A84C';
      el.innerHTML = `
        <div class="hp-meta">
          <div class="hp-meta-anel${atingida ? ' ok' : ''}" role="img"
               aria-label="${pctReal.toFixed(0)}% da meta de ${escapeHtml(brl(meta))}">
            <svg viewBox="0 0 170 170">
              <circle class="trilho" cx="85" cy="85" r="${r}" fill="none" stroke-width="16"/>
              ${pct > 0 ? `<circle class="arco" cx="85" cy="85" r="${r}" fill="none" stroke-width="16" stroke-linecap="round"
                stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${(circ * (1 - pct / 100)).toFixed(2)}"/>` : ''}
            </svg>
            <div class="hp-meta-centro">
              <div class="pct" style="color:${cor}">${pctReal.toFixed(0)}%</div>
              <div class="rot">${atingida ? '✅ atingida' : 'da meta'}</div>
            </div>
          </div>
          <div class="hp-meta-leg">
            <div class="item falta${atingida ? ' ok' : ''}">
              <span class="k">${rec > meta ? 'Acima da meta' : 'Falta'}</span>
              <span class="v">${brl(Math.abs(meta - rec))}</span>
            </div>
            <div class="item">
              <span class="k"><span class="dot" style="background:${cor}"></span>Recebido</span>
              <span class="v">${brl(rec)}</span>
            </div>
            <div class="item">
              <span class="k"><span class="dot" style="background:var(--color-border)"></span>Meta</span>
              <span class="v">${brl(meta)}</span>
            </div>
          </div>
        </div>`;
    }

    function renderInadimplentes(items) {
      const el = document.getElementById('dashInadimplentes');
      if (!items.length) {
        el.innerHTML = '<div style="text-align:center;padding:14px;color:#059669">✅ Nenhum contrato em atraso</div>';
        return;
      }
      el.innerHTML = items.map(i => `
        <a href="/pages/honorarios-contrato-detalhe.html?id=${i.contratoId}" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-border);text-decoration:none;color:inherit">
          <div style="width:36px;height:36px;border-radius:50%;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-weight:700">
            ${escapeHtml((i.nomeContato || '?').charAt(0).toUpperCase())}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(i.nomeContato)}</div>
            <div style="font-size:11px;color:var(--color-text-muted)">${(i.parcelasVencidas ?? 0)} parcela(s) vencida(s)</div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:700;color:#dc2626;font-size:14px">${brl(i.valorEmAtraso)}</div>
            <div style="font-size:10px;color:var(--color-text-muted)">em atraso</div>
          </div>
        </a>
      `).join('');
    }

    async function carregarLista() {
      const el = document.getElementById('lista');
      ultimosItens = [];
      el.innerHTML = '<span style="color:var(--color-text-muted)">Carregando...</span>';
      const dados = await listarContratos(pageState);
      if (!dados) { el.innerHTML = '<div class="empty">❌ Erro ao carregar contratos.</div>'; return; }
      const items = dados.items ?? dados.Items ?? [];
      const total = dados.total ?? dados.Total ?? 0;
      if (!items.length) {
        el.innerHTML = `
          <div class="empty">
            <div style="font-size:30px;margin-bottom:10px">📋</div>
            <p>Nenhum contrato encontrado.</p>
            <a class="btn btn-primary" href="/pages/honorarios-contrato-novo.html">+ Criar primeiro contrato</a>
          </div>
        `;
        return;
      }
      ultimosItens = items;
      renderItens();
      renderPaginacao(total);
    }

    function renderItens() {
      const el = document.getElementById('lista');
      if (!ultimosItens.length) return;
      if (currentView === 'list') {
        el.innerHTML = `<div class="ct-lista">${ultimosItens.map(c => renderLinha(c)).join('')}</div>`;
      } else {
        el.innerHTML = `<div class="ent-grid">${ultimosItens.map(c => renderCard(c)).join('')}</div>`;
      }
    }

    const CAMPOS_ORDEM = [
      ['cliente', 'Cliente'], ['numero', 'Nº'], ['processo', 'Processo'], ['status', 'Status'],
      ['total', 'Total'], ['aReceber', 'A Receber'], ['pago', 'Pago'], ['parcelas', 'Parcelas'], ['forma', 'Forma'],
    ];
    function renderSortBar() {
      const el = document.getElementById('sortBar');
      el.innerHTML = '<span class="sort-lbl">Ordenar por:</span>' + CAMPOS_ORDEM.map(([chave, rotulo]) => {
        const ativa = pageState.ordem === chave;
        const seta = ativa ? (pageState.desc ? ' ▼' : ' ▲') : '';
        return `<button type="button" class="sort-chip${ativa ? ' active' : ''}" data-sort="${chave}"
          aria-pressed="${ativa}" title="${ativa && pageState.desc ? 'Voltar à ordem padrão' : `Ordenar por ${rotulo}`}">${rotulo}${seta}</button>`;
      }).join('');
    }
    document.getElementById('sortBar').addEventListener('click', e => {
      const b = e.target.closest('[data-sort]');
      if (b) ordenarPor(b.dataset.sort);
    });
    renderSortBar();

    // 1º clique: crescente; 2º: decrescente; 3º: volta à ordem padrão (quitados no fim).
    function ordenarPor(chave) {
      if (pageState.ordem !== chave) { pageState.ordem = chave; pageState.desc = false; }
      else if (!pageState.desc) pageState.desc = true;
      else { pageState.ordem = ''; pageState.desc = false; }
      try { localStorage.setItem(SORT_KEY, JSON.stringify({ ordem: pageState.ordem, desc: pageState.desc })); } catch {}
      pageState.page = 1;
      renderSortBar();
      carregarLista();
    }

    function renderLinha(c) {
      const st = statusContrato(c);
      const info = fmtStatus(st);
      const aReceber = (c.valorPendente ?? c.ValorPendente ?? 0) + (c.valorEmAtraso ?? c.ValorEmAtraso ?? 0);
      const totalParc = c.totalParcelas ?? c.TotalParcelas ?? 0;
      const pagas = c.parcelasPagas ?? c.ParcelasPagas ?? 0;
      const id = c.id ?? c.Id;
      const objeto = c.objeto ?? c.Objeto;
      const proc = c.numeroProcesso ?? c.NumeroProcesso;
      const campo = (rotulo, valor, cls = '', wrap = '') =>
        `<div class="${wrap}"><div class="lb">${rotulo}</div><div class="vl ${cls}">${valor}</div></div>`;
      return `
        <div class="ct-row ${st === 'Inadimplente' ? 'ng' : ''}">
          <div class="ct-row-top">
            <div class="ct-row-id">
              <div class="ct-row-nome">
                <a href="${detalheUrl(id)}" title="Abrir contrato">${escapeHtml(c.nomeContato ?? c.NomeContato)}</a>
                <span class="badge-sm badge-muted">${escapeHtml(c.numeroContrato ?? c.NumeroContrato)}</span>
                <span class="badge-sm ${info.cls}">${info.label}</span>
              </div>
              ${objeto ? `<div class="ct-row-obj">${escapeHtml(objeto.slice(0, 140))}</div>` : ''}
            </div>
            <div class="ct-row-acoes">
              <a class="btn btn-secondary btn-sm" href="/pages/honorarios-contrato-detalhe.html?id=${id}">Ver</a>
              <a class="btn btn-secondary btn-sm" href="/pages/honorarios-contrato-novo.html?id=${id}">Editar</a>
              <button class="btn btn-secondary btn-sm" onclick="window._extratoPdf('${id}')">Extrato</button>
            </div>
          </div>
          <div class="ct-row-info">
            ${campo('Processo', proc ? `⚖ ${escapeHtml(proc)}` : '—', proc ? '' : 'vazio', 'ct-proc')}
            ${campo('Total', brl(c.valorTotal ?? c.ValorTotal))}
            ${campo('A Receber', brl(aReceber), st === 'Inadimplente' ? 'danger' : '')}
            ${campo('Pago', brl(c.valorPago ?? c.ValorPago))}
            ${campo('Parcelas', `${pagas}/${totalParc}`)}
            ${campo('Forma', mapForma(c.formaPagamento ?? c.FormaPagamento))}
          </div>
        </div>
      `;
    }

    function applyView() {
      document.getElementById('viewList').classList.toggle('active', currentView === 'list');
      document.getElementById('viewCards').classList.toggle('active', currentView === 'cards');
    }
    function setView(v) {
      currentView = v;
      try { localStorage.setItem(VIEW_KEY, v); } catch {}
      applyView();
      renderItens();
    }
    ativarCardsClicaveis(document.getElementById('lista'));
    document.getElementById('viewList').addEventListener('click', () => setView('list'));
    document.getElementById('viewCards').addEventListener('click', () => setView('cards'));
    applyView();

    function renderCard(c) {
      const st = statusContrato(c);
      const estado = st === 'Inadimplente' ? 'danger'
        : (st === 'Quitado' || st === 'Encerrado' || st === 'Distratado' || st === 'Suspenso') ? 'muted' : 'ok';
      const info = fmtStatus(st);
      const aReceber = (c.valorPendente ?? c.ValorPendente ?? 0) + (c.valorEmAtraso ?? c.ValorEmAtraso ?? 0);
      const totalParc = c.totalParcelas ?? c.TotalParcelas ?? 0;
      const pagas = c.parcelasPagas ?? c.ParcelasPagas ?? 0;
      const vencidas = c.parcelasVencidas ?? c.ParcelasVencidas ?? 0;
      const id = c.id ?? c.Id;
      const proc = c.numeroProcesso ?? c.NumeroProcesso;
      return cardEntidade({
        href: detalheUrl(id),
        titulo: c.nomeContato ?? c.NomeContato,
        estado,
        statusHtml: `<span class="badge-sm ${info.cls}">${info.label}</span>`,
        tagsHtml: [
          `<span class="badge-sm badge-muted">${escapeHtml(c.numeroContrato ?? c.NumeroContrato)}</span>`,
          proc ? `<span class="badge-sm badge-proc ent-encolhe" title="Processo ${escapeHtml(proc)}">⚖ ${escapeHtml(proc)}</span>` : '',
        ],
        descricao: c.objeto ?? c.Objeto ?? '',
        numeros: [
          { rotulo: 'Total', valor: brl(c.valorTotal ?? c.ValorTotal) },
          { rotulo: 'A Receber', valor: brl(aReceber), perigo: st === 'Inadimplente' },
          { rotulo: 'Pago', valor: brl(c.valorPago ?? c.ValorPago) },
        ],
        meta: {
          principal: mapForma(c.formaPagamento ?? c.FormaPagamento),
          secundarioHtml: totalParc > 0
            ? `${pagas}/${totalParc} pagas${vencidas > 0 ? ` · <span class="is-danger">${vencidas} vencida(s)</span>` : ''}`
            : '',
          progresso: totalParc > 0 ? (pagas / totalParc * 100) : 0,
        },
        acoesHtml: `<button type="button" class="btn btn-secondary btn-sm" onclick="window._extratoPdf('${escapeHtml(id)}')" title="Baixar extrato em PDF">${ICONES.download} Extrato</button>`,
      });
    }

    function renderPaginacao(total) {
      const el = document.getElementById('paginacao');
      const totalPgs = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (totalPgs <= 1) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <button class="btn btn-secondary btn-sm" ${pageState.page <= 1 ? 'disabled' : ''} id="pgPrev">‹</button>
        <span style="padding:8px 12px;color:var(--color-text-muted);font-size:13px">Página ${pageState.page} de ${totalPgs}</span>
        <button class="btn btn-secondary btn-sm" ${pageState.page >= totalPgs ? 'disabled' : ''} id="pgNext">›</button>
      `;
      document.getElementById('pgPrev')?.addEventListener('click', () => { pageState.page--; carregarLista(); });
      document.getElementById('pgNext')?.addEventListener('click', () => { pageState.page++; carregarLista(); });
    }

    document.getElementById('filtroStatus').addEventListener('change', e => {
      pageState.status = e.target.value === 'Inadimplente' ? 'Inadimplente' : e.target.value;
      pageState.page = 1;
      carregarLista();
    });
    let buscaTimer;
    document.getElementById('filtroBusca').addEventListener('input', e => {
      clearTimeout(buscaTimer);
      const v = e.target.value;
      buscaTimer = setTimeout(() => {
        pageState.busca = v;
        pageState.page = 1;
        carregarLista();
      }, 300);
    });

    document.getElementById('btnConfig').addEventListener('click', () => {
      window.location.href = '/pages/honorarios-config.html';
    });

    window._extratoPdf = async (id) => {
      const mod = await import('/js/honorarios.js');
      await mod.abrirExtratoPdf(id);
    };

    (async () => {
      await renderDashboard();
      await carregarLista();
    })();
  </script>
</body>
</html>
