  <title>Causify — Publicações</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .pub-badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
    .pub-badge-nova { background:#fef3c7; color:#92400e; }
    .pub-badge-lida { background:#f3f4f6; color:#6b7280; }
    .pub-badge-arquivada { background:#e5e7eb; color:#9ca3af; }
    .pub-tipo { display:inline-block; padding:3px 10px; border-radius:4px; font-size:11px; font-weight:600; background:#eff6ff; color:#1d4ed8; }
    .pub-card { border:1px solid var(--color-border); border-radius:var(--radius); background:var(--color-surface); padding:16px; margin-bottom:12px; transition:border-color 0.15s,box-shadow 0.15s; }
    .pub-card:hover { border-color:var(--color-primary); box-shadow:var(--shadow); }
    .pub-card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
    .pub-card-tipo { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .pub-card-meta { font-size:12px; color:var(--color-text-muted); }
    .pub-card-conteudo { font-size:14px; color:var(--color-text); line-height:1.6; max-height:90px; overflow:hidden; position:relative; }
    .pub-card-conteudo.expanded { max-height:none; }
    .pub-card-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .badge-count { background:var(--color-danger); color:#fff; padding:2px 8px; border-radius:10px; font-size:12px; }
    .view-btn { padding:6px 14px; border:1px solid var(--color-border); background:var(--color-surface); border-radius:var(--radius); cursor:pointer; font-size:13px; }
    .view-btn:hover { background:var(--color-bg); }
    .view-btn.active { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
    .pub-card-urgente { border-color:#ef4444 !important; }
    .pub-badge-urgente { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:700; background:#fee2e2; color:#991b1b; }
    .pub-ia-resumo { font-size:13px; color:#6d28d9; background:#f5f3ff; border-radius:4px; padding:8px 12px; margin-bottom:8px; border-left:3px solid #7c3aed; }
  </style>
<script type="text/javascript">window.$crisp=[];window.CRISP_WEBSITE_ID="d8dabf67-657a-4b8c-b6c4-0bc60ab6c04a";(function(){d=document;s=d.createElement("script");s.src="https://client.crisp.chat/l.js";s.async=1;d.getElementsByTagName("head")[0].appendChild(s);})();</script>

<body>
<div class="app-layout">
  <header class="header">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="header-logo"><img src="/images/causify-logo-navbar-clara.png" alt="Causify"></div>
    <div class="header-spacer"></div>
    <div class="header-user">
      <span class="header-user-name"></span>
      <span style="color:var(--color-border)">|</span>
      <span class="header-tenant"></span>
      <button class="btn btn-secondary btn-sm" id="logoutBtn">Sair</button>
    </div>
  </header>

  <nav class="sidebar">
    <ul class="sidebar-nav">
      <li><a href="/pages/dashboard.html">📊 Dashboard</a></li>
      <li><a href="/pages/processos.html">⚖️ Processos</a></li>
      <li><a href="/pages/contatos.html">👥 Contatos</a></li>
      <li><a href="/pages/tarefas.html">✅ Tarefas</a></li>
      <li><a href="/pages/agenda.html">📅 Agenda</a></li>
      <li><a href="/pages/publicacoes.html" class="active">📰 Publicações</a></li>
      <li><a href="/pages/prazos.html">⏰ Prazos</a></li>
      <li><a href="/pages/usuarios.html">🔑 Usuários</a></li>
      <li><a href="/pages/configuracoes.html">⚙️ Configurações</a></li>
    </ul>
  </nav>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Publicações</h1>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span id="countNaoLidas" style="display:none" class="badge-count"></span>
        <button class="btn btn-secondary" id="btnMarcarTodasLidas">Marcar todas como lidas</button>
      </div>
    </div>

    <div class="filter-bar">
      <select id="filtroStatus" class="form-control" style="width:auto">
        <option value="">Todos os status</option>
        <option value="Nova">Novas</option>
        <option value="Lida">Lidas</option>
        <option value="Arquivada">Arquivadas</option>
      </select>
      <select id="filtroTipo" class="form-control" style="width:auto">
        <option value="">Todos os tipos</option>
        <option value="Prazo">Prazo</option>
        <option value="Audiencia">Audiência</option>
        <option value="Decisao">Decisão</option>
        <option value="Despacho">Despacho</option>
        <option value="Intimacao">Intimação</option>
        <option value="Outro">Outro</option>
      </select>
      <select id="filtroFonte" class="form-control" style="width:auto">
        <option value="">Todas as fontes</option>
        <option value="Escavador">📡 Escavador</option>
        <option value="DJe">📰 DJe</option>
        <option value="Manual">✍️ Manual</option>
      </select>
      <input type="date" id="filtroDe" class="form-control" style="width:auto" placeholder="De">
      <input type="date" id="filtroAte" class="form-control" style="width:auto" placeholder="Até">
      <button class="btn btn-primary" id="btnFiltrar">Filtrar</button>
    </div>

    <div id="listaPubs"></div>
    <div id="semPubs" style="display:none;color:var(--color-text-muted);padding:32px;text-align:center">
      Nenhuma publicação encontrada.
    </div>
  </main>
</div>
<script type="module" src="/js/publicacoes.js"></script>
</body>
</html>
