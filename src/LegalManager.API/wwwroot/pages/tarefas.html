<html lang="pt-BR">
<head>

  <title>Causify — Tarefas</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Lista */
    .badge.prioridade-baixa   { background:#f0fdf4; color:#16a34a; }
    .badge.prioridade-media   { background:#fefce8; color:#ca8a04; }
    .badge.prioridade-alta    { background:#fff7ed; color:#ea580c; }
    .badge.prioridade-urgente { background:#fef2f2; color:#dc2626; }
    .status-pendente    { background:#f3f4f6; color:#374151; }
    .status-emandamento { background:#dbeafe; color:#1d4ed8; }
    .status-concluida   { background:#d1fae5; color:#057a55; }
    .status-cancelada   { background:#fee2e2; color:#e02424; }
    .badge-atrasada { background:#fef2f2; color:#dc2626; font-size:11px; padding:2px 6px; border-radius:4px; }
    .tarefa-card { border:1px solid var(--color-border); border-radius:var(--radius); padding:14px 16px; background:var(--color-surface); display:flex; flex-direction:column; gap:8px; }
    .tarefa-card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap; }
    .tarefa-card-titulo { font-weight:600; font-size:15px; }
    .tarefa-card-meta { display:flex; flex-wrap:wrap; gap:8px; font-size:13px; color:var(--color-text-muted); }
    .processo-link { color:var(--color-primary); text-decoration:none; font-weight:500; }
    .processo-link:hover { text-decoration:underline; }
    .tarefa-card-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .tags-list { display:flex; flex-wrap:wrap; gap:4px; }
    .tag { background:#e5e7eb; color:#374151; font-size:11px; padding:2px 8px; border-radius:999px; }
    /* Kanban */
    .kanban-board { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; align-items:start; }
    .kanban-col { background:#f9fafb; border:1px solid var(--color-border); border-radius:var(--radius); padding:12px; min-height:300px; }
    .kanban-col-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .kanban-col-title { font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; }
    .kanban-col-count { background:#e5e7eb; color:#374151; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
    .kanban-items { display:flex; flex-direction:column; gap:8px; min-height:100px; }
    .kanban-card { background:#fff; border:1px solid var(--color-border); border-radius:var(--radius); padding:12px; cursor:grab; user-select:none; transition:box-shadow .15s; }
    .kanban-card:hover { box-shadow:0 4px 12px rgba(0,0,0,.1); }
    .kanban-card.dragging { opacity:.5; cursor:grabbing; }
    .kanban-col.drag-over { background:#eff6ff; border-color:#60a5fa; }
    .kanban-card-title { font-weight:600; font-size:13px; margin-bottom:6px; cursor:pointer; }
    .kanban-card-title:hover { color:var(--color-primary); }
    .kanban-card-meta { font-size:11px; color:var(--color-text-muted); display:flex; flex-wrap:wrap; gap:6px; }
    .kanban-card.prioridade-urgente { border-left:3px solid #dc2626; }
    .kanban-card.prioridade-alta    { border-left:3px solid #ea580c; }
    .kanban-card.prioridade-media   { border-left:3px solid #ca8a04; }
    .kanban-card.prioridade-baixa   { border-left:3px solid #16a34a; }
    /* Detail modal */
    .detail-modal { max-width:500px; }
    .detail-row { display:flex; gap:8px; margin-bottom:8px; font-size:14px; }
    .detail-label { font-weight:600; color:var(--color-text-muted); min-width:90px; }
    .detail-value { flex:1; }
    .detail-description { margin-top:12px; padding:12px; background:#f9fafb; border-radius:var(--radius); font-size:13px; line-height:1.5; white-space:pre-wrap; }
    .detail-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  </style>

<body>
<div class="app-layout">
  <header class="header">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="header-logo">⚖️ Causify</div>
    <div class="header-spacer"></div>
    <div class="header-user">
      <span class="header-user-name"></span>
      <span style="color:var(--color-border)">|</span>
      <span class="header-tenant"></span>
      <button class="btn btn-secondary btn-sm" id="logoutBtn">Sair</button>
    </div>
  </header>

  <nav class="sidebar"><ul class="sidebar-nav"></ul></nav>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Tarefas</h1>
      <button class="btn btn-primary" id="btnNova">+ Nova Tarefa</button>
    </div>

    <div class="tab-nav">
      <button class="tab-btn active" data-tab="tarefas">✅ Tarefas/Prazos</button>
      <button class="tab-btn" data-tab="kanban" id="tabBtnKanban">
        🗂 Kanban
        <span id="kanbanProBadge" style="display:none;background:#f59e0b;color:#0f172a;font-size:10px;font-weight:600;padding:1px 6px;border-radius:100px;letter-spacing:.04em;margin-left:4px;vertical-align:middle">PRO</span>
      </button>
    </div>

    <!-- Tab: Tarefas (lista) -->
    <div class="tab-content active" id="tab-tarefas">
      <div class="filter-bar">
        <input type="search" id="filtBusca" class="form-control" placeholder="Buscar tarefas...">
        <select id="filtStatus" class="form-control" style="width:auto">
          <option value="">Todos os status</option>
          <option value="Pendente">Pendente</option>
          <option value="EmAndamento">Em Andamento</option>
          <option value="Concluida">Concluída</option>
          <option value="Cancelada">Cancelada</option>
        </select>
        <select id="filtPrioridade" class="form-control" style="width:auto">
          <option value="">Todas as prioridades</option>
          <option value="Baixa">Baixa</option>
          <option value="Media">Média</option>
          <option value="Alta">Alta</option>
          <option value="Urgente">Urgente</option>
        </select>
        <select id="filtTipo" class="form-control" style="width:auto">
          <option value="">Todos os tipos</option>
          <option value="Tarefa">Tarefas</option>
          <option value="Prazo">Prazos</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="filtAtrasada"> Apenas atrasadas
        </label>
      </div>
      <div id="tarefasList" style="display:flex;flex-direction:column;gap:10px"></div>
      <div id="pagination" class="pagination" style="margin-top:16px"></div>
    </div>

    <!-- Tab: Kanban (Pro) -->
    <div class="tab-content" id="tab-kanban">
      <div class="filter-bar">
        <input type="search" id="filtBuscaKanban" class="form-control" placeholder="Buscar tarefas...">
        <select id="filtPrioridadeKanban" class="form-control" style="width:auto">
          <option value="">Todas as prioridades</option>
          <option value="Baixa">Baixa</option>
          <option value="Media">Média</option>
          <option value="Alta">Alta</option>
          <option value="Urgente">Urgente</option>
        </select>
        <select id="filtTipoKanban" class="form-control" style="width:auto">
          <option value="">Todos os tipos</option>
          <option value="Tarefa">Tarefas</option>
          <option value="Prazo">Prazos</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="filtAtrasadaKanban"> Apenas atrasadas
        </label>
      </div>
      <div class="kanban-board" id="board">
        <div class="kanban-col" data-status="Pendente">
          <div class="kanban-col-header">
            <span class="kanban-col-title" style="color:#374151">⏳ Pendente</span>
            <span class="kanban-col-count" id="count-Pendente">0</span>
          </div>
          <div class="kanban-items" id="col-Pendente"></div>
        </div>
        <div class="kanban-col" data-status="EmAndamento">
          <div class="kanban-col-header">
            <span class="kanban-col-title" style="color:#1d4ed8">🔄 Em Andamento</span>
            <span class="kanban-col-count" id="count-EmAndamento">0</span>
          </div>
          <div class="kanban-items" id="col-EmAndamento"></div>
        </div>
        <div class="kanban-col" data-status="Concluida">
          <div class="kanban-col-header">
            <span class="kanban-col-title" style="color:#057a55">✅ Concluída</span>
            <span class="kanban-col-count" id="count-Concluida">0</span>
          </div>
          <div class="kanban-items" id="col-Concluida"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal Nova/Editar Tarefa -->
<div class="modal-overlay" id="modalTarefa" style="display:none">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTarefaTitulo">Nova Tarefa</h2>
      <button class="modal-close" id="modalTarefaClose">&times;</button>
    </div>
    <form id="formTarefa" novalidate>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Título *</label>
          <input type="text" id="fTitulo" class="form-control" maxlength="300" required>
        </div>
        <div class="form-group">
          <label class="form-label">Descrição</label>
          <textarea id="fDescricao" class="form-control" rows="3" maxlength="4000"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group">
            <label class="form-label">Prioridade *</label>
            <select id="fPrioridade" class="form-control" required>
              <option value="Baixa">Baixa</option>
              <option value="Media" selected>Média</option>
              <option value="Alta">Alta</option>
              <option value="Urgente">Urgente</option>
            </select>
          </div>
          <div class="form-group" id="fStatusGroup" style="display:none">
            <label class="form-label">Status *</label>
            <select id="fStatus" class="form-control">
              <option value="Pendente">Pendente</option>
              <option value="EmAndamento">Em Andamento</option>
              <option value="Concluida">Concluída</option>
              <option value="Cancelada">Cancelada</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Prazo</label>
          <input type="datetime-local" id="fPrazo" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Processo vinculado</label>
          <div style="display:flex;gap:8px;align-items:center">
            <select id="fProcesso" class="form-control" style="flex:1">
              <option value="">Nenhum processo vinculado</option>
            </select>
            <button type="button" id="fProcessoLink"
               class="btn btn-secondary btn-sm"
               style="display:none;white-space:nowrap">⚖️ Abrir processo</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Tags (separadas por vírgula)</label>
          <input type="text" id="fTags" class="form-control" placeholder="ex: urgente, revisão, cliente-x">
        </div>
        <div id="fmsgErro" class="alert alert-error" style="display:none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="btnCancelarTarefa">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnSalvarTarefa">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Detalhes da Tarefa (Kanban) -->
<div class="modal-overlay" id="modalDetalhe" style="display:none">
  <div class="modal detail-modal">
    <div class="modal-header">
      <h2 class="modal-title">Detalhes da Tarefa</h2>
      <button class="modal-close" id="modalDetalheClose">&times;</button>
    </div>
    <div class="modal-body" id="modalDetalheBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modalDetalheFechar">Fechar</button>
    </div>
  </div>
</div>

<script type="module">
import { initLayout, isPlanoFree, showUpgradeToast } from '/js/layout.js';
import { apiFetch } from '/js/api.js';

initLayout();

const free = isPlanoFree();
if (free) document.getElementById('kanbanProBadge').style.display = '';

// ── Tab switching ──────────────────────────────────────────────
let currentTab = 'tarefas';
let kanbanLoaded = false;

function switchTab(name) {
  if (name === 'kanban' && free) { showUpgradeToast(); return; }
  currentTab = name;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(el => el.classList.toggle('active', el.id === `tab-${name}`));
  history.replaceState(null, '', name === 'tarefas' ? window.location.pathname : `?tab=${name}`);
  if (name === 'kanban' && !kanbanLoaded) { loadBoard(); kanbanLoaded = true; }
}

document.querySelectorAll('.tab-btn').forEach(btn =>
  btn.addEventListener('click', () => switchTab(btn.dataset.tab))
);

const initTab = new URLSearchParams(location.search).get('tab') || 'tarefas';
switchTab(initTab);

// ── Shared helpers ─────────────────────────────────────────────
const PRIORIDADE_LABEL = { Baixa: 'Baixa', Media: 'Média', Alta: 'Alta', Urgente: 'Urgente' };
const STATUS_LABEL = { Pendente: 'Pendente', EmAndamento: 'Em Andamento', Concluida: 'Concluída', Cancelada: 'Cancelada' };

function esc(str) {
  return (str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showErr(el, msg) { el.textContent = msg; el.style.display = ''; }

// ── Lista: state ───────────────────────────────────────────────
let currentPage = 1;
let editingId = null;
let allListItems = [];
let processosCached = null;

function getFilters() {
  return {
    busca: document.getElementById('filtBusca').value.trim(),
    status: document.getElementById('filtStatus').value,
    prioridade: document.getElementById('filtPrioridade').value,
    tipo: document.getElementById('filtTipo').value,
    atrasada: document.getElementById('filtAtrasada').checked ? 'true' : '',
  };
}

async function loadTarefas(page = 1) {
  currentPage = page;
  const f = getFilters();
  const params = new URLSearchParams({ page, pageSize: 50 });
  if (f.busca) params.set('busca', f.busca);
  if (f.status) params.set('status', f.status);
  if (f.prioridade) params.set('prioridade', f.prioridade);
  if (f.tipo) params.set('tipo', f.tipo);
  if (f.atrasada) params.set('atrasada', 'true');

  try {
    const data = await apiFetch(`/tarefas?${params}`);
    allListItems = data.items ?? [];
    renderLista(allListItems, data);
  } catch (e) { console.error(e); }
}

function renderLista(items, data) {
  const container = document.getElementById('tarefasList');
  if (!items.length) {
    container.innerHTML = '<p style="color:var(--color-text-muted);padding:16px">Nenhuma tarefa encontrada.</p>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  container.innerHTML = items.map(t => tarefaCard(t)).join('');
  renderPagination(data);
  bindListActions();
}

function tarefaCard(t) {
  const prioClass = `prioridade-${t.prioridade.toLowerCase()}`;
  const statusClass = `status-${t.status.toLowerCase()}`;
  const prazoStr = t.prazo ? new Date(t.prazo).toLocaleString('pt-BR') : '–';
  const atrasadaBadge = t.atrasada ? '<span class="badge-atrasada">Atrasada</span>' : '';
  const tags = t.tags?.map(tag => `<span class="tag">${esc(tag)}</span>`).join('') ?? '';

  return `
  <div class="tarefa-card" data-id="${t.id}">
    <div class="tarefa-card-header">
      <div>
        <span class="tarefa-card-titulo">${esc(t.titulo)}</span>
        ${atrasadaBadge}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${t.tipo === 'Prazo' ? '<span class="badge" style="background:#ede9fe;color:#6d28d9">⏰ Prazo</span>' : ''}
        <span class="badge ${prioClass}">${PRIORIDADE_LABEL[t.prioridade]}</span>
        <span class="badge ${statusClass}">${STATUS_LABEL[t.status]}</span>
      </div>
    </div>
    <div class="tarefa-card-meta">
      <span>📅 Prazo: ${prazoStr}</span>
      ${t.nomeResponsavel ? `<span>👤 ${esc(t.nomeResponsavel)}</span>` : ''}
      ${t.numeroCNJProcesso && t.processoId ? `<span>⚖️ <a href="/pages/processo-detalhe.html?id=${t.processoId}" class="processo-link" onclick="event.stopPropagation()">${esc(t.numeroCNJProcesso)}</a></span>` : t.numeroCNJProcesso ? `<span>⚖️ ${esc(t.numeroCNJProcesso)}</span>` : ''}
    </div>
    ${tags ? `<div class="tags-list">${tags}</div>` : ''}
    <div class="tarefa-card-actions">
      ${t.status !== 'Concluida' && t.status !== 'Cancelada' ?
        `<button class="btn btn-secondary btn-sm" data-action="concluir" data-id="${t.id}">✓ Concluir</button>` : ''}
      <button class="btn btn-secondary btn-sm" data-action="edit" data-id="${t.id}">Editar</button>
      <button class="btn btn-danger btn-sm" data-action="delete" data-id="${t.id}">Excluir</button>
    </div>
  </div>`;
}

function renderPagination(data) {
  const pag = document.getElementById('pagination');
  if (!data || data.totalPages <= 1) { pag.innerHTML = ''; return; }
  const pages = [];
  for (let i = 1; i <= data.totalPages; i++) {
    pages.push(`<button class="pagination-btn${i === currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`);
  }
  pag.innerHTML = pages.join('');
  pag.querySelectorAll('[data-page]').forEach(btn =>
    btn.addEventListener('click', () => loadTarefas(+btn.dataset.page)));
}

function bindListActions() {
  document.querySelectorAll('#tab-tarefas [data-action]').forEach(btn => {
    btn.addEventListener('click', async e => {
      const id = e.currentTarget.dataset.id;
      const action = e.currentTarget.dataset.action;
      if (action === 'edit') await openEditModal(id);
      else if (action === 'concluir') await concluir(id);
      else if (action === 'delete') await deleteTarefa(id);
    });
  });
}

async function concluir(id) {
  if (!confirm('Marcar tarefa como concluída?')) return;
  await apiFetch(`/tarefas/${id}/concluir`, { method: 'POST' });
  await loadTarefas(currentPage);
}

async function deleteTarefa(id) {
  if (!confirm('Excluir esta tarefa?')) return;
  await apiFetch(`/tarefas/${id}`, { method: 'DELETE' });
  await loadTarefas(currentPage);
}

// ── Processos helpers ──────────────────────────────────────────
async function loadProcessosSelect(selectedId = null) {
  const sel = document.getElementById('fProcesso');
  sel.innerHTML = '<option value="">Nenhum processo vinculado</option>';
  try {
    if (!processosCached) {
      const data = await apiFetch('/processos?pageSize=200');
      processosCached = data.items ?? [];
    }
    processosCached.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.numeroCNJ + (p.comarca ? ` — ${p.comarca}` : '');
      sel.appendChild(opt);
    });
  } catch {}
  sel.value = selectedId ?? '';
  updateProcessoLink();
}

function updateProcessoLink() {
  const btn = document.getElementById('fProcessoLink');
  btn.style.display = document.getElementById('fProcesso').value ? '' : 'none';
}

// ── Modal create/edit ──────────────────────────────────────────
function openCreateModal() {
  editingId = null;
  document.getElementById('modalTarefaTitulo').textContent = 'Nova Tarefa';
  document.getElementById('formTarefa').reset();
  document.getElementById('fStatusGroup').style.display = 'none';
  document.getElementById('fmsgErro').style.display = 'none';
  loadProcessosSelect(null);
  document.getElementById('modalTarefa').style.display = 'flex';
}

async function openEditModal(id) {
  editingId = id;
  document.getElementById('modalTarefaTitulo').textContent = 'Editar Tarefa';
  document.getElementById('fmsgErro').style.display = 'none';
  document.getElementById('fStatusGroup').style.display = '';
  const t = await apiFetch(`/tarefas/${id}`);
  document.getElementById('fTitulo').value = t.titulo;
  document.getElementById('fDescricao').value = t.descricao ?? '';
  document.getElementById('fPrioridade').value = t.prioridade;
  document.getElementById('fStatus').value = t.status;
  document.getElementById('fPrazo').value = t.prazo ? t.prazo.substring(0, 16) : '';
  document.getElementById('fTags').value = (t.tags ?? []).join(', ');
  await loadProcessosSelect(t.processoId ?? null);
  document.getElementById('modalTarefa').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modalTarefa').style.display = 'none';
}

document.getElementById('fProcesso').addEventListener('change', updateProcessoLink);
document.getElementById('fProcessoLink').addEventListener('click', () => {
  const id = document.getElementById('fProcesso').value;
  if (id) window.location.href = `/pages/processo-detalhe.html?id=${id}`;
});
document.getElementById('btnNova').addEventListener('click', openCreateModal);
document.getElementById('modalTarefaClose').addEventListener('click', closeModal);
document.getElementById('btnCancelarTarefa').addEventListener('click', closeModal);
document.getElementById('modalTarefa').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.getElementById('formTarefa').addEventListener('submit', async e => {
  e.preventDefault();
  const errEl = document.getElementById('fmsgErro');
  errEl.style.display = 'none';
  const titulo = document.getElementById('fTitulo').value.trim();
  if (!titulo) { showErr(errEl, 'Título é obrigatório.'); return; }
  const tagsRaw = document.getElementById('fTags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
  const prazoVal = document.getElementById('fPrazo').value;
  const processoVal = document.getElementById('fProcesso').value || null;

  try {
    if (editingId) {
      await apiFetch(`/tarefas/${editingId}`, { method: 'PUT', body: JSON.stringify({
        titulo,
        descricao: document.getElementById('fDescricao').value.trim() || null,
        prioridade: document.getElementById('fPrioridade').value,
        status: document.getElementById('fStatus').value,
        prazo: prazoVal || null,
        processoId: processoVal,
        tags
      })});
    } else {
      await apiFetch('/tarefas', { method: 'POST', body: JSON.stringify({
        titulo,
        descricao: document.getElementById('fDescricao').value.trim() || null,
        prioridade: document.getElementById('fPrioridade').value,
        prazo: prazoVal || null,
        processoId: processoVal,
        tags
      })});
    }
    closeModal();
    if (currentTab === 'kanban') { allKanbanTasks = []; await loadBoard(); }
    else await loadTarefas(currentPage);
  } catch (err) {
    showErr(errEl, err.message ?? 'Erro ao salvar tarefa.');
  }
});

// ── Filters ────────────────────────────────────────────────────
let debounceTimer;
document.getElementById('filtBusca').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => loadTarefas(1), 400);
});
['filtStatus', 'filtPrioridade', 'filtTipo', 'filtAtrasada'].forEach(id =>
  document.getElementById(id).addEventListener('change', () => loadTarefas(1))
);

// ── Kanban filters ─────────────────────────────────────────────
function getKanbanFilters() {
  return {
    busca: document.getElementById('filtBuscaKanban').value.trim(),
    prioridade: document.getElementById('filtPrioridadeKanban').value,
    tipo: document.getElementById('filtTipoKanban').value,
    atrasada: document.getElementById('filtAtrasadaKanban').checked,
  };
}

let debounceKanban;
document.getElementById('filtBuscaKanban').addEventListener('input', () => {
  clearTimeout(debounceKanban);
  debounceKanban = setTimeout(() => renderBoard(), 400);
});
['filtPrioridadeKanban', 'filtTipoKanban'].forEach(id =>
  document.getElementById(id).addEventListener('change', () => renderBoard())
);
document.getElementById('filtAtrasadaKanban').addEventListener('change', () => renderBoard());

// ── Kanban ─────────────────────────────────────────────────────
const KANBAN_STATUSES = ['Pendente', 'EmAndamento', 'Concluida'];
let allKanbanTasks = [];
let draggedId = null;
let draggedStatus = null;

async function loadBoard() {
  try {
    const [p, ea, c] = await Promise.all([
      apiFetch('/tarefas?status=Pendente&pageSize=100'),
      apiFetch('/tarefas?status=EmAndamento&pageSize=100'),
      apiFetch('/tarefas?status=Concluida&pageSize=100')
    ]);
    allKanbanTasks = [
      ...(p.items ?? []).map(t => ({...t, status: 'Pendente'})),
      ...(ea.items ?? []).map(t => ({...t, status: 'EmAndamento'})),
      ...(c.items ?? []).map(t => ({...t, status: 'Concluida'}))
    ];
    renderBoard();
  } catch (e) { console.error(e); }
}

function renderBoard() {
  const f = getKanbanFilters();
  for (const s of KANBAN_STATUSES) {
    const tasks = allKanbanTasks.filter(t => {
      if (t.status !== s) return false;
      if (f.busca && !t.titulo.toLowerCase().includes(f.busca.toLowerCase())) return false;
      if (f.prioridade && t.prioridade !== f.prioridade) return false;
      if (f.tipo && t.tipo !== f.tipo) return false;
      if (f.atrasada && !t.atrasada) return false;
      return true;
    });
    const col = document.getElementById(`col-${s}`);
    document.getElementById(`count-${s}`).textContent = tasks.length;
    col.innerHTML = tasks.length
      ? tasks.map(renderKanbanCard).join('')
      : '<div style="color:#9ca3af;font-size:13px;text-align:center;padding:20px 0">Vazio</div>';

    col.querySelectorAll('.kanban-card').forEach(card => {
      card.addEventListener('dragstart', onDragStart);
      card.addEventListener('dragend', onDragEnd);
    });
  }
  document.querySelectorAll('.kanban-col').forEach(col => {
    col.addEventListener('dragover', onDragOver);
    col.addEventListener('dragleave', onDragLeave);
    col.addEventListener('drop', onDrop);
  });
}

function renderKanbanCard(t) {
  const prazo = t.prazo ? (() => { const d = new Date(t.prazo); return !isNaN(d) ? d.toLocaleDateString('pt-BR') : null; })() : null;
  const atrasada = t.atrasada ? '<span class="badge-atrasada">Atrasada</span>' : '';
  return `<div class="kanban-card prioridade-${(t.prioridade ?? '').toLowerCase()}" draggable="true" data-id="${t.id}" data-status="${t.status}">
    <div class="kanban-card-title" data-detail-id="${t.id}">${esc(t.titulo)}</div>
    <div class="kanban-card-meta">
      <span style="background:#e5e7eb;padding:1px 6px;border-radius:3px">${PRIORIDADE_LABEL[t.prioridade] ?? t.prioridade}</span>
      ${prazo ? `<span>📅 ${prazo}</span>` : ''}
      ${t.nomeResponsavel ? `<span>👤 ${esc(t.nomeResponsavel)}</span>` : ''}
      ${atrasada}
    </div>
  </div>`;
}

function onDragStart(e) {
  draggedId = e.currentTarget.dataset.id;
  draggedStatus = e.currentTarget.dataset.status;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const col = e.currentTarget.closest('.kanban-col');
  if (col) col.classList.add('drag-over');
}

function onDragLeave(e) {
  const col = e.currentTarget.closest('.kanban-col');
  if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over');
}

async function onDrop(e) {
  e.preventDefault();
  const col = e.currentTarget.closest('.kanban-col');
  if (!col) return;
  col.classList.remove('drag-over');
  const newStatus = col.dataset.status;
  if (!draggedId || newStatus === draggedStatus) return;

  const task = allKanbanTasks.find(t => t.id === draggedId);
  if (task) { task.status = newStatus; renderBoard(); }

  try {
    await apiFetch(`/tarefas/${draggedId}/mover`, { method: 'PATCH', body: JSON.stringify({ status: newStatus }) });
  } catch (err) {
    if (task) { task.status = draggedStatus; renderBoard(); }
    alert('Erro ao mover: ' + err.message);
  }
}

document.addEventListener('click', async e => {
  const titleEl = e.target.closest('[data-detail-id]');
  if (titleEl) {
    e.stopPropagation();
    const id = titleEl.dataset.detailId;
    try {
      const t = await apiFetch(`/tarefas/${id}`);
      showDetailModal(t);
    } catch (err) {
      alert('Erro ao carregar detalhes: ' + err.message);
    }
  }
});

function showDetailModal(t) {
  const prazo = t.prazo ? new Date(t.prazo).toLocaleString('pt-BR') : '–';
  const tags = t.tags?.length ? t.tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join('') : '';
  const descricao = t.descricao
    ? `<div class="detail-description">${esc(t.descricao)}</div>`
    : '<div class="detail-description" style="color:var(--color-text-muted)">Sem descrição</div>';
  document.getElementById('modalDetalheBody').innerHTML = `
    <div class="detail-row"><span class="detail-label">Título</span><span class="detail-value">${esc(t.titulo)}</span></div>
    <div class="detail-row"><span class="detail-label">Prioridade</span><span class="detail-value">${PRIORIDADE_LABEL[t.prioridade] ?? t.prioridade}</span></div>
    <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${STATUS_LABEL[t.status] ?? t.status}</span></div>
    <div class="detail-row"><span class="detail-label">Prazo</span><span class="detail-value">${prazo}</span></div>
    <div class="detail-row"><span class="detail-label">Responsável</span><span class="detail-value">${t.nomeResponsavel ? esc(t.nomeResponsavel) : '–'}</span></div>
    <div class="detail-row"><span class="detail-label">Tags</span><span class="detail-value">${tags || '–'}</span></div>
    <div style="margin-top:12px"><span class="detail-label">Descrição</span>${descricao}</div>
  `;
  document.getElementById('modalDetalhe').style.display = 'flex';
}

document.getElementById('modalDetalheClose').addEventListener('click', () => {
  document.getElementById('modalDetalhe').style.display = 'none';
});
document.getElementById('modalDetalheFechar').addEventListener('click', () => {
  document.getElementById('modalDetalhe').style.display = 'none';
});
document.getElementById('modalDetalhe').addEventListener('click', e => {
  if (e.target === e.currentTarget) document.getElementById('modalDetalhe').style.display = 'none';
});

// ── Init ───────────────────────────────────────────────────────
const _urlParams = new URLSearchParams(location.search);
const _initTipo = _urlParams.get('tipo');
if (_initTipo) document.getElementById('filtTipo').value = _initTipo;
loadTarefas();
const _abrirId = _urlParams.get('abrirId');
if (_abrirId) openEditModal(_abrirId);
</script>
