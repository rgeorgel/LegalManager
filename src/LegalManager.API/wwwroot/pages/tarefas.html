  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Tarefas</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Lista */
    .badge.prioridade-baixa   { background:#f0fdf4; color:#16a34a; }
    .badge.prioridade-media   { background:#fefce8; color:#ca8a04; }
    .badge.prioridade-alta    { background:#fff7ed; color:#ea580c; }
    .badge.prioridade-urgente { background:#fef2f2; color:#dc2626; }
    .status-pendente    { background:#f3f4f6; color:#374151; }
    .status-emandamento { background:#dbeafe; color:#1d4ed8; }
    .status-concluida   { background:#d1fae5; color:#057a55; }
    .status-cancelada   { background:#fee2e2; color:#e02424; }
    .badge-atrasada { background:#fef2f2; color:#dc2626; font-size:11px; padding:2px 6px; border-radius:4px; }
    .tarefa-card { border:1px solid var(--color-border); border-radius:var(--radius); padding:14px 16px; background:var(--color-surface); display:flex; flex-direction:column; gap:8px; }
    .tarefa-card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap; }
    .tarefa-card-titulo { font-weight:600; font-size:15px; cursor:pointer; }
    .tarefa-card-titulo:hover { color:var(--color-primary); }
    .tarefa-card-meta { display:flex; flex-wrap:wrap; gap:8px; font-size:13px; color:var(--color-text-muted); }
    .processo-link { color:var(--color-primary); text-decoration:none; font-weight:500; }
    .processo-link:hover { text-decoration:underline; }
    .tarefa-card-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .tags-list { display:flex; flex-wrap:wrap; gap:4px; }
    .tag { background:#e5e7eb; color:#374151; font-size:11px; padding:2px 8px; border-radius:999px; }
    /* View toggle (lista/blocos) — mesmo padrão visual das telas de Contatos/Processos */
    .view-toggle { display:flex; gap:4px; align-items:center; }
    .view-btn { width:36px; height:36px; border:1px solid var(--color-border); border-radius:var(--radius); background:#f3f4f6; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; transition:.2s; }
    .view-btn:hover { background:#e5e7eb; }
    .view-btn.active { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
    .tarefas-list { display:flex; flex-direction:column; gap:10px; }
    .tarefas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
    @media(max-width:768px) { .tarefas-grid { grid-template-columns:1fr; } }
    /* Kanban */
    .kanban-board { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; align-items:start; }
    .kanban-col { background:var(--color-bg); border:1px solid var(--color-border); border-radius:var(--radius); padding:12px; min-height:300px; }
    .kanban-col-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .kanban-col-title { font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; background:transparent; }
    /* Prefixo "kanban-" evita colidir com .status-pendente/.status-concluida
       (badges da aba Lista, linhas acima) — como essas classes também têm
       background, o título do Kanban herdava o fundo claro do badge e
       ficava ilegível nos temas escuros. */
    .kanban-col-title.kanban-status-pendente   { color: var(--kanban-pendente, #374151); }
    .kanban-col-title.kanban-status-andamento  { color: var(--kanban-andamento, #1d4ed8); }
    .kanban-col-title.kanban-status-concluida  { color: var(--kanban-concluida, #057a55); }
    /* Ícones SVG com stroke="currentColor" (em vez de emoji colorido) para
       herdar a cor do tema em qualquer preset — emojis como ✅/⏳ trazem
       arte colorida fixa (ex: fundo esverdeado) que fica ilegível em temas
       escuros. */
    .kanban-col-icon { vertical-align: -2px; margin-right: 2px; }
    .kanban-col-count { background:var(--color-border); color:var(--color-text-muted); font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
    .kanban-col-footer { margin-top:12px; padding-top:10px; border-top:1px dashed var(--color-border); font-size:12px; color:var(--color-text-muted); display:flex; flex-direction:column; gap:4px; }
    .kanban-periodo { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .kanban-periodo select { width:auto; padding:2px 6px; font-size:12px; height:auto; }
    .kanban-ver-todas { background:none; border:0; padding:0; color:var(--color-primary); font:inherit; font-weight:600; cursor:pointer; text-align:left; }
    .kanban-ver-todas:hover { text-decoration:underline; }
    .kanban-items { display:flex; flex-direction:column; gap:8px; min-height:100px; }
    .kanban-card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius); padding:12px; cursor:grab; user-select:none; transition:box-shadow .15s; }
    .kanban-card:hover { box-shadow:0 4px 12px rgba(0,0,0,.1); }
    .kanban-card.dragging { opacity:.5; cursor:grabbing; }
    .kanban-col.drag-over { background:var(--color-primary-light); border-color:var(--color-primary); }
    .kanban-card-title { font-weight:600; font-size:13px; margin-bottom:6px; cursor:pointer; }
    .kanban-card-title:hover { color:var(--color-primary); }
    .kanban-card-meta { font-size:11px; color:var(--color-text-muted); display:flex; flex-wrap:wrap; gap:6px; }
    .kanban-card.prioridade-urgente { border-left:3px solid #dc2626; }
    .kanban-card.prioridade-alta    { border-left:3px solid #ea580c; }
    .kanban-card.prioridade-media   { border-left:3px solid #ca8a04; }
    .kanban-card.prioridade-baixa   { border-left:3px solid #16a34a; }
    /* Repetição */
    .badge-recorrente { background:var(--color-primary-light); color:var(--color-primary); }
  </style>

<div class="app-layout">
  <header class="header">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="header-logo"><img src="/images/causify-logo-navbar-clara.png" alt="Causify"></div>
    <div class="header-spacer"></div>
    <div class="header-user">
      <span class="header-user-name"></span>
      <span style="color:var(--color-border)">|</span>
      <span class="header-tenant"></span>
      <button class="btn btn-secondary btn-sm" id="logoutBtn">Sair</button>
    </div>
  </header>

  <nav class="sidebar"><ul class="sidebar-nav"></ul></nav>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Tarefas</h1>
      <button class="btn btn-primary" id="btnNova">+ Nova Tarefa</button>
    </div>

    <div class="tab-nav">
      <button class="tab-btn active" data-tab="tarefas">✅ Tarefas/Prazos</button>
      <button class="tab-btn" data-tab="kanban" id="tabBtnKanban">
        🗂 Kanban
        <span id="kanbanProBadge" style="display:none;background:#f59e0b;color:#0f172a;font-size:10px;font-weight:600;padding:1px 6px;border-radius:100px;letter-spacing:.04em;margin-left:4px;vertical-align:middle">PLUS</span>
      </button>
    </div>

    <!-- Tab: Tarefas (lista) -->
    <div class="tab-content active" id="tab-tarefas">
      <div class="filter-bar" data-tour="tarefas-filtros">
        <input type="search" id="filtBusca" class="form-control" placeholder="Buscar tarefas...">
        <div id="filtStatus" style="flex:0 1 200px"></div>
        <div id="filtPrioridade" style="flex:0 1 200px"></div>
        <div id="filtTipo" style="flex:0 1 170px"></div>
        <select id="filtDiasEncerradas" class="form-control" style="flex:0 1 auto;width:auto" title="Concluídas e canceladas exibidas; pendentes e em andamento aparecem sempre">
          <option value="3">Concluídas/canceladas: últimos 3 dias</option>
          <option value="7">Concluídas/canceladas: últimos 7 dias</option>
          <option value="15">Concluídas/canceladas: últimos 15 dias</option>
          <option value="30">Concluídas/canceladas: últimos 30 dias</option>
          <option value="">Concluídas/canceladas: todas</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="filtAtrasada"> Apenas atrasadas
        </label>
        <div class="view-toggle">
          <button type="button" class="view-btn" id="viewList" title="Visualização em lista">☰</button>
          <button type="button" class="view-btn" id="viewBlocos" title="Visualização em blocos">⊞</button>
        </div>
      </div>
      <div id="tarefasList"></div>
      <div id="pagination" class="pagination" style="margin-top:16px"></div>
    </div>

    <!-- Tab: Kanban (Pro) -->
    <div class="tab-content" id="tab-kanban">
      <div class="filter-bar">
        <input type="search" id="filtBuscaKanban" class="form-control" placeholder="Buscar tarefas...">
        <div id="filtPrioridadeKanban" style="flex:0 1 200px"></div>
        <div id="filtTipoKanban" style="flex:0 1 170px"></div>
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="filtAtrasadaKanban"> Apenas atrasadas
        </label>
      </div>
      <div class="kanban-board" id="board">
        <div class="kanban-col" data-status="Pendente">
          <div class="kanban-col-header">
            <span class="kanban-col-title kanban-status-pendente"><svg class="kanban-col-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Pendente</span>
            <span class="kanban-col-count" id="count-Pendente">0</span>
          </div>
          <div class="kanban-items" id="col-Pendente"></div>
        </div>
        <div class="kanban-col" data-status="EmAndamento">
          <div class="kanban-col-header">
            <span class="kanban-col-title kanban-status-andamento"><svg class="kanban-col-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13 2.5V6h-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Em Andamento</span>
            <span class="kanban-col-count" id="count-EmAndamento">0</span>
          </div>
          <div class="kanban-items" id="col-EmAndamento"></div>
        </div>
        <div class="kanban-col" data-status="Concluida">
          <div class="kanban-col-header">
            <span class="kanban-col-title kanban-status-concluida"><svg class="kanban-col-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.5"/><path d="M5.2 8.3l1.9 1.9 3.7-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Concluída</span>
            <span class="kanban-col-count" id="count-Concluida">0</span>
          </div>
          <div class="kanban-items" id="col-Concluida"></div>
          <div class="kanban-col-footer">
            <label class="kanban-periodo">Mostrar concluídas
              <select id="kanbanDiasConcluidas" class="form-control">
                <option value="3">nos últimos 3 dias</option>
                <option value="7">nos últimos 7 dias</option>
                <option value="15">nos últimos 15 dias</option>
                <option value="30">nos últimos 30 dias</option>
                <option value="">de todo o período</option>
              </select>

            <button type="button" class="kanban-ver-todas" id="btnVerConcluidas" style="display:none">Ver todas as concluídas</button>
          </div>

<script type="module">
import { esc, dataParede, abrirNovoPelaUrl } from '/js/utils.js';
import { initLayout, isPlanoFree, showUpgradeToast } from '/js/layout.js';
import { apiFetch } from '/js/api.js';
import { createMultiSelect } from '/js/multiselect.js';
import { abrirNovaTarefa, abrirTarefa, excluirTarefa, PRIORIDADE_LABEL, STATUS_LABEL, badgeRecorrente } from '/js/tarefa-modal.js';

initLayout();

// Capturado antes de qualquer history.replaceState (ver switchTab abaixo), que limpa a
// querystring da URL — se lida depois, parâmetros como ?abrirId= já teriam sumido.
const _urlParams = new URLSearchParams(location.search);

const free = isPlanoFree();
if (free) document.getElementById('kanbanProBadge').style.display = '';

// ── Tab switching ──────────────────────────────────────────────
let currentTab = 'tarefas';
let kanbanLoaded = false;

function switchTab(name) {
  if (name === 'kanban' && free) { showUpgradeToast('Plus'); return; }
  currentTab = name;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(el => el.classList.toggle('active', el.id === `tab-${name}`));
  history.replaceState(null, '', name === 'tarefas' ? window.location.pathname : `?tab=${name}`);
  if (name === 'kanban' && !kanbanLoaded) { loadBoard(); kanbanLoaded = true; }
}

document.querySelectorAll('.tab-btn').forEach(btn =>
  btn.addEventListener('click', () => switchTab(btn.dataset.tab))
);

const initTab = _urlParams.get('tab') || 'tarefas';
switchTab(initTab);

// ── Lista: state ───────────────────────────────────────────────
let currentPage = 1;
let allListItems = [];

// ── Toggle de visualização (lista/blocos) ────────────────────────
const VIEW_KEY = 'tarefas.viewMode';
function loadViewMode() {
  try { return localStorage.getItem(VIEW_KEY) === 'blocos' ? 'blocos' : 'lista'; } catch { return 'lista'; }
}
let currentView = loadViewMode();

function applyView() {
  const container = document.getElementById('tarefasList');
  document.getElementById('viewList').classList.toggle('active', currentView === 'lista');
  document.getElementById('viewBlocos').classList.toggle('active', currentView === 'blocos');
  container.classList.toggle('tarefas-list', currentView === 'lista');
  container.classList.toggle('tarefas-grid', currentView === 'blocos');
}

document.getElementById('viewList').addEventListener('click', () => {
  currentView = 'lista';
  try { localStorage.setItem(VIEW_KEY, currentView); } catch {}
  applyView();
});
document.getElementById('viewBlocos').addEventListener('click', () => {
  currentView = 'blocos';
  try { localStorage.setItem(VIEW_KEY, currentView); } catch {}
  applyView();
});
applyView();

// Status, prioridade e tipo: seleção múltipla (nada marcado = todos). Criados aqui, antes do
// primeiro uso; o onChange chama loadTarefas, que é hoisted.
const opcoes = (labels) => Object.entries(labels).map(([value, label]) => ({ value, label }));
const TIPO_LABEL = { Tarefa: 'Tarefas', Prazo: 'Prazos' };
const filtStatus = createMultiSelect(document.getElementById('filtStatus'), {
  placeholder: 'Todos os status', plural: 'status', options: opcoes(STATUS_LABEL), onChange: () => loadTarefas(1)
});
const filtPrioridade = createMultiSelect(document.getElementById('filtPrioridade'), {
  placeholder: 'Todas as prioridades', plural: 'prioridades', options: opcoes(PRIORIDADE_LABEL), onChange: () => loadTarefas(1)
});
const filtTipo = createMultiSelect(document.getElementById('filtTipo'), {
  placeholder: 'Todos os tipos', plural: 'tipos', options: opcoes(TIPO_LABEL), onChange: () => loadTarefas(1)
});

function getFilters() {
  return {
    busca: document.getElementById('filtBusca').value.trim(),
    status: filtStatus.getValues(),
    prioridade: filtPrioridade.getValues(),
    tipo: filtTipo.getValues(),
    atrasada: document.getElementById('filtAtrasada').checked ? 'true' : '',
    dias: diasEncerradas(),
  };
}

// Concluídas e canceladas só aparecem se encerradas no período escolhido (padrão 3 dias, lembrado
// no navegador), pra lista não crescer sem fim; pendentes e em andamento aparecem sempre.
// Vazio = todo o período. Function (hoisted): o init pode chamar loadTarefas antes daqui.
function diasEncerradas() {
  const sel = document.getElementById('filtDiasEncerradas');
  if (!sel.dataset.restaurado) {
    sel.dataset.restaurado = '1';
    try {
      const salvo = localStorage.getItem('tarefas.listaDiasEncerradas');
      if (salvo !== null && [...sel.options].some(o => o.value === salvo)) sel.value = salvo;
    } catch {}
  }
  return sel.value;
}
document.getElementById('filtDiasEncerradas').addEventListener('change', e => {
  try { localStorage.setItem('tarefas.listaDiasEncerradas', e.target.value); } catch {}
  loadTarefas(1);
});

async function loadTarefas(page = 1) {
  currentPage = page;
  const f = getFilters();
  const params = new URLSearchParams({ page, pageSize: 50 });
  if (f.busca) params.set('busca', f.busca);
  f.status.forEach(v => params.append('status', v));
  f.prioridade.forEach(v => params.append('prioridade', v));
  f.tipo.forEach(v => params.append('tipo', v));
  if (f.atrasada) params.set('atrasada', 'true');
  if (f.dias) params.set('concluidasUltimosDias', f.dias);

  try {
    const data = await apiFetch(`/tarefas?${params}`);
    allListItems = data.items ?? [];
    renderLista(allListItems, data);
  } catch (e) { console.error(e); }
}

function renderLista(items, data) {
  const container = document.getElementById('tarefasList');
  if (!items.length) {
    container.innerHTML = '<p style="color:var(--color-text-muted);padding:16px">Nenhuma tarefa encontrada.</p>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  container.innerHTML = items.map(t => tarefaCard(t)).join('');
  renderPagination(data);
  bindListActions();
}

function tarefaCard(t) {
  const prioClass = `prioridade-${t.prioridade.toLowerCase()}`;
  const statusClass = `status-${t.status.toLowerCase()}`;
  const prazoStr = t.prazo ? dataParede(t.prazo).toLocaleString('pt-BR') : '–';
  const atrasadaBadge = t.atrasada ? '<span class="badge-atrasada">Atrasada</span>' : '';
  const tags = t.tags?.map(tag => `<span class="tag">${esc(tag)}</span>`).join('') ?? '';

  return `
  <div class="tarefa-card" data-id="${t.id}">
    <div class="tarefa-card-header">
      <div>
        <span class="tarefa-card-titulo" data-detail-id="${t.id}">${esc(t.titulo)}</span>
        ${atrasadaBadge}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${t.tipo === 'Prazo' ? '<span class="badge" style="background:#ede9fe;color:#6d28d9">⏰ Prazo</span>' : ''}
        ${badgeRecorrente(t)}
        <span class="badge ${prioClass}">${PRIORIDADE_LABEL[t.prioridade]}</span>
        <span class="badge ${statusClass}">${STATUS_LABEL[t.status]}</span>
      </div>
    </div>
    <div class="tarefa-card-meta">
      <span>📅 Prazo: ${prazoStr}</span>
      ${t.nomeResponsavel ? `<span>👤 ${esc(t.nomeResponsavel)}</span>` : ''}
      ${t.numeroCNJProcesso && t.processoId ? `<span>⚖️ <a href="/pages/processo-detalhe.html?id=${t.processoId}" class="processo-link" onclick="event.stopPropagation()">${esc(t.numeroCNJProcesso)}</a></span>` : t.numeroCNJProcesso ? `<span>⚖️ ${esc(t.numeroCNJProcesso)}</span>` : ''}
    </div>
    ${tags ? `<div class="tags-list">${tags}</div>` : ''}
    <div class="tarefa-card-actions">
      ${t.status !== 'Concluida' && t.status !== 'Cancelada' ?
        `<button class="btn btn-secondary btn-sm" data-action="concluir" data-id="${t.id}">✓ Concluir</button>` : ''}
      <button class="btn btn-secondary btn-sm" data-action="edit" data-id="${t.id}">Editar</button>
      <button class="btn btn-danger btn-sm" data-action="delete" data-id="${t.id}">Excluir</button>
    </div>
  </div>`;
}

function renderPagination(data) {
  const pag = document.getElementById('pagination');
  if (!data || data.totalPages <= 1) { pag.innerHTML = ''; return; }
  const pages = [];
  for (let i = 1; i <= data.totalPages; i++) {
    pages.push(`<button class="pagination-btn${i === currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`);
  }
  pag.innerHTML = pages.join('');
  pag.querySelectorAll('[data-page]').forEach(btn =>
    btn.addEventListener('click', () => loadTarefas(+btn.dataset.page)));
}

function bindListActions() {
  document.querySelectorAll('#tab-tarefas [data-action]').forEach(btn => {
    btn.addEventListener('click', async e => {
      const id = e.currentTarget.dataset.id;
      const action = e.currentTarget.dataset.action;
      if (action === 'edit') await abrirTarefa(id);
      else if (action === 'concluir') await concluir(id);
      else if (action === 'delete') await deleteTarefa(id);
    });
  });
}

async function concluir(id) {
  if (!confirm('Marcar tarefa como concluída?')) return;
  await apiFetch(`/tarefas/${id}/concluir`, { method: 'POST' });
  await loadTarefas(currentPage);
}

// Recarregar a lista fica com o listener de `tarefa:alterada` (ver Init).
async function deleteTarefa(id) {
  await excluirTarefa(id, allListItems.find(x => x.id === id));
}

// ── Filters ────────────────────────────────────────────────────
let debounceTimer;
document.getElementById('filtBusca').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => loadTarefas(1), 400);
});
document.getElementById('filtAtrasada').addEventListener('change', () => loadTarefas(1));

// ── Kanban filters ─────────────────────────────────────────────
const filtPrioridadeKanban = createMultiSelect(document.getElementById('filtPrioridadeKanban'), {
  placeholder: 'Todas as prioridades', plural: 'prioridades', options: opcoes(PRIORIDADE_LABEL), onChange: () => renderBoard()
});
const filtTipoKanban = createMultiSelect(document.getElementById('filtTipoKanban'), {
  placeholder: 'Todos os tipos', plural: 'tipos', options: opcoes(TIPO_LABEL), onChange: () => renderBoard()
});

function getKanbanFilters() {
  return {
    busca: document.getElementById('filtBuscaKanban').value.trim(),
    prioridade: filtPrioridadeKanban.getValues(),
    tipo: filtTipoKanban.getValues(),
    atrasada: document.getElementById('filtAtrasadaKanban').checked,
  };
}

let debounceKanban;
document.getElementById('filtBuscaKanban').addEventListener('input', () => {
  clearTimeout(debounceKanban);
  debounceKanban = setTimeout(() => renderBoard(), 400);
});
document.getElementById('filtAtrasadaKanban').addEventListener('change', () => renderBoard());

// ── Kanban ─────────────────────────────────────────────────────
const KANBAN_STATUSES = ['Pendente', 'EmAndamento', 'Concluida'];
// Concluídas saem do quadro depois do período escolhido pelo usuário (padrão 3 dias, lembrado
// no navegador); continuam na aba Tarefas (filtro Concluída). Vazio = todo o período.
// Function (hoisted) e não const: o switchTab do topo do módulo pode chamar loadBoard antes daqui.
function diasConcluidas() {
  const sel = document.getElementById('kanbanDiasConcluidas');
  if (!sel.dataset.restaurado) {
    sel.dataset.restaurado = '1';
    try {
      const salvo = localStorage.getItem('tarefas.kanbanDiasConcluidas');
      if (salvo !== null && [...sel.options].some(o => o.value === salvo)) sel.value = salvo;
    } catch {}
  }
  return sel.value;
}
document.getElementById('kanbanDiasConcluidas').addEventListener('change', e => {
  try { localStorage.setItem('tarefas.kanbanDiasConcluidas', e.target.value); } catch {}
  loadBoard();
});
let allKanbanTasks = [];
let draggedId = null;
let draggedStatus = null;

async function loadBoard() {
  try {
    const dias = diasConcluidas();
    const [p, ea, c, todasConcluidas] = await Promise.all([
      apiFetch('/tarefas?status=Pendente&pageSize=100'),
      apiFetch('/tarefas?status=EmAndamento&pageSize=100'),
      apiFetch(`/tarefas?status=Concluida${dias ? `&concluidasUltimosDias=${dias}` : ''}&pageSize=100`),
      apiFetch('/tarefas?status=Concluida&pageSize=1')
    ]);
    const antigas = (todasConcluidas.total ?? 0) - (c.items?.length ?? 0);
    document.getElementById('btnVerConcluidas').style.display = antigas > 0 ? '' : 'none';
    document.getElementById('btnVerConcluidas').textContent =
      `Ver todas as concluídas (+${antigas} ${antigas === 1 ? 'anterior' : 'anteriores'})`;
    allKanbanTasks = [
      ...(p.items ?? []).map(t => ({...t, status: 'Pendente'})),
      ...(ea.items ?? []).map(t => ({...t, status: 'EmAndamento'})),
      ...(c.items ?? []).map(t => ({...t, status: 'Concluida'}))
    ];
    renderBoard();
  } catch (e) { console.error(e); }
}

function renderBoard() {
  const f = getKanbanFilters();
  for (const s of KANBAN_STATUSES) {
    const tasks = allKanbanTasks.filter(t => {
      if (t.status !== s) return false;
      if (f.busca && !t.titulo.toLowerCase().includes(f.busca.toLowerCase())) return false;
      if (f.prioridade.length && !f.prioridade.includes(t.prioridade)) return false;
      if (f.tipo.length && !f.tipo.includes(t.tipo)) return false;
      if (f.atrasada && !t.atrasada) return false;
      return true;
    });
    const col = document.getElementById(`col-${s}`);
    document.getElementById(`count-${s}`).textContent = tasks.length;
    col.innerHTML = tasks.length
      ? tasks.map(renderKanbanCard).join('')
      : '<div style="color:#9ca3af;font-size:13px;text-align:center;padding:20px 0">Vazio</div>';

    col.querySelectorAll('.kanban-card').forEach(card => {
      card.addEventListener('dragstart', onDragStart);
      card.addEventListener('dragend', onDragEnd);
    });
  }
  document.querySelectorAll('.kanban-col').forEach(col => {
    col.addEventListener('dragover', onDragOver);
    col.addEventListener('dragleave', onDragLeave);
    col.addEventListener('drop', onDrop);
  });
}

function renderKanbanCard(t) {
  const prazo = t.prazo ? (() => { const d = dataParede(t.prazo); return !isNaN(d) ? d.toLocaleDateString('pt-BR') : null; })() : null;
  const atrasada = t.atrasada ? '<span class="badge-atrasada">Atrasada</span>' : '';
  return `<div class="kanban-card prioridade-${(t.prioridade ?? '').toLowerCase()}" draggable="true" data-id="${t.id}" data-status="${t.status}">
    <div class="kanban-card-title" data-detail-id="${t.id}">${esc(t.titulo)}</div>
    <div class="kanban-card-meta">
      <span style="background:#e5e7eb;padding:1px 6px;border-radius:3px">${PRIORIDADE_LABEL[t.prioridade] ?? t.prioridade}</span>
      ${prazo ? `<span>📅 ${prazo}</span>` : ''}
      ${t.recorrenciaId ? '<span title="Tarefa recorrente">🔁</span>' : ''}
      ${t.nomeResponsavel ? `<span>👤 ${esc(t.nomeResponsavel)}</span>` : ''}
      ${atrasada}
    </div>
  </div>`;
}

function onDragStart(e) {
  draggedId = e.currentTarget.dataset.id;
  draggedStatus = e.currentTarget.dataset.status;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const col = e.currentTarget.closest('.kanban-col');
  if (col) col.classList.add('drag-over');
}

function onDragLeave(e) {
  const col = e.currentTarget.closest('.kanban-col');
  if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over');
}

async function onDrop(e) {
  e.preventDefault();
  const col = e.currentTarget.closest('.kanban-col');
  if (!col) return;
  col.classList.remove('drag-over');
  const newStatus = col.dataset.status;
  if (!draggedId || newStatus === draggedStatus) return;

  const task = allKanbanTasks.find(t => t.id === draggedId);
  if (task) { task.status = newStatus; renderBoard(); }

  try {
    await apiFetch(`/tarefas/${draggedId}/mover`, { method: 'PATCH', body: JSON.stringify({ status: newStatus }) });
  } catch (err) {
    if (task) { task.status = draggedStatus; renderBoard(); }
    alert('Erro ao mover: ' + err.message);
  }
}

document.getElementById('btnVerConcluidas').addEventListener('click', () => {
  filtStatus.setValues(['Concluida']);
  // Só nesta visita (não grava no localStorage): o botão promete "todas".
  diasEncerradas();
  document.getElementById('filtDiasEncerradas').value = '';
  switchTab('tarefas');
  loadTarefas(1);
});

// Título da tarefa (lista ou kanban): abre direto no modal de edição, com o painel de contexto.
document.addEventListener('click', async e => {
  const titleEl = e.target.closest('[data-detail-id]');
  if (!titleEl) return;
  e.stopPropagation();
  try {
    await abrirTarefa(titleEl.dataset.detailId);
  } catch (err) {
    alert('Erro ao carregar a tarefa: ' + err.message);
  }
});

document.getElementById('btnNova').addEventListener('click', abrirNovaTarefa);

// Criada/alterada/excluída pelo modal (aqui ou pelo widget "Minhas Tarefas"): recarrega a lista ou o kanban.
window.addEventListener('tarefa:alterada', () => {
  if (currentTab === 'kanban') { allKanbanTasks = []; loadBoard(); }
  else loadTarefas(currentPage);
});

// ── Init ───────────────────────────────────────────────────────
const _initTipo = _urlParams.get('tipo');
if (_initTipo && TIPO_LABEL[_initTipo]) filtTipo.setValues([_initTipo]);
loadTarefas();
const _abrirId = _urlParams.get('abrirId');

// Tarefa criada/alterada pelo chat do assistente de IA: recarrega a lista ou o kanban.
window.addEventListener('assistente:alteracao', (e) => {
  if (e.detail?.entidade !== 'tarefa') return;
  if (currentTab === 'kanban') { allKanbanTasks = []; loadBoard(); }
  else loadTarefas(currentPage);
});
if (_abrirId) abrirTarefa(_abrirId);

// Atalho "criar novo" (ex.: dashboard → ?novo=1).
abrirNovoPelaUrl('btnNova');
</script>
