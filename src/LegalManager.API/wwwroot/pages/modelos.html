<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalManager — Modelos de Documentos</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .var-badge { background:#e0e7ff; color:#3730a3; padding:2px 8px; border-radius:12px; font-size:12px; margin:2px; display:inline-block; }
    .var-list { margin-top:8px; }
    .editor-toolbar { display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap; }
    .editor-toolbar button { padding:4px 12px;font-size:13px; }
  </style>
</head>
<body>
<div class="app-layout">
  <header class="header">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="header-logo">⚖️ LegalManager</div>
    <div class="header-spacer"></div>
    <div class="header-user">
      <span class="header-user-name"></span>
      <span style="color:var(--color-border)">|</span>
      <span class="header-tenant"></span>
      <button class="btn btn-secondary btn-sm" id="logoutBtn">Sair</button>
    </div>
  </header>

  <nav class="sidebar">
    <ul class="sidebar-nav">
      <li><a href="/pages/dashboard.html">📊 Dashboard</a></li>
      <li><a href="/pages/processos.html">⚖️ Processos</a></li>
      <li><a href="/pages/contatos.html">👥 Contatos</a></li>
      <li><a href="/pages/tarefas.html">✅ Tarefas</a></li>
      <li><a href="/pages/agenda.html">📅 Agenda</a></li>
      <li><a href="/pages/publicacoes.html">📰 Publicações</a></li>
      <li><a href="/pages/prazos.html">⏰ Prazos</a></li>
      <li><a href="/pages/documentos.html">📁 Documentos</a></li>
      <li><a href="/pages/modelos.html" class="active">📋 Modelos</a></li>
      <li><a href="/pages/usuarios.html">🔑 Usuários</a></li>
      <li><a href="/pages/configuracoes.html">⚙️ Configurações</a></li>
    </ul>
  </nav>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Modelos de Documentos</h1>
      <button class="btn btn-primary" id="btnNovo">+ Novo Modelo</button>
    </div>

    <div id="alertMsg" class="alert" style="display:none"></div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Descrição</th>
              <th>Variáveis</th>
              <th>Criado em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5" style="text-align:center;padding:32px;color:var(--color-text-muted)">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal Criar/Editar -->
<div class="modal-overlay" id="modalForm">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Novo Modelo</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div id="formAlert" class="alert" style="display:none"></div>
      <form id="modeloForm">
        <input type="hidden" id="fId">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" id="fNome" class="form-control" required placeholder="Ex: Petição Inicial Cível">
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <input type="text" id="fDescricao" class="form-control" placeholder="Breve descrição do modelo">
        </div>
        <div class="form-group">
          <label>Variáveis</label>
          <input type="text" id="fVariaveis" class="form-control" placeholder="Detectadas automaticamente do conteúdo (ou digite separadas por vírgula)">
          <div class="var-list" id="varPreview"></div>
        </div>
        <div class="form-group">
          <label>Conteúdo do Modelo *</label>
          <div class="editor-toolbar">
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('nome_autor')">&#123;&#123;nome_autor&#125;&#125;</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('nome_reu')">&#123;&#123;nome_reu&#125;&#125;</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('nome_interessado')">&#123;&#123;nome_interessado&#125;&#125;</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('nome_terceiro')">&#123;&#123;nome_terceiro&#125;&#125;</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('nome_advogado')">&#123;&#123;nome_advogado&#125;&#125;</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('numero_processo')">&#123;&#123;numero_processo&#125;&#125;</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('tribunal')">&#123;&#123;tribunal&#125;&#125;</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('vara')">&#123;&#123;vara&#125;&#125;</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('comarca')">&#123;&#123;comarca&#125;&#125;</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('area_direito')">&#123;&#123;area_direito&#125;&#125;</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="insertVar('valor_causa')">&#123;&#123;valor_causa&#125;&#125;</button>
          </div>
          <textarea id="fConteudo" class="form-control" rows="12" required placeholder="Digite o conteúdo do modelo usando &#123;&#123;variavel&#125;&#125; para variáveis dinâmicas"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btnCancelar">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvar">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Aplicar Variáveis -->
<div class="modal-overlay" id="modalAplicar">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <span class="modal-title">Aplicar Variáveis</span>
      <button class="modal-close" id="modalAplicarClose">✕</button>
    </div>
    <div class="modal-body">
      <p id="aplicarModeloNome" style="margin-bottom:16px;font-weight:600"></p>
      <div id="varInputs"></div>
      <div class="form-group" style="margin-top:16px">
        <label>Resultado</label>
        <textarea id="resultadoConteudo" class="form-control" rows="10" readonly style="background:#f9fafb"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btnFecharAplicar">Fechar</button>
      <button class="btn btn-primary" id="btnCopiar">Copiar Conteúdo</button>
    </div>
  </div>
</div>

<script type="module">
import { initLayout } from '/js/layout.js';
import { apiFetch } from '/js/api.js';

initLayout();

const modal = document.getElementById('modalForm');
const modalAplicar = document.getElementById('modalAplicar');
const alertMsg = document.getElementById('alertMsg');
let modelos = [];
let currentModeloId = null;

function showAlert(msg, type = 'error') {
  alertMsg.className = `alert alert-${type}`;
  alertMsg.textContent = msg;
  alertMsg.style.display = 'block';
  setTimeout(() => alertMsg.style.display = 'none', 5000);
}

async function loadModelos() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px">Carregando...</td></tr>';
  try {
    modelos = await apiFetch('/modelos');
    renderTable(modelos);
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--color-danger)">${err.message}</td></tr>`;
  }
}

function renderTable(items) {
  const tbody = document.getElementById('tableBody');
  if (!items.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Nenhum modelo encontrado</div></div></td></tr>`;
    return;
  }
  tbody.innerHTML = items.map(m => {
    const vars = m.variaveis && m.variaveis.length
      ? m.variaveis.map(v => `<span class="var-badge">${v}</span>`).join('')
      : '<span style="color:var(--color-text-muted);font-size:13px">Nenhuma</span>';
    return `
    <tr>
      <td data-label="Nome"><strong>${m.nome}</strong></td>
      <td data-label="Descrição">${m.descricao || '—'}</td>
      <td data-label="Variáveis">${vars}</td>
      <td data-label="Criado em">${new Date(m.criadoEm).toLocaleDateString('pt-BR')}</td>
      <td data-label="Ações" style="white-space:nowrap">
        <button class="btn btn-secondary btn-sm" onclick="editarModelo('${m.id}')">Editar</button>
        <button class="btn btn-primary btn-sm" onclick="aplicarModelo('${m.id}')">Usar</button>
        <button class="btn btn-danger btn-sm" onclick="excluirModelo('${m.id}')">Excluir</button>
      </td>
    </tr>`;
  }).join('');
}

window.editarModelo = id => {
  const m = modelos.find(x => x.id === id);
  if (!m) return;
  currentModeloId = id;
  document.getElementById('fId').value = id;
  document.getElementById('fNome').value = m.nome;
  document.getElementById('fDescricao').value = m.descricao || '';
  document.getElementById('fVariaveis').value = (m.variaveis || []).join(', ');
  document.getElementById('fConteudo').value = m.conteudo;
  document.getElementById('modalTitle').textContent = 'Editar Modelo';
  updateVarPreview();
  modal.classList.add('open');
};

window.aplicarModelo = async id => {
  const m = modelos.find(x => x.id === id);
  if (!m) return;
  currentModeloId = id;
  document.getElementById('aplicarModeloNome').textContent = m.nome;

  const container = document.getElementById('varInputs');
  container.innerHTML = '';
  if (!m.variaveis || !m.variaveis.length) {
    container.innerHTML = '<p style="color:var(--color-text-muted)">Este modelo não possui variáveis definidas.</p>';
  } else {
    m.variaveis.forEach(v => {
      const div = document.createElement('div');
      div.className = 'form-group';
      div.innerHTML = `<label style="text-transform:uppercase;font-size:12px">${v}</label><input type="text" class="form-control var-input" data-var="${v}" placeholder="Valor para ${v}">`;
      container.appendChild(div);
    });
  }

  document.getElementById('resultadoConteudo').value = m.conteudo;
  modalAplicar.classList.add('open');
};

window.excluirModelo = async id => {
  if (!confirm('Tem certeza que deseja excluir este modelo?')) return;
  try {
    await apiFetch(`/modelos/${id}`, { method: 'DELETE' });
    showAlert('Modelo excluído.', 'success');
    loadModelos();
  } catch (err) { showAlert(err.message); }
};

function resetModal() {
  document.getElementById('modeloForm').reset();
  document.getElementById('fId').value = '';
  document.getElementById('formAlert').style.display = 'none';
  currentModeloId = null;
  document.getElementById('modalTitle').textContent = 'Novo Modelo';
  document.getElementById('varPreview').innerHTML = '';
}

function updateVarPreview() {
  const input = document.getElementById('fVariaveis');
  const preview = document.getElementById('varPreview');
  const vars = input.value.split(',').map(v => v.trim()).filter(v => v);
  preview.innerHTML = vars.map(v => `<span class="var-badge">${v}</span>`).join('');
}

document.getElementById('fVariaveis').addEventListener('input', updateVarPreview);

window.insertVar = name => {
  const ta = document.getElementById('fConteudo');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const text = ta.value;
  const insert = `{{${name}}}`;
  ta.value = text.substring(0, start) + insert + text.substring(end);
  ta.selectionStart = ta.selectionEnd = start + insert.length;
  ta.focus();
};

document.getElementById('btnNovo').addEventListener('click', () => { resetModal(); modal.classList.add('open'); });
document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('open'));
document.getElementById('btnCancelar').addEventListener('click', () => modal.classList.remove('open'));

document.getElementById('btnSalvar').addEventListener('click', async () => {
  const nome = document.getElementById('fNome').value.trim();
  const descricao = document.getElementById('fDescricao').value.trim();
  const conteudo = document.getElementById('fConteudo').value;

  if (!nome) { showAlert('Nome é obrigatório.', 'error', 'formAlert'); return; }
  if (!conteudo) { showAlert('Conteúdo é obrigatório.', 'error', 'formAlert'); return; }

  const variaveisMatch = conteudo.match(/\{\{([^}]+)\}\}/g) || [];
  const variaveis = [...new Map(variaveisMatch.map(v => v.replace(/\{\{|\}/g, '')).map(v => [v.trim(), v.trim()])).values()].filter(v => v);
  document.getElementById('fVariaveis').value = variaveis.join(', ');
  updateVarPreview();
  const btn = document.getElementById('btnSalvar');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const payload = { nome, descricao, conteudo, variaveis };
  const id = document.getElementById('fId').value;

  try {
    if (id) {
      await apiFetch(`/modelos/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
      showAlert('Modelo atualizado.', 'success');
    } else {
      await apiFetch('/modelos', { method: 'POST', body: JSON.stringify(payload) });
      showAlert('Modelo criado.', 'success');
    }
    modal.classList.remove('open');
    loadModelos();
  } catch (err) {
    showAlert(err.message, 'error', 'formAlert');
  } finally {
    btn.disabled = false; btn.textContent = 'Salvar';
  }
});

document.getElementById('btnFecharAplicar').addEventListener('click', () => modalAplicar.classList.remove('open'));
document.getElementById('modalAplicarClose').addEventListener('click', () => modalAplicar.classList.remove('open'));

document.getElementById('varInputs').addEventListener('input', e => {
  if (e.target.classList.contains('var-input')) atualizarResultado();
});

function atualizarResultado() {
  const m = modelos.find(x => x.id === currentModeloId);
  if (!m) return;

  const inputs = document.querySelectorAll('.var-input');
  const vars = {};
  inputs.forEach(input => vars[input.dataset.var] = input.value);

  let resultado = m.conteudo;
  Object.entries(vars).forEach(([chave, valor]) => {
    resultado = resultado.replace(new RegExp(`\\{\\{${chave}\\}\\}`, 'gi'), valor || `{{${chave}}}`);
  });
  document.getElementById('resultadoConteudo').value = resultado;
}

document.getElementById('btnCopiar').addEventListener('click', () => {
  const texto = document.getElementById('resultadoConteudo').value;
  navigator.clipboard.writeText(texto).then(() => {
    showAlert('Conteúdo copiado!', 'success');
  }).catch(() => showAlert('Erro ao copiar.'));
});

loadModelos();
</script>
</body>
</html>
