  <meta charset="UTF-8">
  <link rel='icon' type='image/svg+xml' href='/favicon.svg'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Importação de Processos</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .page-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .page-intro { color: var(--color-text-muted); font-size: 14px; margin: -12px 0 20px; }

    .resumo-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
    .resumo-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 14px 16px; }
    .resumo-card .rotulo { font-size: 12px; color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .resumo-card .valor { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .resumo-card.ok .valor { color: var(--color-success); }
    .resumo-card.erro .valor { color: var(--color-danger); }

    .status-linha { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; }
    .status-linha .meta { color: var(--color-text-muted); font-size: 13px; }
    .progresso { height: 8px; border-radius: 999px; background: var(--color-primary-light); overflow: hidden; margin-bottom: 20px; }
    .progresso > div { height: 100%; background: var(--color-primary); transition: width .4s ease; }

    .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .filtro { border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; min-height: 36px; }
    .filtro.ativo { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }

    .lista-wrap { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); overflow: hidden; }
    .cnj { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; white-space: nowrap; }
    .mensagem { color: var(--color-text-muted); font-size: 13px; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .vazio { padding: 40px 24px; text-align: center; color: var(--color-text-muted); }

    .revisao { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px; }
    .revisao-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .revisao-lista { margin-top: 12px; }
    .revisao-acoes { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .revisao input[type=checkbox] { width: 18px; height: 18px; }

    @media (max-width: 768px) {
      .resumo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .col-tribunal { display: none; }
    }
  </style>
</head>
<body>
<div class="app-layout">
  <header class="header">
    <button class="hamburger" id="hamburger">☰</button>
    <div class="header-logo"><img src="/images/causify-logo-navbar-clara.png" alt="Causify"></div>
    <div class="header-spacer"></div>
    <div class="header-user">
      <span class="header-user-name"></span>
      <span style="color:var(--color-border)">|</span>
      <span class="header-tenant"></span>
      <button class="btn btn-secondary btn-sm" id="logoutBtn">Sair</button>
    </div>
  </header>

  <nav class="sidebar">
    <ul class="sidebar-nav" id="sidebarNav"></ul>
  </nav>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title" id="titulo">Importações de processos</h1>
      <a class="btn btn-secondary" href="/pages/processos.html">Ver processos</a>
    </div>
    <p class="page-intro" id="intro"></p>
    <div id="revisao"></div>
    <div id="conteudo"><div class="vazio">Carregando...</div></div>
  </main>
</div>

<script type="module">
  import { initLayout } from '/js/layout.js';
  import { apiFetch } from '/js/api.js';
  import { esc } from '/js/utils.js';

  initLayout();

  const ATIVOS = ['Pendente', 'Buscando', 'Importando'];
  const STATUS_IMPORTACAO = {
    Pendente:   ['Na fila', 'badge-gray'],
    Buscando:   ['Pesquisando', 'badge-blue'],
    Importando: ['Importando', 'badge-blue'],
    Concluida:  ['Concluída', 'badge-green'],
    Erro:       ['Interrompida', 'badge-red'],
  };
  const STATUS_ITEM = {
    Pendente:      ['Aguardando', 'badge-gray'],
    Importado:     ['Importado', 'badge-green'],
    JaCadastrado:  ['Já cadastrado', 'badge-gray'],
    NaoEncontrado: ['Não encontrado', 'badge-yellow'],
    Erro:          ['Erro', 'badge-red'],
  };
  // Status com que o processo entrou, quando a fonte indicou que ele não tramita mais.
  const SITUACAO_FONTE = {
    Arquivado: ['Arquivado no tribunal', 'badge-gray'],
    Suspenso:  ['Suspenso no tribunal', 'badge-yellow'],
  };
  const inativoNaFonte = i => i.status === 'Importado' && !!SITUACAO_FONTE[i.statusProcesso];
  const FILTROS = [
    ['todos', 'Todos', () => true],
    ['importados', 'Importados', i => i.status === 'Importado'],
    ['inativos', 'Arquivados/suspensos no tribunal', inativoNaFonte],
    ['ja', 'Já cadastrados', i => i.status === 'JaCadastrado'],
    ['erros', 'Com erro', i => i.status === 'Erro' || i.status === 'NaoEncontrado'],
    ['pendentes', 'Aguardando', i => i.status === 'Pendente'],
  ];

  const conteudo = document.getElementById('conteudo');
  const id = new URLSearchParams(location.search).get('id');
  let filtroAtual = 'todos';
  let itens = [];

  const badge = ([texto, classe]) => `<span class="badge ${classe}">${esc(texto)}</span>`;
  // CriadoEm/ConcluidoEm são carimbos UTC reais do servidor (não hora "de parede").
  const dataHora = v => v ? new Date(v).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

  if (id) carregarImportacao(); else { carregarLista(); carregarRevisao(); }

  async function carregarLista() {
    document.getElementById('intro').textContent = 'Suas importações de processos por OAB mais recentes.';
    let lista;
    try {
      lista = await apiFetch('/importacoes');
    } catch {
      conteudo.innerHTML = '<div class="vazio">Erro ao carregar as importações.</div>';
      return;
    }
    if (!lista.length) {
      conteudo.innerHTML = '<div class="lista-wrap"><div class="vazio">Nenhuma importação realizada ainda.</div></div>';
      return;
    }
    conteudo.innerHTML = `
      <div class="lista-wrap table-wrapper">
        <table>
          <thead><tr><th>Início</th><th>OAB</th><th>Status</th><th>Importados</th><th></th></tr></thead>
          <tbody>
            ${lista.map(i => `
              <tr>
                <td>${dataHora(i.criadoEm)}</td>
                <td class="cnj">${esc(i.numeroOab)}/${esc(i.uf)}</td>
                <td>${badge(STATUS_IMPORTACAO[i.status] ?? [i.status, 'badge-gray'])}</td>
                <td>${i.importados} de ${i.total}</td>
                <td style="text-align:right"><a href="/pages/importacao.html?id=${encodeURIComponent(i.id)}">Ver detalhes</a></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  async function carregarImportacao() {
    let importacao;
    try {
      [importacao, itens] = await Promise.all([
        apiFetch(`/importacoes/${encodeURIComponent(id)}`),
        apiFetch(`/importacoes/${encodeURIComponent(id)}/itens`),
      ]);
    } catch {
      conteudo.innerHTML = '<div class="vazio">Importação não encontrada.</div>';
      return;
    }

    document.getElementById('titulo').textContent = `Importação da OAB ${importacao.numeroOab}/${importacao.uf}`;
    document.getElementById('intro').innerHTML =
      `<a href="/pages/importacao.html">← Todas as importações</a>`;
    renderImportacao(importacao);

    // Enquanto roda, atualiza a página junto com a barra inferior.
    if (ATIVOS.includes(importacao.status)) setTimeout(carregarImportacao, 3000);
    else carregarRevisao();
  }

  // Processos que seguem Ativos aqui mas, pelos andamentos/Escavador, já foram arquivados ou
  // suspensos no tribunal (ex.: importados antes da detecção existir). O advogado escolhe quais atualizar.
  async function carregarRevisao(aviso = '') {
    const el = document.getElementById('revisao');
    let sugestoes;
    try {
      sugestoes = await apiFetch('/processos/situacao-na-fonte');
    } catch {
      el.innerHTML = '';
      return;
    }
    if (!sugestoes.length) {
      el.innerHTML = aviso ? `<div class="revisao"><span class="mensagem">${esc(aviso)}</span></div>` : '';
      return;
    }

    const aConferir = sugestoes.filter(s => s.conferir).length;
    el.innerHTML = `
      <section class="revisao">
        <div class="revisao-topo">
          <div>
            <strong>${sugestoes.length} processo(s) ativo(s) já parecem arquivados ou suspensos no tribunal</strong>
            <div class="mensagem">${aviso ? esc(aviso) + ' ' : ''}Identificados pelos dados do tribunal. Marque os que quer atualizar${aConferir
              ? ` — ${aConferir} tiveram movimentação recente ou depois do arquivamento e vêm desmarcados para você conferir`
              : ''}.</div>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" id="revisaoAbrir" aria-expanded="false">Revisar</button>
        </div>
        <div class="revisao-lista" id="revisaoLista" hidden>
          <div class="table-wrapper">
            <table>
              <thead><tr>
                <th><input type="checkbox" id="revisaoTodos" ${aConferir ? '' : 'checked'} aria-label="Selecionar todos"></th>
                <th>Processo</th><th class="col-tribunal">Tribunal</th><th>Atualizar para</th>
              </tr></thead>
              <tbody>
                ${sugestoes.map(s => `
                  <tr>
                    <td><input type="checkbox" class="revisao-item" value="${esc(s.processoId)}" ${s.conferir ? '' : 'checked'} aria-label="Selecionar ${esc(s.numeroCNJ)}"></td>
                    <td class="cnj"><a href="/pages/processo-detalhe.html?id=${encodeURIComponent(s.processoId)}">${esc(s.numeroCNJ)}</a></td>
                    <td class="col-tribunal">${esc(s.tribunal ?? '—')}</td>
                    <td>${badge(SITUACAO_FONTE[s.status] ?? [s.status, 'badge-gray'])}<div class="mensagem">${esc(s.motivo)}</div>
                      ${s.conferir ? `<div class="mensagem"><span class="badge badge-yellow">Conferir</span> ${esc(s.conferir)}</div>` : ''}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="revisao-acoes">
            <button type="button" class="btn btn-primary" id="revisaoAplicar">Atualizar selecionados</button>
            <span class="mensagem" id="revisaoMsg" role="status"></span>
          </div>
        </div>
      </section>`;

    const lista = el.querySelector('#revisaoLista');
    const abrir = el.querySelector('#revisaoAbrir');
    const aplicar = el.querySelector('#revisaoAplicar');
    const itensRevisao = () => [...el.querySelectorAll('.revisao-item')];
    const selecionados = () => itensRevisao().filter(c => c.checked).map(c => c.value);
    const atualizarBotao = () => {
      const n = selecionados().length;
      aplicar.disabled = n === 0;
      aplicar.textContent = `Atualizar selecionados (${n})`;
    };

    abrir.addEventListener('click', () => {
      lista.hidden = !lista.hidden;
      abrir.setAttribute('aria-expanded', String(!lista.hidden));
      abrir.textContent = lista.hidden ? 'Revisar' : 'Ocultar';
    });
    el.querySelector('#revisaoTodos').addEventListener('change', e => {
      itensRevisao().forEach(c => { c.checked = e.target.checked; });
      atualizarBotao();
    });
    itensRevisao().forEach(c => c.addEventListener('change', atualizarBotao));
    atualizarBotao();

    aplicar.addEventListener('click', async () => {
      const ids = selecionados();
      if (!ids.length) return;
      aplicar.disabled = true;
      try {
        const aplicadas = await apiFetch('/processos/situacao-na-fonte', {
          method: 'POST',
          body: JSON.stringify({ processoIds: ids }),
        });
        await carregarRevisao(`${aplicadas.length} processo(s) atualizado(s).`);
      } catch (e) {
        el.querySelector('#revisaoMsg').textContent = e?.message || 'Não foi possível atualizar os processos.';
        atualizarBotao();
      }
    });
  }

  function renderImportacao(i) {
    const ativo = ATIVOS.includes(i.status);
    const erros = i.erros;
    const pct = i.total > 0 ? Math.round((i.processados / i.total) * 100) : 0;

    conteudo.innerHTML = `
      <div class="status-linha">
        ${badge(STATUS_IMPORTACAO[i.status] ?? [i.status, 'badge-gray'])}
        <span class="meta">Iniciada em ${dataHora(i.criadoEm)}${i.concluidoEm ? ` · concluída em ${dataHora(i.concluidoEm)}` : ''}</span>
        ${i.mensagemErro ? `<span class="mensagem">${esc(i.mensagemErro)}</span>` : ''}
      </div>
      ${ativo ? `<div class="progresso" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${i.status === 'Importando' ? pct : 0}%"></div></div>` : ''}
      <div class="resumo-grid">
        <div class="resumo-card"><div class="rotulo">Encontrados</div><div class="valor">${i.total}</div></div>
        <div class="resumo-card ok"><div class="rotulo">Importados</div><div class="valor">${i.importados}</div></div>
        <div class="resumo-card"><div class="rotulo">Já cadastrados</div><div class="valor">${i.jaCadastrados}</div></div>
        <div class="resumo-card${erros > 0 ? ' erro' : ''}"><div class="rotulo">Com erro</div><div class="valor">${erros}</div></div>
      </div>
      <div class="filtros" id="filtros"></div>
      <div class="lista-wrap table-wrapper" id="lista"></div>`;

    renderFiltros();
    renderItens();
  }

  function renderFiltros() {
    const el = document.getElementById('filtros');
    el.innerHTML = FILTROS
      .map(([chave, rotulo, pred]) => {
        const n = itens.filter(pred).length;
        if (chave !== 'todos' && n === 0) return '';
        return `<button type="button" class="filtro${chave === filtroAtual ? ' ativo' : ''}" data-filtro="${chave}">${esc(rotulo)} (${n})</button>`;
      })
      .join('');
    el.querySelectorAll('.filtro').forEach(b => b.addEventListener('click', () => {
      filtroAtual = b.dataset.filtro;
      renderFiltros();
      renderItens();
    }));
  }

  function renderItens() {
    const el = document.getElementById('lista');
    const pred = (FILTROS.find(([c]) => c === filtroAtual) ?? FILTROS[0])[2];
    const visiveis = itens.filter(pred);
    if (!visiveis.length) {
      el.innerHTML = `<div class="vazio">${itens.length ? 'Nenhum processo neste filtro.' : 'Os processos aparecem aqui assim que a pesquisa terminar.'}</div>`;
      return;
    }
    el.innerHTML = `
      <table>
        <thead><tr><th>Processo</th><th class="col-tribunal">Tribunal</th><th>Status</th></tr></thead>
        <tbody>
          ${visiveis.map(it => `
            <tr>
              <td class="cnj">${it.processoId
                ? `<a href="/pages/processo-detalhe.html?id=${encodeURIComponent(it.processoId)}">${esc(it.numeroCNJ)}</a>`
                : esc(it.numeroCNJ)}</td>
              <td class="col-tribunal">${esc(it.tribunal ?? '—')}</td>
              <td>${badge(STATUS_ITEM[it.status] ?? [it.status, 'badge-gray'])}
                ${inativoNaFonte(it) ? badge(SITUACAO_FONTE[it.statusProcesso]) : ''}
                ${it.mensagem && it.status !== 'JaCadastrado' ? `<div class="mensagem">${esc(it.mensagem)}</div>` : ''}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }
</script>
</body>
</html>
