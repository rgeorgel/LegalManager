  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causify — Login</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="text/javascript">window.$crisp=[];window.CRISP_WEBSITE_ID="d8dabf67-657a-4b8c-b6c4-0bc60ab6c04a";(function(){d=document;s=d.createElement("script");s.src="https://client.crisp.chat/l.js";s.async=1;d.getElementsByTagName("head")[0].appendChild(s);})();</script>

<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo"><img src="/images/causify-logo-navbar-clara.png" alt="Causify"></div>
      <div class="auth-subtitle">Gestão jurídica para escritórios modernos</div>

      <div id="alert" class="alert alert-error" style="display:none"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-control" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">
          Entrar
        </button>
      </form>

      <div style="display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--color-text-muted); font-size:13px;">
        <div style="flex:1; height:1px; background:var(--color-border, #e2e8f0);"></div>
        ou
        <div style="flex:1; height:1px; background:var(--color-border, #e2e8f0);"></div>
      </div>

      <div style="display:flex; justify-content:center;">
        <div id="g_id_onload"
             data-client_id="7660270266-42mucnv6jgb9k3ppe91t7cld1898jld1.apps.googleusercontent.com"
             data-callback="handleGoogleCredential"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="outline"
             data-text="continue_with"
             data-size="large"
             data-width="336"
             data-locale="pt-BR">
        </div>
      </div>

      <div class="auth-footer">
        <a href="/blog/index.html">Blog</a>
        &nbsp;·&nbsp;
        <a href="/forgot-password.html">Esqueceu a senha?</a>
        &nbsp;·&nbsp;
        <a href="/register.html">Criar escritório</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { login, loginWithGoogle, isLoggedIn } from '/js/auth.js';

    function getSafeRedirect() {
      const r = new URLSearchParams(window.location.search).get('redirect');
      if (!r) return '/pages/dashboard.html';
      // Só aceita caminhos internos que começam com / (evita open redirect)
      if (/^\/[a-zA-Z0-9_\-/?&=.%]*$/.test(r)) return r;
      return '/pages/dashboard.html';
    }

    if (isLoggedIn()) window.location.href = getSafeRedirect();

    const form = document.getElementById('loginForm');
    const alert = document.getElementById('alert');
    const btn = document.getElementById('submitBtn');

    const params = new URLSearchParams(window.location.search);
    if (params.get('contaExcluida') === '1') {
      alert.className = 'alert alert-success';
      alert.textContent = 'Sua conta foi excluída com sucesso.';
      alert.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alert.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Entrando...';

      try {
        await login(
          document.getElementById('email').value,
          document.getElementById('senha').value
        );
        window.location.href = getSafeRedirect();
      } catch (err) {
        alert.textContent = err.message;
        alert.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });

    // Chamado pelo Google Identity Services (data-callback em #g_id_onload) com o ID token do usuário.
    window.handleGoogleCredential = async (response) => {
      alert.style.display = 'none';
      try {
        await loginWithGoogle(response.credential);
        window.location.href = getSafeRedirect();
      } catch (err) {
        alert.textContent = err.message;
        alert.style.display = 'block';
      }
    };
  </script>
</body>
</html>
