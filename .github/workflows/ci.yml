name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build e testes (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LegalManager.slnx

      - name: Build
        run: dotnet build LegalManager.slnx --no-restore -c Release

      # Unit e integration usam EF InMemory — não precisam de PostgreSQL.
      - name: Testes unitários
        run: dotnet test tests/LegalManager.UnitTests --no-build -c Release --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Testes de integração
        run: dotnet test tests/LegalManager.IntegrationTests --no-build -c Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Publicar resultados dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Sintaxe JS (wwwroot)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Arquivos .js e scripts inline dos .html.
      - name: Verificar sintaxe
        run: node scripts/check-js.mjs
