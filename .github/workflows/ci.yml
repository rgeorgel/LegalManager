name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build e testes (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LegalManager.slnx

      - name: Build
        run: dotnet build LegalManager.slnx --no-restore -c Release

      # Unit e integration usam EF InMemory — não precisam de PostgreSQL.
      # Ambos coletam cobertura (coverlet); o relatório abaixo junta os dois.
      - name: Testes unitários
        run: dotnet test tests/LegalManager.UnitTests --no-build -c Release --logger "trx;LogFileName=unit.trx" --results-directory TestResults --settings tests/coverage.runsettings --collect:"XPlat Code Coverage"

      - name: Testes de integração
        run: dotnet test tests/LegalManager.IntegrationTests --no-build -c Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults --settings tests/coverage.runsettings --collect:"XPlat Code Coverage"

      - name: Publicar resultados dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      # Resumo da cobertura na página do run (Summary) + relatório HTML como artefato.
      - name: Relatório de cobertura
        if: ${{ !cancelled() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage \
            -reporttypes:"Html;MarkdownSummaryGithub;TextSummary"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          cat coverage/Summary.txt

      - name: Publicar relatório de cobertura
        if: ${{ !cancelled() && hashFiles('coverage/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      # Falha o job se a cobertura de linhas (unit + integration) cair abaixo do mínimo.
      - name: Cobertura mínima
        env:
          COBERTURA_MINIMA: 80
        run: |
          linhas=$(grep -m1 'Line coverage:' coverage/Summary.txt | grep -oE '[0-9]+(\.[0-9]+)?')
          echo "Cobertura de linhas: ${linhas}% (mínimo: ${COBERTURA_MINIMA}%)"
          if ! awk -v c="$linhas" -v m="$COBERTURA_MINIMA" 'BEGIN { exit !(c >= m) }'; then
            echo "::error::Cobertura de linhas ${linhas}% abaixo do mínimo de ${COBERTURA_MINIMA}%."
            exit 1
          fi

  frontend:
    name: Sintaxe JS (wwwroot)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Arquivos .js e scripts inline dos .html.
      - name: Verificar sintaxe
        run: node scripts/check-js.mjs
